function StatusPill({ status }) {
  const { byId } = React.useContext(StatusesContext);
  const meta = byId[status] || byId.drafting || APP_STATUS_BY_ID.drafting;
  return <span className="app-status-pill" style={{ background: meta.color }}>{meta.label}</span>;
}

function ApplicationStatusSelect({ value, onChange }) {
  const { statuses } = React.useContext(StatusesContext);
  return (
    <select value={value} onChange={(e) => onChange(e.target.value)}>
      {statuses.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
    </select>
  );
}

// Close an open popover on outside click or Escape. Was pasted inline in
// three components (one copy had drifted and lost the Escape handler).
function useClickOutside(ref, open, close) {
  React.useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => {
      if (ref.current && !ref.current.contains(e.target)) close();
    };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('mousedown', onDocClick);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDocClick);
      document.removeEventListener('keydown', onKey);
    };
  }, [open]);
}

function OverflowChip({ statuses, selectedCount, totalCount, statusFilters, onToggle, onManage }) {
  const [open, setOpen] = React.useState(false);
  const rootRef = React.useRef(null);
  useClickOutside(rootRef, open, () => setOpen(false));
  const active = selectedCount > 0;
  return (
    <div className="chip-overflow" ref={rootRef}>
      <button type="button"
        className={`status-chip overflow-trigger ${active ? 'active' : ''}`}
        onClick={() => setOpen(o => !o)}
        aria-expanded={open}>
        {active
          ? <>{selectedCount} selected</>
          : <>+{totalCount} more</>}
        <span className="caret">▾</span>
      </button>
      {open && (
        <div className="chip-popover">
          {statuses.map(s => {
            const isOn = statusFilters.has(s.id);
            return (
              <button key={s.id} type="button"
                className={`popover-chip ${isOn ? 'active' : ''}`}
                onClick={() => onToggle(s.id)}
                aria-pressed={isOn}>
                <span className="dot" style={{ background: s.color }} />
                {s.label}
                {isOn && <span className="check">✓</span>}
              </button>
            );
          })}
          <div className="popover-divider" />
          <button type="button" className="popover-manage"
            onClick={() => { setOpen(false); onManage(); }}>
            Manage statuses…
          </button>
        </div>
      )}
    </div>
  );
}

function ManageStatusesModal({ allStatuses, customStatuses, setCustomStatuses, setStatusOrder, onClose, onStatusDeleted }) {
  // Draft holds the full ordered list of statuses (built-ins + customs).
  // Built-ins are detected via `isDefault` so their label/color stay locked.
  const DEFAULT_IDS = new Set(APP_STATUSES.map(s => s.id));
  const [draft, setDraft] = React.useState(() =>
    allStatuses.map(s => ({
      id: s.id,
      label: s.label,
      color: s.color,
      isDefault: DEFAULT_IDS.has(s.id),
    }))
  );
  const [newLabel, setNewLabel] = React.useState('');
  const [newColor, setNewColor] = React.useState(STATUS_COLOR_PALETTE[1]);

  const updateOne = (i, patch) => setDraft(d => d.map((s, idx) => idx === i ? { ...s, ...patch } : s));
  const removeOne = (i) => setDraft(d => d.filter((_, idx) => idx !== i));
  const moveOne = (i, delta) => setDraft(d => {
    const j = i + delta;
    if (j < 0 || j >= d.length) return d;
    const next = d.slice();
    [next[i], next[j]] = [next[j], next[i]];
    return next;
  });
  const addOne = () => {
    const label = newLabel.trim();
    if (!label) return;
    const id = `custom-${genId()}`;
    setDraft(d => [...d, { id, label, color: newColor, isDefault: false }]);
    setNewLabel('');
    setNewColor(STATUS_COLOR_PALETTE[(STATUS_COLOR_PALETTE.indexOf(newColor) + 1) % STATUS_COLOR_PALETTE.length]);
  };
  const save = () => {
    const draftCustoms = draft.filter(s => !s.isDefault).map(({ id, label, color }) => ({ id, label, color }));
    const deletedIds = customStatuses.map(s => s.id).filter(id => !draftCustoms.some(d => d.id === id));
    setCustomStatuses(draftCustoms);
    setStatusOrder(draft.map(s => s.id));
    if (deletedIds.length && onStatusDeleted) {
      deletedIds.forEach(id => onStatusDeleted(id));
    }
    onClose();
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal manage-statuses" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h3>Manage statuses</h3>
          <button className="close" onClick={onClose} aria-label="Close">×</button>
        </div>
        <div className="modal-body">
          <p className="hint">Drag the arrows to reorder. Custom statuses can be renamed, recolored, or removed. Built-in statuses keep their label and color.</p>
          <div className="status-rows">
            {draft.length === 0 && <div className="empty">No statuses defined.</div>}
            {draft.map((s, i) => (
              <div key={s.id} className={`status-row ${s.isDefault ? 'default' : ''}`}>
                {s.isDefault ? (
                  <span className="swatch" style={{ background: s.color }} />
                ) : (
                  <ColorSwatchPicker value={s.color} onChange={(c) => updateOne(i, { color: c })} />
                )}
                {s.isDefault ? (
                  <span className="label">{s.label}</span>
                ) : (
                  <input type="text" value={s.label} onChange={(e) => updateOne(i, { label: e.target.value })}
                    placeholder="Status label" />
                )}
                {s.isDefault && <span className="locked">built-in</span>}
                <button className="icon" onClick={() => moveOne(i, -1)} disabled={i === 0} title="Move up">↑</button>
                <button className="icon" onClick={() => moveOne(i, 1)} disabled={i === draft.length - 1} title="Move down">↓</button>
                {!s.isDefault && (
                  <button className="icon danger" onClick={() => removeOne(i)} title="Remove">×</button>
                )}
              </div>
            ))}
          </div>
          <div className="add-row">
            <ColorSwatchPicker value={newColor} onChange={setNewColor} />
            <input type="text" value={newLabel} onChange={(e) => setNewLabel(e.target.value)}
              placeholder="New status (e.g. Tech screen, Take-home)"
              onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addOne(); } }} />
            <button className="primary" onClick={addOne} disabled={!newLabel.trim()}>Add</button>
          </div>
        </div>
        <div className="modal-foot">
          <button onClick={onClose}>Cancel</button>
          <button className="primary" onClick={save}>Save changes</button>
        </div>
      </div>
    </div>
  );
}

function ColorSwatchPicker({ value, onChange }) {
  const [open, setOpen] = React.useState(false);
  const rootRef = React.useRef(null);
  useClickOutside(rootRef, open, () => setOpen(false));
  return (
    <div className="swatch-picker" ref={rootRef}>
      <button type="button" className="swatch-trigger" style={{ background: value }}
        onClick={() => setOpen(o => !o)} title="Pick a color" aria-haspopup="true" aria-expanded={open} />
      {open && (
        <div className="swatch-popover">
          {STATUS_COLOR_PALETTE.map(c => (
            <button key={c} type="button" className="swatch-option"
              style={{ background: c, outline: c === value ? '2px solid #2a2a26' : 'none', outlineOffset: 1 }}
              onClick={() => { onChange(c); setOpen(false); }} />
          ))}
        </div>
      )}
    </div>
  );
}

function ApplicationCard({ app, isActive, expanded, onToggle, onPatch, onDelete, onView,
                           onPromote, onDemote, onDuplicate, canDemote = true, canDelete = true,
                           snapshots = [], onCaptureSnapshot, onOpenSnapshot, onDeleteSnapshot }) {
  const patch = (k, v) => onPatch({ ...app, [k]: v });
  const fmtDate = (iso) => {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleDateString(); } catch { return iso; }
  };
  const fmtStamp = (iso) => {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }); }
    catch { return iso; }
  };
  return (
    <div className={`app-card ${expanded ? 'expanded' : ''} ${app.isBase ? 'base-app' : ''} ${isActive ? 'active' : ''}`}>
      <div className="app-card-summary" onClick={onToggle}>
        {app.isBase
          ? <span className="base-pill" title="Base application — starting point for new applications">BASE</span>
          : <StatusPill status={app.status} />}
        <div className="who">
          <div className="company">{
            app.isBase
              ? (app.company || <span style={{ color: '#b0aca0', fontStyle: 'italic', fontWeight: 400 }}>Unnamed base</span>)
              : (app.company || <span style={{ color: '#b0aca0', fontStyle: 'italic', fontWeight: 400 }}>Untitled application</span>)
          }</div>
          {!app.isBase && <div className="role">{app.position || '—'}</div>}
        </div>
        <div className="meta">
          {!app.isBase && (
            <span>{app.appliedDate ? `Applied ${fmtDate(app.appliedDate)}` : 'Not yet applied'}</span>
          )}
          <span className="updated">Updated {fmtDate(app.updatedAt)}</span>
          {/* Visible while the card is collapsed, because a copy taken silently
              that you cannot see was taken is indistinguishable from no copy. */}
          {snapshots.length > 0 && (
            <span className="snap-count" title="A copy of the CV and cover letter was frozen when this application went out">
              {snapshots.length === 1 ? '1 sent copy' : `${snapshots.length} sent copies`}
            </span>
          )}
        </div>
      </div>
      {expanded && <>
        <div className="app-card-body">
          {app.isBase ? (
            <div className="field full">
              <label>Name</label>
              <input type="text" value={app.company} onChange={(e) => patch('company', e.target.value)} placeholder="Base CV" />
            </div>
          ) : (
            <>
              <div className="field">
                <label>Company</label>
                <input type="text" value={app.company} onChange={(e) => patch('company', e.target.value)} placeholder="Acme Inc." />
              </div>
              <div className="field">
                <label>Position</label>
                <input type="text" value={app.position} onChange={(e) => patch('position', e.target.value)} placeholder="Senior PM" />
              </div>
            </>
          )}
          {!app.isBase && (
            <div className="field full">
              <label>Posting URL</label>
              <input type="text" value={app.postingUrl} onChange={(e) => patch('postingUrl', e.target.value)} placeholder="https://..." />
            </div>
          )}
          {!app.isBase && (
            <div className="field">
              <label>Applied date</label>
              <input type="date" value={app.appliedDate || ''} onChange={(e) => patch('appliedDate', e.target.value)} />
            </div>
          )}
          {!app.isBase && (
            <div className="field">
              <label>Status</label>
              <ApplicationStatusSelect value={app.status} onChange={(v) => patch('status', v)} />
            </div>
          )}
          <div className="field full">
            <label>Notes</label>
            <textarea value={app.notes} onChange={(e) => patch('notes', e.target.value)} placeholder={app.isBase ? "Notes about this base — when to use it, what role family it targets…" : "Recruiter contact, follow-up reminders, interview prep…"} />
          </div>
        </div>
        {/* A Base is a starting point, never something you send, so it has no
            status to leave and nothing to freeze. */}
        {!app.isBase && (
          <div className="app-snapshots">
            <div className="snap-head">
              <span>Sent copies</span>
              <button type="button" onClick={() => onCaptureSnapshot(app)}
                title="Freeze the CV and cover letter exactly as they are right now">
                Freeze a copy now
              </button>
            </div>
            {snapshots.length === 0 ? (
              <div className="snap-empty">
                Nothing frozen yet. A copy is taken automatically the first time this application
                leaves Drafting, so months later you can still read exactly what you sent.
              </div>
            ) : (
              <ul>
                {snapshots.map(s => (
                  <li key={s.id}>
                    <span className="when">{fmtStamp(s.takenAt)}</span>
                    {/* The status name is the one recorded at capture, not a
                        lookup: a custom status can be deleted later, and the
                        copy should still say what it went out as. */}
                    <span className="what">
                      {s.statusLabel || s.status || 'Sent'}{s.auto ? '' : ' · frozen by hand'}
                    </span>
                    <button type="button" onClick={() => onOpenSnapshot(s.id, 'cv')}
                      title="Read the CV as it was at that moment">View CV</button>
                    <button type="button" onClick={() => onOpenSnapshot(s.id, 'letter')}
                      title="Read the cover letter as it was at that moment">View letter</button>
                    <button type="button" className="danger" onClick={() => onDeleteSnapshot(s.id)}
                      title="Delete this frozen copy — the application keeps its current CV">Delete</button>
                  </li>
                ))}
              </ul>
            )}
          </div>
        )}
        <div className="app-card-actions">
          <button onClick={() => onView('cv')} title="Open and edit the CV for this application">Edit CV</button>
          <button onClick={() => onView('letter')} title="Open and edit the cover letter for this application">Edit cover letter</button>
          <button onClick={() => onDuplicate(app.id)} title="Create a new application by cloning this one">Duplicate</button>
          {app.isBase ? (
            <button onClick={() => onDemote(app.id)} disabled={!canDemote}
              title={canDemote ? 'Remove the Base flag from this application' : 'At least one application must remain a Base'}>
              Demote from Base
            </button>
          ) : (
            <button onClick={() => onPromote(app.id)} title="Mark this application as a Base — a starting point for future applications">Promote to Base</button>
          )}
          {!app.isBase && app.postingUrl && <button onClick={() => window.open(app.postingUrl, '_blank', 'noopener')} title="Open posting in new tab">Open posting ↗</button>}
          <span style={{ flex: 1 }} />
          <button className="danger" onClick={onDelete} disabled={!canDelete}
            title={canDelete ? 'Permanently delete this application' : 'Cannot delete the last Base — promote another application first'}>
            Delete
          </button>
        </div>
      </>}
    </div>
  );
}

function NewApplicationForm({ apps, defaultForkId, onCancel, onSubmit }) {
  const [company, setCompany] = React.useState('');
  const [position, setPosition] = React.useState('');
  const [forkFromId, setForkFromId] = React.useState(defaultForkId || (apps[0] && apps[0].id) || '');
  // Default template = template of the fork source. Updates when fork source changes.
  // Memoised: loadAppCv parses the source's full CV out of localStorage, and this
  // component re-renders on every keystroke in the Company/Position fields.
  const forkSource = apps.find(a => a.id === forkFromId);
  const inheritedTemplateId = React.useMemo(() => {
    const srcCv = forkSource && loadAppCv(forkSource.id);
    return resolveTemplateId(srcCv && srcCv.templateId);
  }, [forkFromId]);
  const [templateId, setTemplateId] = React.useState(inheritedTemplateId);
  const [templateOpen, setTemplateOpen] = React.useState(false);
  const templateRef = React.useRef(null);
  React.useEffect(() => { setTemplateId(inheritedTemplateId); /* re-inherit when source changes */ // eslint-disable-next-line
  }, [forkFromId]);
  useClickOutside(templateRef, templateOpen, () => setTemplateOpen(false));
  const bases = apps.filter(a => a.isBase);
  const others = apps.filter(a => !a.isBase);
  const submit = (e) => {
    if (e) e.preventDefault();
    if (!company.trim() && !position.trim()) {
      alert('Add at least a company or position before creating an application.');
      return;
    }
    if (!forkFromId) {
      alert('Pick an application to fork from.');
      return;
    }
    onSubmit({
      company: company.trim(),
      position: position.trim(),
      forkFromId,
      templateId,
    });
  };
  return (
    <form className="new-app-form" onSubmit={submit}>
      <div className="field">
        <label>Company</label>
        <input type="text" autoFocus value={company} onChange={(e) => setCompany(e.target.value)} placeholder="Acme Inc." />
      </div>
      <div className="field">
        <label>Position</label>
        <input type="text" value={position} onChange={(e) => setPosition(e.target.value)} placeholder="Senior Project Manager" />
      </div>
      <div className="field full">
        <label>Fork from</label>
        <select value={forkFromId} onChange={(e) => setForkFromId(e.target.value)}>
          {bases.length > 0 && (
            <optgroup label="Base applications">
              {bases.map(a => <option key={a.id} value={a.id}>{appDisplayLabel(a)}</option>)}
            </optgroup>
          )}
          {others.length > 0 && (
            <optgroup label="Other applications">
              {others.map(a => <option key={a.id} value={a.id}>{appDisplayLabel(a)}</option>)}
            </optgroup>
          )}
        </select>
        <div className="preview">CV and cover letter will be copied from this application.</div>
      </div>
      <div className="field full">
        <label>Template</label>
        <div className="new-app-template-picker" ref={templateRef}>
          <button type="button" className="picker-trigger" onClick={() => setTemplateOpen(o => !o)}>
            <TemplateWireframe templateId={templateId} size="sm" />
            <span className="name">{TEMPLATES[templateId].label}</span>
            <span className="caret">▾</span>
          </button>
          {templateOpen && (
            <div className="picker-popover">
              {Object.entries(TEMPLATES).map(([id, t]) => (
                <button key={id} type="button"
                  className={`picker-option ${id === templateId ? 'active' : ''}`}
                  onClick={() => { setTemplateId(id); setTemplateOpen(false); }}>
                  <TemplateWireframe templateId={id} size="lg" />
                  <span className="name">{t.label}</span>
                  {id === templateId && <span className="check">✓</span>}
                </button>
              ))}
              <div className="picker-foot">You can change this any time later.</div>
            </div>
          )}
        </div>
      </div>
      <div className="field full actions">
        <button type="button" onClick={onCancel}>Cancel</button>
        <button type="submit" className="primary">Create application</button>
      </div>
    </form>
  );
}

// The newest action gets a button, not a menu item: an undo you have to go
// looking for is not an undo. Older entries are one click behind it, because a
// strict undo stack would force you to reverse a delete you meant just to reach
// the import you did not.
function UndoBar({ log = [], onUndo, onClear }) {
  const [open, setOpen] = React.useState(false);
  const rootRef = React.useRef(null);
  useClickOutside(rootRef, open, () => setOpen(false));
  if (!log.length) return null;
  const [newest, ...older] = log;
  const now = Date.now();
  const retention = `Only the last ${UNDO_MAX_ENTRIES} actions are kept, for ${Math.round(UNDO_MAX_AGE_MS / 86400000)} days.`;
  return (
    <div className="undo-bar">
      <span className="undo-what">
        {undoEntryTitle(newest)} <span className="undo-when">· {relativeTime(newest.at, now)}</span>
      </span>
      <button type="button" className="primary" onClick={() => onUndo(newest.id)}>
        {undoEntryAction(newest)}
      </button>
      {older.length > 0 && (
        <div className="undo-more" ref={rootRef}>
          <button type="button" onClick={() => setOpen(o => !o)} aria-expanded={open}>
            {older.length} earlier<span className="caret">▾</span>
          </button>
          {open && (
            <div className="chip-popover undo-popover">
              {older.map(e => (
                <button key={e.id} type="button" className="popover-chip"
                  onClick={() => { setOpen(false); onUndo(e.id); }}>
                  <span className="label">{undoEntryTitle(e)}</span>
                  <span className="when">{undoEntryAction(e)} · {relativeTime(e.at, now)}</span>
                </button>
              ))}
              <div className="popover-divider" />
              <div className="undo-note">{retention}</div>
            </div>
          )}
        </div>
      )}
      {/* Undo history is a copy of things you deleted, so the way to get rid of
          it has to be in plain sight rather than behind the menu above. */}
      <button type="button" className="undo-clear" onClick={onClear}
        title={`Delete the copies kept for undo, now. ${retention}`}>
        Clear history
      </button>
    </div>
  );
}

function ApplicationsDocument({ apps, activeAppId, onView, onCreate,
                                onPatch, onPromote, onDemote, onDuplicate, onDelete,
                                onDownloadTemplate, onImportPack,
                                undoLog, onUndo, onClearUndo,
                                snapshots, onCaptureSnapshot, onOpenSnapshot, onDeleteSnapshot,
                                customStatuses, setCustomStatuses, setStatusOrder, onStatusDeleted }) {
  const packInputRef = React.useRef(null);
  const { statuses: allStatuses, byId: allStatusesById } = React.useContext(StatusesContext);
  const [expandedId, setExpandedId] = React.useState(null);
  const [showForm, setShowForm] = React.useState(false);
  const [statusFilters, setStatusFilters] = React.useState(() => new Set());
  const [query, setQuery] = React.useState('');
  const [showManageStatuses, setShowManageStatuses] = React.useState(false);

  const baseCount = apps.filter(a => a.isBase).length;
  const filtersActive = statusFilters.size > 0 || !!query.trim();
  const toggleStatusFilter = (id) => {
    setStatusFilters(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };
  const clearStatusFilters = () => setStatusFilters(new Set());

  const INLINE_CHIPS = 7;
  const inlineStatuses = allStatuses.slice(0, INLINE_CHIPS - 1);
  const overflowStatuses = allStatuses.slice(INLINE_CHIPS - 1);
  const overflowCount = overflowStatuses.length;
  const overflowSelectedCount = overflowStatuses.reduce((n, s) => n + (statusFilters.has(s.id) ? 1 : 0), 0);

  const displayed = React.useMemo(() => {
    let list = apps;
    if (filtersActive) list = list.filter(a => !a.isBase);
    if (statusFilters.size > 0) list = list.filter(a => statusFilters.has(a.status));
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter(a =>
        (a.company || '').toLowerCase().includes(q)
        || (a.position || '').toLowerCase().includes(q)
        || (a.notes || '').toLowerCase().includes(q)
        || (a.postingUrl || '').toLowerCase().includes(q)
      );
    }
    return sortAppsForList(list);
  }, [apps, statusFilters, query, filtersActive]);

  const onSubmitNew = async (params) => {
    const id = await onCreate(params);
    setShowForm(false);
    if (id) setExpandedId(id);
  };

  const renderChip = (s) => {
    const active = statusFilters.has(s.id);
    return (
      <button key={s.id} type="button"
        className={`status-chip ${active ? 'active' : ''}`}
        onClick={() => toggleStatusFilter(s.id)}
        aria-pressed={active}
        style={active ? { borderColor: s.color, background: s.color, color: '#fff' } : undefined}>
        <span className="dot" style={{ background: s.color }} />
        {s.label}
      </button>
    );
  };

  const selectedLabels = Array.from(statusFilters).map(id => (allStatusesById[id] || {}).label).filter(Boolean);

  return (
    <div className="apps-shell">
      <div className="apps-header">
        <h2>Applications</h2>
        <span className="apps-header-actions">
          <button type="button" className="ghost" onClick={onDownloadTemplate}
            title="Download a JSON job pack, pre-filled from your base CV and annotated for whoever fills it in">
            Job pack template
          </button>
          <button type="button" className="ghost" onClick={() => packInputRef.current && packInputRef.current.click()}
            title="Add applications from a filled-in job pack. Your existing applications are left alone.">
            Import pack
          </button>
          {/* Cleared after every pick so choosing the same file twice still fires. */}
          <input type="file" accept="application/json,.json" ref={packInputRef}
            style={{ display: 'none' }}
            onChange={async (e) => {
              const file = e.target.files && e.target.files[0];
              e.target.value = '';
              if (!file) return;
              onImportPack(await file.text());
            }} />
          {!showForm && (
            <button onClick={() => setShowForm(true)} title="Start a new application by forking an existing one">
              + New application
            </button>
          )}
        </span>
      </div>
      {showForm && (
        <NewApplicationForm
          apps={apps}
          defaultForkId={(apps.find(a => a.isBase) || apps[0])?.id}
          onCancel={() => setShowForm(false)}
          onSubmit={onSubmitNew}
        />
      )}
      <UndoBar log={undoLog} onUndo={onUndo} onClear={onClearUndo} />
      <div className="apps-filters">
        <div className="status-chips" role="group" aria-label="Filter by status">
          <button type="button"
            className={`status-chip ${statusFilters.size === 0 ? 'active' : ''}`}
            onClick={clearStatusFilters}
            title={statusFilters.size > 0 ? 'Clear all status filters' : undefined}>All</button>
          {inlineStatuses.map(renderChip)}
          {overflowCount > 0 && (
            <OverflowChip
              statuses={overflowStatuses}
              selectedCount={overflowSelectedCount}
              totalCount={overflowCount}
              statusFilters={statusFilters}
              onToggle={toggleStatusFilter}
              onManage={() => setShowManageStatuses(true)}
            />
          )}
          {overflowCount === 0 && (
            <button type="button" className="manage-statuses-link"
              onClick={() => setShowManageStatuses(true)}
              title="Add or edit custom statuses">+ Add status</button>
          )}
        </div>
        <div className="apps-search">
          <input type="search" value={query} onChange={(e) => setQuery(e.target.value)}
            placeholder="Search company, position, notes…" aria-label="Search applications" />
          {query && (
            <button type="button" className="clear" onClick={() => setQuery('')} aria-label="Clear search" title="Clear">×</button>
          )}
        </div>
      </div>
      <div className="app-list">
        {displayed.map(app => (
          <ApplicationCard
            key={app.id}
            app={app}
            isActive={app.id === activeAppId}
            expanded={expandedId === app.id}
            onToggle={() => setExpandedId(expandedId === app.id ? null : app.id)}
            onPatch={onPatch}
            onView={(docKind) => onView(app, docKind)}
            onPromote={onPromote}
            onDemote={onDemote}
            onDuplicate={onDuplicate}
            onDelete={() => onDelete(app.id)}
            canDemote={!(app.isBase && baseCount <= 1)}
            canDelete={!(app.isBase && baseCount <= 1)}
            snapshots={snapshotsForApp(snapshots, app.id)}
            onCaptureSnapshot={onCaptureSnapshot}
            onOpenSnapshot={onOpenSnapshot}
            onDeleteSnapshot={onDeleteSnapshot}
          />
        ))}
        {filtersActive && displayed.length === 0 && (
          <div className="apps-empty" style={{ marginTop: 8 }}>
            No applications match {selectedLabels.length > 0 ? <strong>{selectedLabels.join(' / ')}</strong> : 'this search'}
            {selectedLabels.length > 0 && query && ' and the current search'}.
            {' '}
            <button type="button" className="link"
              onClick={() => { clearStatusFilters(); setQuery(''); }}>Clear filters</button>
          </div>
        )}
      </div>
      {showManageStatuses && (
        <ManageStatusesModal
          allStatuses={allStatuses}
          customStatuses={customStatuses}
          setCustomStatuses={setCustomStatuses}
          setStatusOrder={setStatusOrder}
          onClose={() => setShowManageStatuses(false)}
          onStatusDeleted={onStatusDeleted}
        />
      )}
    </div>
  );
}

function SnapshotBanner({ snap, onClose }) {
  return (
    <div className="snapshot-banner">
      <span>Viewing snapshot — <strong>{snap.appLabel}</strong></span>
      <button onClick={onClose}>Close</button>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
//  App root
// ════════════════════════════════════════════════════════════════
function App() {
  const [editOn, setEditOnState] = React.useState(() => {
    const saved = localStorage.getItem('cv-edit-on');
    return saved == null ? true : saved === '1';
  });
  React.useEffect(() => {
    window.__EDIT_ON = editOn;
    localStorage.setItem('cv-edit-on', editOn ? '1' : '0');
  }, [editOn]);
  const setEditOn = (v) => { window.__EDIT_ON = v; setEditOnState(v); };

  const [zoom, setZoom] = React.useState(() => {
    const v = parseFloat(localStorage.getItem('cv-zoom'));
    return Number.isFinite(v) && v >= 0.25 && v <= 2 ? v : 1;
  });
  React.useEffect(() => { localStorage.setItem('cv-zoom', String(zoom)); }, [zoom]);
  const clampZoom = (v) => Math.max(0.25, Math.min(2, Math.round(v * 100) / 100));

  // ── Custom statuses ──────────────────────────────────────────
  const [customStatuses, setCustomStatusesState] = React.useState(() => loadCustomStatuses());
  const setCustomStatuses = (next) => {
    const list = typeof next === 'function' ? next(customStatuses) : next;
    setCustomStatusesState(list);
    saveCustomStatuses(list);
  };
  const [statusOrder, setStatusOrderState] = React.useState(() => loadStatusOrder());
  const setStatusOrder = (next) => {
    const list = typeof next === 'function' ? next(statusOrder) : next;
    setStatusOrderState(list);
    saveStatusOrder(list);
  };
  const allStatuses = React.useMemo(
    () => combineStatuses(customStatuses, statusOrder),
    [customStatuses, statusOrder]
  );
  const allStatusesById = React.useMemo(
    () => Object.fromEntries(allStatuses.map(s => [s.id, s])),
    [allStatuses]
  );
  const statusesContextValue = React.useMemo(
    () => ({ statuses: allStatuses, byId: allStatusesById }),
    [allStatuses, allStatusesById]
  );

  // ── Folder-package sync ──────────────────────────────────────
  // syncState: 'unsupported' | 'idle' | 'connecting' | 'bound' | 'needs-reconnect' | 'error'
  const [syncState, setSyncState] = React.useState(() => FSA_SUPPORTED ? 'idle' : 'unsupported');
  const [syncDirHandle, setSyncDirHandle] = React.useState(null);
  const [syncDirName, setSyncDirName] = React.useState('');
  const [syncBannerDismissed, setSyncBannerDismissed] = React.useState(() => {
    try { return localStorage.getItem(SYNC_DISMISSED_KEY) === '1'; } catch { return false; }
  });
  const dismissSyncBanner = () => {
    setSyncBannerDismissed(true);
    try { localStorage.setItem(SYNC_DISMISSED_KEY, '1'); } catch {}
  };
  const syncDirHandleRef = React.useRef(null);
  React.useEffect(() => { syncDirHandleRef.current = syncDirHandle; }, [syncDirHandle]);

  // ── Application state (post-migration model) ─────────────────
  const [apps, setApps] = React.useState(() => {
    const list = loadAppsMeta();
    if (list.length > 0) return list;
    // Bootstrap: no apps at all → create a fresh Base
    const id = genId();
    saveAppCv(id, SEED_CV);
    const meta = makeAppMeta({
      id, isBase: true,
      company: 'Base CV', position: 'Master CV',
      headshotKey: appHeadshotKeyV2(id),
    });
    saveAppsMeta([meta]);
    persistActiveAppId(id);
    return [meta];
  });
  React.useEffect(() => { saveAppsMeta(apps); }, [apps]);

  // ── Undo trail ───────────────────────────────────────────────
  // Seeded synchronously from localStorage because the whole point is that the
  // control is there after a reload: "that pack was wrong" is a thought people
  // have on the way back to the tab, not before they left it.
  const [undoLog, setUndoLog] = React.useState(() => loadUndoLog());
  React.useEffect(() => { pruneUndoLogOnLoad().then(setUndoLog); }, []);

  const [activeAppId, setActiveAppIdState] = React.useState(() => {
    const id = loadActiveAppId();
    const list = loadAppsMeta();
    if (id && list.some(a => a.id === id)) return id;
    return (list.find(a => a.isBase) || list[0] || {}).id || null;
  });
  const setActiveAppId = (id) => {
    setActiveAppIdState(id);
    if (id) persistActiveAppId(id);
  };

  const [doc, setDocState] = React.useState(() => {
    const v = localStorage.getItem('cv-active-doc');
    return (v === 'letter' || v === 'applications') ? v : 'cv';
  });
  const setDoc = (v) => { setDocState(v); try { localStorage.setItem('cv-active-doc', v); } catch {} };

  // Both floating panels default to flanking the document. Their final left
  // offsets are computed here and published as CSS variables, so the panels
  // stay pure CSS until dragged and there is one place that knows the maths.
  //
  // Everything is expressed as `left`, in getBoundingClientRect coordinates.
  // Using `right` instead would mean mixing in the viewport width, and
  // `scrollbar-gutter: stable` on <html> makes that ambiguous: clientWidth
  // reports the full width while a fixed element's box excludes the reserved
  // gutter, which put the right-hand panel a gutter's width out of place.
  React.useLayoutEffect(() => {
    const root = document.documentElement;
    const setEdges = () => {
      const page = document.querySelector('.cv-page');
      if (!page) return;
      const r = page.getBoundingClientRect();
      const GAP = 16, EDGE = 8, TW_W = 280;
      // Properties panel sits in the gutter LEFT of the document; clamp to the
      // screen edge when the window is too narrow for a full gutter.
      root.style.setProperty('--tw-left',
        `${Math.round(Math.max(EDGE, r.left - TW_W - GAP))}px`);
    };
    setEdges();
    window.addEventListener('resize', setEdges);
    return () => window.removeEventListener('resize', setEdges);
  }, [zoom, doc]);

  const [viewingSnapshot, setViewingSnapshot] = React.useState(null);
  // The index of frozen copies. Capture waits on IndexedDB before it has an
  // entry to add, so the list it must add to is whatever is current when it
  // finishes rather than what was on screen when it started — hence the ref.
  // State exists only so the cards re-render; the ref is the truth, and every
  // write goes through setSnapshots so the two and localStorage cannot drift.
  const [snapshots, setSnapshotsState] = React.useState(() => loadSnapshotIndex() || []);
  const snapshotsRef = React.useRef(snapshots);
  const setSnapshots = (list) => {
    snapshotsRef.current = list;
    setSnapshotsState(list);
    saveSnapshotIndex(list);
  };
  const editPriorRef = React.useRef(null);
  React.useEffect(() => {
    if (viewingSnapshot) {
      editPriorRef.current = window.__EDIT_ON;
      window.__EDIT_ON = false;
      setEditOnState(false);
    } else if (editPriorRef.current != null) {
      window.__EDIT_ON = editPriorRef.current;
      setEditOnState(editPriorRef.current);
      editPriorRef.current = null;
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [viewingSnapshot]);

  // Active app's CV blob — lazy loaded from cv-app:<id>
  const [cv, setCv] = React.useState(() => {
    const id = loadActiveAppId();
    const blob = id ? loadAppCv(id) : null;
    return deepMerge(SEED_CV, blob || {});
  });
  // Track which app the current cv state belongs to (so saves go to the right key)
  const cvAppIdRef = React.useRef(activeAppId);
  // Skip save effect on initial mount / app switches (we just loaded that data; saving back is a no-op)
  const skipNextSaveRef = React.useRef(true);

  // Load CV blob when activeAppId changes
  React.useEffect(() => {
    if (!activeAppId) return;
    if (cvAppIdRef.current === activeAppId) return; // already loaded
    const blob = loadAppCv(activeAppId);
    skipNextSaveRef.current = true;
    setCv(deepMerge(SEED_CV, blob || {}));
    cvAppIdRef.current = activeAppId;
  }, [activeAppId]);

  // Debounced persist of cv to its app + bump updatedAt
  React.useEffect(() => {
    if (!activeAppId || !cv) return;
    if (skipNextSaveRef.current) { skipNextSaveRef.current = false; return; }
    const t = setTimeout(() => {
      saveAppCv(activeAppId, cv);
      setApps(prev => prev.map(a => a.id === activeAppId
        ? { ...a, updatedAt: new Date().toISOString() }
        : a));
    }, 250);
    return () => clearTimeout(t);
  }, [cv, activeAppId]);

  const update = React.useCallback((path, value) => {
    setCv(prev => setPath(prev, path, value));
  }, []);
  // update() can only ever write; this is how a caller unsets a key for real.
  // Both go through setCv, so a removal is picked up by the debounced persist
  // effect above exactly like any other edit and survives a reload.
  const removePath = React.useCallback((path) => {
    setCv(prev => deletePath(prev, path));
  }, []);

  // Headshot (IDB per active app)
  const [headshotSrc, setHeadshotSrc] = React.useState(null);
  React.useEffect(() => {
    let cancelled = false;
    setHeadshotSrc(null);
    if (!activeAppId) return;
    idbGet(appHeadshotKeyV2(activeAppId)).then(v => { if (!cancelled) setHeadshotSrc(v || null); });
    return () => { cancelled = true; };
  }, [activeAppId]);
  const onHeadshotSrc = (dataUrl) => {
    setHeadshotSrc(dataUrl);
    if (activeAppId) idbPut(appHeadshotKeyV2(activeAppId), dataUrl);
    update(['headshot'], { ...cv.headshot, x: 0, y: 0, scale: 1 });
    // Mirror to bound folder
    const handle = syncDirHandleRef.current;
    if (handle && activeAppId) {
      writeImageFile(handle, activeAppId, dataUrl)
        .then(() => writeJsonSync(handle))
        .catch(e => console.warn('sync image write failed', e));
    }
  };
  const onHeadshotTransform = (t) => update(['headshot'], t);
  const onHeadshotClear = () => {
    setHeadshotSrc(null);
    if (activeAppId) idbDel(appHeadshotKeyV2(activeAppId));
    update(['headshot'], { ...cv.headshot, x: 0, y: 0, scale: 1 });
    const handle = syncDirHandleRef.current;
    if (handle && activeAppId) {
      deleteImageFile(handle, activeAppId)
        .then(() => writeJsonSync(handle))
        .catch(e => console.warn('sync image delete failed', e));
    }
  };

  const activeApp = apps.find(a => a.id === activeAppId) || null;

  // ── Sync lifecycle ─────────────────────────────────────────
  // On mount: if a handle is stored, try to reconnect and hydrate.
  React.useEffect(() => {
    if (!FSA_SUPPORTED) return;
    let cancelled = false;
    (async () => {
      const handle = await loadDirHandleStored();
      if (!handle || cancelled) return;
      setSyncDirName(handle.name);
      const perm = await queryDirPermission(handle);
      if (cancelled) return;
      if (perm === 'granted') {
        try {
          const data = await readDataFile(handle);
          if (data && Array.isArray(data.apps)) {
            await hydrateFromPayload(handle, data);
            if (cancelled) return;
            // Re-load state from updated storage
            const fresh = loadAppsMeta();
            setApps(fresh);
            const aid = loadActiveAppId();
            if (aid) {
              cvAppIdRef.current = null;
              skipNextSaveRef.current = true;
              setCv(deepMerge(SEED_CV, loadAppCv(aid) || {}));
              cvAppIdRef.current = aid;
              setActiveAppIdState(aid);
              const bytes = await idbGet(appHeadshotKeyV2(aid));
              if (!cancelled) setHeadshotSrc(bytes || null);
            }
          }
          if (!cancelled) {
            setSyncDirHandle(handle);
            setSyncState('bound');
          }
        } catch (e) {
          console.error('Hydrate from file failed', e);
          if (!cancelled) setSyncState('needs-reconnect');
        }
      } else {
        setSyncDirHandle(handle);
        setSyncState('needs-reconnect');
      }
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Debounced JSON write when state changes while bound.
  React.useEffect(() => {
    if (syncState !== 'bound' || !syncDirHandle) return;
    const t = setTimeout(async () => {
      try { await writeJsonSync(syncDirHandle); }
      catch (e) {
        console.warn('sync json write failed', e);
        if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
          setSyncState('needs-reconnect');
        }
      }
    }, 600);
    return () => clearTimeout(t);
  }, [apps, cv, syncState, syncDirHandle]);

  const onSetUpSync = async () => {
    if (!FSA_SUPPORTED) return;
    setSyncState('connecting');
    try {
      const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
      const existing = await readDataFile(handle);
      const hasExisting = !!(existing && Array.isArray(existing.apps) && existing.apps.length > 0);
      let useFile = false;
      if (hasExisting) {
        useFile = confirm(
          `"${handle.name}" already contains ${existing.apps.length} application(s).\n\n` +
          `OK → Load file data into the browser (replaces current browser data)\n` +
          `Cancel → Overwrite the file with current browser data`
        );
      }
      if (useFile) {
        await hydrateFromPayload(handle, existing);
        // Refresh React state from storage
        const fresh = loadAppsMeta();
        setApps(fresh);
        const aid = loadActiveAppId();
        if (aid) {
          cvAppIdRef.current = null;
          skipNextSaveRef.current = true;
          setCv(deepMerge(SEED_CV, loadAppCv(aid) || {}));
          cvAppIdRef.current = aid;
          setActiveAppIdState(aid);
          const bytes = await idbGet(appHeadshotKeyV2(aid));
          setHeadshotSrc(bytes || null);
        }
      } else {
        await writeFullSync(handle);
      }
      await persistDirHandle(handle);
      setSyncDirHandle(handle);
      setSyncDirName(handle.name);
      setSyncState('bound');
      dismissSyncBanner();
    } catch (e) {
      if (e && e.name === 'AbortError') {
        setSyncState(syncDirHandle ? 'needs-reconnect' : 'idle');
        return;
      }
      console.error('Set up sync failed', e);
      alert('Sync setup failed: ' + (e && e.message || String(e)));
      setSyncState('error');
    }
  };

  const onReconnectSync = async () => {
    if (!syncDirHandle) return;
    const perm = await requestDirPermission(syncDirHandle);
    if (perm === 'granted') {
      try {
        const data = await readDataFile(syncDirHandle);
        if (data) {
          await hydrateFromPayload(syncDirHandle, data);
          const fresh = loadAppsMeta();
          setApps(fresh);
          const aid = loadActiveAppId();
          if (aid) {
            cvAppIdRef.current = null;
            skipNextSaveRef.current = true;
            setCv(deepMerge(SEED_CV, loadAppCv(aid) || {}));
            cvAppIdRef.current = aid;
            setActiveAppIdState(aid);
            const bytes = await idbGet(appHeadshotKeyV2(aid));
            setHeadshotSrc(bytes || null);
          }
        }
        setSyncState('bound');
      } catch (e) {
        console.error('Reconnect hydrate failed', e);
        setSyncState('error');
      }
    }
  };

  const onUnbindSync = async () => {
    if (!confirm('Stop syncing this folder?\n\nYour data stays in the browser. The folder files remain untouched.')) return;
    await clearDirHandle();
    setSyncDirHandle(null);
    setSyncDirName('');
    setSyncState('idle');
  };

  const slug = (s) => (s || '').trim().replace(/\s+/g, '-').replace(/[^A-Za-z0-9\-]/g, '');
  const outputBase = () => {
    if (viewingSnapshot) {
      const namePart = slug((viewingSnapshot.cv && viewingSnapshot.cv.name) || cv.name) || 'Untitled';
      const docPart = viewingSnapshot.doc === 'letter' ? 'Cover-Letter' : 'CV';
      const labelPart = slug(viewingSnapshot.appLabel) || 'Application';
      return `${namePart}_${docPart}_${labelPart}`;
    }
    const namePart = slug(cv.name) || 'Untitled';
    const docPart = doc === 'letter' ? 'Cover-Letter' : 'CV';
    const labelPart = slug(appDisplayLabel(activeApp)) || 'Application';
    return `${namePart}_${docPart}_${labelPart}`;
  };

  React.useEffect(() => {
    document.title = outputBase();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [cv.name, doc, activeAppId, viewingSnapshot]);

  const onPrint = () => { window.print(); };

  // Program-level backup: dump all apps + their CV blobs + headshot bytes
  const onExport = async () => {
    const payload = {
      schemaVersion: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      apps: [],
    };
    for (const meta of apps) {
      const cvBlob = loadAppCv(meta.id);
      let headshot = null;
      try { headshot = await idbGet(appHeadshotKeyV2(meta.id)); } catch {}
      payload.apps.push({ meta, cv: cvBlob, headshot });
    }
    // Frozen copies ride along. They are the record of what you actually sent,
    // and a record that dies with the laptop is not one — this file is the only
    // way they reach a new machine, since the folder mirror deliberately leaves
    // them behind. Both fields are additions to a v2 payload: schemaVersion
    // stays 2, so an older build restores this file through the same branch it
    // always did and simply ignores what it does not know about.
    //
    // The images sit in a shared map rather than inline on each copy because
    // several copies of one application usually froze the same photo, and this
    // file is already heavy with headshots.
    payload.snapshots = [];
    payload.snapshotImages = {};
    for (const s of snapshots) {
      const blob = await idbGet(snapshotCvKey(s.id));
      if (!blob) continue; // index entry with no payload; the sweep will tidy it
      if (s.imgKey && !payload.snapshotImages[s.imgKey]) {
        const bytes = await idbGet(s.imgKey);
        if (bytes) payload.snapshotImages[s.imgKey] = bytes;
      }
      payload.snapshots.push({ ...s, cv: blob });
    }
    const namePart = slug(cv.name) || 'CV';
    downloadJson(`${namePart}_All-Applications_${new Date().toISOString().slice(0, 10)}.json`, payload);
  };

  // Hands the writer a pack already filled with the base CV's own words, so the
  // job is editing sentences rather than guessing at a schema.
  const onDownloadJobPackTemplate = () => {
    const base = apps.find(a => a.isBase) || apps[0];
    const baseCv = (base && loadAppCv(base.id)) || cv;
    const namePart = slug(cv.name) || 'CV';
    downloadJson(`${namePart}_Job-Pack-Template.json`,
      buildJobPackTemplate(baseCv, appDisplayLabel(base)));
  };

  // Additive, unlike Restore: every entry becomes a new application and nothing
  // already on the machine is touched. The preview exists because a pack is
  // usually machine-written, and reading back what it understood is the cheapest
  // moment to catch a hallucinated employer.
  const onImportJobPack = async (text) => {
    const pack = parseJobPack(text);
    if (!pack.ok) {
      alert(`Could not read that job pack:\n\n${pack.errors.join('\n')}`);
      return;
    }
    const source = pack.basedOn
      ? apps.find(a => appDisplayLabel(a) === pack.basedOn)
      : null;
    const base = source || apps.find(a => a.isBase) || apps[0];
    if (!base) { alert('There is no application to base these on.'); return; }
    const lines = pack.entries.map((e, i) =>
      `${i + 1}. ${[e.company, e.position].filter(Boolean).join(' — ')}`);
    const basedOnNote = pack.basedOn && !source
      ? `\n\nNote: the pack asks for "${pack.basedOn}", which is not here. Using ${appDisplayLabel(base)} instead.`
      : '';
    if (!confirm(
      `Add ${pack.entries.length} application(s), based on ${appDisplayLabel(base)}?\n\n`
      + `${lines.join('\n')}\n\nYour existing applications are left alone.${basedOnNote}`
    )) return;

    const baseCv = loadAppCv(base.id) || SEED_CV;
    let baseHeadshot = null;
    try { baseHeadshot = await idbGet(appHeadshotKeyV2(base.id)); } catch {}
    const knownStatus = new Set(allStatuses.map(s => s.id));
    const created = [];
    for (const entry of pack.entries) {
      const id = genId();
      // Fork first, then merge: deepMerge leaves untouched branches alone, so a
      // pack that only rewrites the summary keeps every other section verbatim.
      const forked = deepMerge(JSON.parse(JSON.stringify(baseCv)), entry.overrides);
      saveAppCv(id, forked);
      if (baseHeadshot) {
        try { await idbPut(appHeadshotKeyV2(id), baseHeadshot); } catch {}
      }
      created.push(makeAppMeta({
        id, isBase: false,
        company: entry.company, position: entry.position,
        status: knownStatus.has(entry.status) ? entry.status : 'drafting',
        postingUrl: entry.postingUrl, notes: entry.notes,
        headshotKey: appHeadshotKeyV2(id),
      }));
    }
    setApps(prev => [...created, ...prev]);
    // Import is purely additive, so its inverse is exact: delete these ids and
    // nothing else. The record carries the updatedAt each application was born
    // with, which is what later tells an untouched import apart from one the
    // user has since edited — the CVs themselves are already on disk and need
    // no copy, so this entry costs almost nothing to keep.
    setUndoLog(await recordUndo(
      { kind: 'import-pack', count: created.length },
      { items: created.map(m => ({ id: m.id, updatedAt: m.updatedAt, label: appDisplayLabel(m) })) },
    ));
  };

  const onImport = async (text) => {
    try {
      const parsed = JSON.parse(text);
      // Two formats supported:
      //   New (v2): { schemaVersion: 2, apps: [{meta, cv, headshot}, ...] }
      //   Legacy: { cv: {...}, headshot: ..., applications: [...] } — single-profile dump
      if (parsed && parsed.schemaVersion === SCHEMA_VERSION && Array.isArray(parsed.apps)) {
        const incomingSnaps = Array.isArray(parsed.snapshots) ? parsed.snapshots : [];
        const heldSnaps = snapshotsRef.current;
        const snapNote = heldSnaps.length
          ? ` The ${heldSnaps.length === 1 ? 'frozen copy' : `${heldSnaps.length} frozen copies`} on this machine will go too.`
          : '';
        if (!confirm(`Restore ${parsed.apps.length} application(s)? Existing data will be replaced.${snapNote}`)) return;
        // Wipe current state
        for (const a of apps) {
          deleteAppCv(a.id);
          try { await idbDel(appHeadshotKeyV2(a.id)); } catch {}
        }
        // Frozen copies belong to applications that are about to stop existing,
        // so they go too. Emptying the index first means that even if this dies
        // half way, nothing claims a payload it no longer has, and the startup
        // sweep collects whatever is left behind.
        setSnapshots([]);
        await deleteSnapshotBlobs(heldSnaps, []);
        // Apply new
        const newMetas = [];
        for (const entry of parsed.apps) {
          if (!entry || !entry.meta) continue;
          const meta = { ...entry.meta };
          if (entry.cv) saveAppCv(meta.id, entry.cv);
          if (entry.headshot) {
            try { await idbPut(appHeadshotKeyV2(meta.id), entry.headshot); } catch {}
          }
          newMetas.push(meta);
        }
        // Min-1-Base safety
        if (!newMetas.some(m => m.isBase) && newMetas.length) newMetas[0].isBase = true;
        // Restore the frozen copies whose application actually came back. An
        // entry pointing at an application this file does not contain would be
        // invisible for good — no card would ever list it — while still holding
        // a complete CV in IndexedDB.
        const restoredIds = new Set(newMetas.map(m => m.id));
        const restoredSnaps = [];
        for (const s of incomingSnaps) {
          if (!s || !s.id || !s.cv || !restoredIds.has(s.appId)) continue;
          const { cv: snapCv, ...entry } = s;
          try {
            await idbPut(snapshotCvKey(entry.id), snapCv);
            const bytes = entry.imgKey && parsed.snapshotImages ? parsed.snapshotImages[entry.imgKey] : null;
            if (bytes) await idbPut(entry.imgKey, bytes);
            restoredSnaps.push(entry);
          } catch (e) { console.warn('Restoring a frozen copy failed', e); }
        }
        setSnapshots(restoredSnaps);
        setApps(newMetas);
        const nextActive = (newMetas.find(m => m.isBase) || newMetas[0])?.id || null;
        if (nextActive) {
          cvAppIdRef.current = null; // force reload
          setActiveAppId(nextActive);
        }
        return;
      }
      // Legacy single-CV import: overwrite the active app's CV
      const importedCv = (parsed && parsed.cv) || parsed;
      const merged = deepMerge(SEED_CV, importedCv);
      setCv(merged);
      if (parsed && parsed.headshot && activeAppId) {
        setHeadshotSrc(parsed.headshot);
        idbPut(appHeadshotKeyV2(activeAppId), parsed.headshot);
      }
    } catch (e) { alert('Import failed: ' + e.message); }
  };

  // Application lifecycle
  const onCreateApplication = async ({ company, position, forkFromId, templateId }) => {
    const src = apps.find(a => a.id === forkFromId);
    const srcCv = (src && loadAppCv(src.id)) || SEED_CV;
    let srcHeadshot = null;
    if (src) {
      try { srcHeadshot = await idbGet(appHeadshotKeyV2(src.id)); } catch {}
    }
    const id = genId();
    const meta = makeAppMeta({
      id, isBase: false,
      company: company || '',
      position: position || '',
      headshotKey: appHeadshotKeyV2(id),
    });
    const newCv = JSON.parse(JSON.stringify(srcCv));
    newCv.templateId = resolveTemplateId(templateId || (srcCv && srcCv.templateId));
    saveAppCv(id, newCv);
    if (srcHeadshot) {
      try { await idbPut(appHeadshotKeyV2(id), srcHeadshot); } catch {}
    }
    setApps(prev => [meta, ...prev]);
    cvAppIdRef.current = null;
    setActiveAppId(id);
    return id;
  };

  const onOpenApplication = (app, docKind) => {
    if (app && app.id && app.id !== activeAppId) setActiveAppId(app.id);
    setDoc(docKind === 'letter' ? 'letter' : 'cv');
  };

  // Freeze one application's CV, cover letter, theme, template and headshot as
  // they stand. Reads the CV out of React state when this is the open
  // application: the persist to localStorage is debounced by 250ms, so the
  // stored blob can be a keystroke behind at the instant the status changes,
  // and a copy that is nearly what you sent is worse than useless.
  const captureAppSnapshot = async (app, { auto = false } = {}) => {
    if (!app || !app.id) return null;
    const blob = app.id === activeAppId ? cv : loadAppCv(app.id);
    if (!blob) return null;
    const hash = contentHash(JSON.stringify(blob));
    const newest = snapshotsForApp(snapshotsRef.current, app.id)[0];
    if (newest && newest.cvHash === hash) {
      // Flipping a status back to Drafting and out again is not a second send,
      // and a copy byte-identical to the one already frozen is only a second
      // pile of the same personal data. The automatic path declines quietly;
      // a hand-pressed button gets told why nothing happened.
      if (!auto) alert('This is identical to the copy already frozen for this application, so nothing was added.');
      return null;
    }
    const statusMeta = allStatuses.find(s => s.id === app.status);
    try {
      const entry = await captureSnapshot({
        appId: app.id, cv: blob,
        label: appDisplayLabel(app),
        status: app.status,
        statusLabel: (statusMeta && statusMeta.label) || app.status,
        auto,
      });
      const { index, dropped } = withSnapshotAdded(snapshotsRef.current, entry);
      setSnapshots(index);
      // Index first, blobs second. The other order can leave the index naming a
      // payload that is already gone; this order can at worst leave a payload
      // nothing names, which the startup sweep collects.
      if (dropped.length) await deleteSnapshotBlobs(dropped, index);
      return entry;
    } catch (e) {
      console.error('Freezing a copy failed', e);
      if (!auto) alert('Could not freeze a copy: ' + (e && e.message || String(e)));
      return null;
    }
  };

  // Every status other than 'drafting' describes an application that has
  // already left your hands, so drafting → anything is the moment worth
  // freezing. That rule survives custom statuses, whose meaning we cannot know
  // but which are certainly not "still a draft". Withdrawn is included on
  // purpose: a withdrawn draft that was never sent costs one copy the user can
  // delete in two clicks, while a missed capture costs the only record of a CV
  // that is already three edits gone.
  //
  // The capture is automatic and silent. A prompt on every status change is a
  // prompt you learn to dismiss, and the one you dismiss is the one you needed
  // three months later. What keeps it from being invisible magic is that the
  // result shows up immediately and can be undone: the card grows a "sent copy"
  // line, collapsed or expanded, and every copy has a Delete button. Anything
  // outside this one transition — a re-send, a document you fixed and sent
  // again — is a deliberate press of "Freeze a copy now".
  const onPatchApp = (patched) => {
    const before = apps.find(a => a.id === patched.id);
    setApps(prev => prev.map(a => a.id === patched.id ? { ...patched, updatedAt: new Date().toISOString() } : a));
    if (before && !patched.isBase && before.status === 'drafting' && patched.status !== 'drafting') {
      captureAppSnapshot(patched, { auto: true });
    }
  };

  // Hands the existing snapshot viewer exactly the shape it already reads:
  // { cv, doc, appLabel, headshotSrc }. The label is the one recorded at
  // capture, so a copy sent to "Acme — Designer" still says so after the
  // application was renamed. snapId rides along only so a delete can close the
  // view it is deleting.
  const onOpenSnapshot = async (snapId, docKind) => {
    const entry = snapshotsRef.current.find(s => s.id === snapId);
    if (!entry) return;
    const blob = await idbGet(snapshotCvKey(entry.id));
    if (!blob) {
      alert('The frozen document behind that entry is no longer in this browser\'s storage, so there is nothing to show. Delete the entry to tidy it away.');
      return;
    }
    const headshotSrc = entry.imgKey ? await idbGet(entry.imgKey) : null;
    setViewingSnapshot({
      // Merged over the seed for the same reason every other load is: a copy
      // frozen months ago predates whatever fields the renderer has grown since.
      cv: deepMerge(SEED_CV, blob),
      doc: docKind === 'letter' ? 'letter' : 'cv',
      appLabel: entry.label || 'Application',
      headshotSrc: headshotSrc || null,
      snapId: entry.id,
    });
  };

  const onDeleteSnapshot = async (snapId) => {
    const entry = snapshotsRef.current.find(s => s.id === snapId);
    if (!entry) return;
    let when = entry.takenAt;
    try { when = new Date(entry.takenAt).toLocaleString(); } catch {}
    if (!confirm(`Delete the copy frozen on ${when}?\n\nThe application keeps its current CV and cover letter. Only this frozen record of what you sent goes, and it cannot be recovered.`)) return;
    const next = snapshotsRef.current.filter(s => s.id !== snapId);
    setSnapshots(next);
    if (viewingSnapshot && viewingSnapshot.snapId === snapId) setViewingSnapshot(null);
    await deleteSnapshotBlobs([entry], next);
  };

  // One sweep at startup, once the application list is known. Deleting an
  // application, restoring a backup and hydrating from a synced folder all
  // strand frozen copies, and none of them can be relied on to clean up after
  // itself — a copy holds a whole CV, so leaving that behind is a privacy leak,
  // not a wasted kilobyte.
  React.useEffect(() => {
    const before = snapshotsRef.current;
    sweepSnapshotStorage(loadAppsMeta().map(a => a.id))
      // A copy frozen while the sweep was still reading knows more than the
      // sweep does. Identity comparison catches that, because every write
      // replaces the array — without it a fast click after load would have its
      // brand new entry overwritten by a list assembled before it existed.
      .then(kept => { if (kept && snapshotsRef.current === before) setSnapshots(kept); })
      .catch(e => console.warn('Snapshot sweep failed', e));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const onPromoteToBase = (id) => {
    setApps(prev => prev.map(a => a.id === id ? { ...a, isBase: true, updatedAt: new Date().toISOString() } : a));
  };

  const onDemoteFromBase = (id) => {
    const bases = apps.filter(a => a.isBase);
    if (bases.length <= 1 && bases[0]?.id === id) {
      alert('At least one application must remain a Base.');
      return;
    }
    setApps(prev => prev.map(a => a.id === id ? { ...a, isBase: false, updatedAt: new Date().toISOString() } : a));
  };

  const onDuplicateApp = async (id) => {
    const src = apps.find(a => a.id === id);
    if (!src) return null;
    const srcCv = loadAppCv(src.id) || SEED_CV;
    let srcHeadshot = null;
    try { srcHeadshot = await idbGet(appHeadshotKeyV2(src.id)); } catch {}
    const newId = genId();
    const baseLabel = appDisplayLabel(src);
    const newCompany = src.company ? `${src.company} (copy)` : `${baseLabel} (copy)`;
    const meta = makeAppMeta({
      id: newId, isBase: false,
      company: newCompany,
      position: src.position || '',
      status: 'drafting',
      postingUrl: src.postingUrl || '',
      notes: src.notes || '',
      headshotKey: appHeadshotKeyV2(newId),
    });
    saveAppCv(newId, JSON.parse(JSON.stringify(srcCv)));
    if (srcHeadshot) {
      try { await idbPut(appHeadshotKeyV2(newId), srcHeadshot); } catch {}
    }
    setApps(prev => [meta, ...prev]);
    cvAppIdRef.current = null;
    setActiveAppId(newId);
    return newId;
  };

  // Anything that removes applications has to leave something on screen when
  // the one it removed was the one open; a Base is the least surprising place
  // to land. Shared by the delete button and by undoing a pack import, which
  // can take the open application out from under the editor just as easily.
  const reseatActiveApp = (removedIds) => {
    if (!removedIds.has(activeAppId)) return;
    const survivors = apps.filter(a => !removedIds.has(a.id));
    const next = survivors.find(a => a.isBase) || survivors[0];
    if (!next) return;
    cvAppIdRef.current = null;
    setActiveAppId(next.id);
  };

  const onDeleteApp = async (id) => {
    const target = apps.find(a => a.id === id);
    if (!target) return;
    if (target.isBase) {
      const baseCount = apps.filter(a => a.isBase).length;
      if (baseCount <= 1) {
        alert('Cannot delete the last Base application. Promote another application to Base first.');
        return;
      }
    }
    if (!confirm(`Delete "${appDisplayLabel(target)}"?\n\nYou can undo this from the Applications list until you clear the undo history.`)) return;
    // Read both halves before either is destroyed. An application is a CV blob
    // in localStorage and headshot bytes in IndexedDB, and a stash that caught
    // only the first would restore a CV with a hole where the face was.
    const stashedCv = loadAppCv(id);
    let stashedHeadshot = null;
    try { stashedHeadshot = await idbGet(appHeadshotKeyV2(id)); } catch {}
    deleteAppCv(id);
    try { await idbDel(appHeadshotKeyV2(id)); } catch {}
    setApps(prev => prev.filter(a => a.id !== id));
    reseatActiveApp(new Set([id]));
    setUndoLog(await recordUndo(
      { kind: 'delete-app', label: appDisplayLabel(target), count: 1 },
      { meta: target, cv: stashedCv, headshot: stashedHeadshot },
    ));
  };

  // Undoing an import is itself destructive, so it confirms and reports; each
  // handler returns whether the entry has been spent, so a cancelled confirm
  // leaves the undo where it was instead of quietly burning it.
  const undoPackImport = async (payload) => {
    const items = (payload && payload.items) || [];
    // Precision is the whole point: only ids this import created, and only
    // those still exactly as it created them. An application edited since is
    // the user's own work — "remove what I just added" is not permission to
    // throw that away. A Base is skipped for the same reason, and because the
    // list has to keep one.
    const removable = [];
    let editedSince = 0;
    let alreadyGone = 0;
    for (const it of items) {
      const live = apps.find(a => a.id === it.id);
      if (!live) { alreadyGone++; continue; }
      if (live.isBase || live.updatedAt !== it.updatedAt) editedSince++;
      else removable.push(live);
    }
    if (!removable.length) {
      alert(editedSince
        ? `Nothing to undo: all ${editedSince} application(s) from that import have been edited since, so they are left alone. Delete them one by one if you want them gone.`
        : 'Nothing to undo — those applications are already gone.');
      return true;
    }
    const notes = [
      editedSince ? `${editedSince} of them have been edited since and will be kept.` : '',
      alreadyGone ? `${alreadyGone} were already deleted.` : '',
    ].filter(Boolean).join('\n');
    if (!confirm(
      `Remove ${removable.length} application(s) that job pack added?\n\n`
      + removable.map(a => `• ${appDisplayLabel(a)}`).join('\n')
      + `\n\n${notes}${notes ? '\n\n' : ''}Nothing else is touched.`
    )) return false;
    const ids = new Set(removable.map(a => a.id));
    for (const id of ids) {
      deleteAppCv(id);
      try { await idbDel(appHeadshotKeyV2(id)); } catch {}
    }
    setApps(prev => prev.filter(a => !ids.has(a.id)));
    reseatActiveApp(ids);
    return true;
  };

  // Restoring is not destructive, so it just happens — a confirm here would be
  // the confirm habit that made undo necessary in the first place.
  const undoAppDeletion = async (payload) => {
    const meta = payload && payload.meta;
    if (!meta || !meta.id) {
      alert('That undo entry is incomplete — the application cannot be put back.');
      return true;
    }
    if (apps.some(a => a.id === meta.id)) return true;
    if (payload.cv) saveAppCv(meta.id, payload.cv);
    if (payload.headshot) {
      try { await idbPut(appHeadshotKeyV2(meta.id), payload.headshot); } catch {}
    }
    // The id comes back with it, so links, the active-application pointer and
    // the headshot key all still refer to the same application they did before.
    // Checked against `prev` rather than the captured list because two quick
    // clicks on Undo would otherwise both pass the check above and put the same
    // application in the list twice.
    setApps(prev => prev.some(a => a.id === meta.id) ? prev : [meta, ...prev]);
    return true;
  };

  const onUndo = async (entryId) => {
    const entry = undoLog.find(e => e.id === entryId);
    if (!entry) return;
    const payload = await readUndoPayload(entryId);
    if (!payload) {
      alert('That undo is no longer available — the copy it needed has been cleared.');
      setUndoLog(await dropUndoEntry(entryId));
      return;
    }
    const spent = entry.kind === 'import-pack'
      ? await undoPackImport(payload)
      : await undoAppDeletion(payload);
    if (spent) setUndoLog(await dropUndoEntry(entryId));
  };

  const onClearUndo = async () => {
    if (!confirm('Clear undo history?\n\nThe copies kept for undo are deleted straight away, and the actions in the list can no longer be reversed.')) return;
    setUndoLog(await clearUndoLog());
  };

  const noop = () => {};
  // Bridge between the headshot frame (inside the CV) and the inspector's
  // Headshot group. The slot is the group's body element, held as state so the
  // portal re-renders when the group mounts or unmounts; the tick counts frame
  // clicks so the inspector can open that group.
  const [hsSlot, setHsSlot] = React.useState(null);
  const [hsFocusTick, setHsFocusTick] = React.useState(0);
  const hsPanelCtx = React.useMemo(() => ({
    slot: hsSlot,
    focusHeadshot: () => setHsFocusTick(t => t + 1),
  }), [hsSlot]);

  let mainContent;
  if (viewingSnapshot) {
    const snapCv = viewingSnapshot.cv;
    if (viewingSnapshot.doc === 'letter') {
      mainContent = <CoverLetterDocument cv={snapCv} update={noop} />;
    } else {
      mainContent = (
        <CVDocument
          cv={snapCv} update={noop}
          headshotSrc={viewingSnapshot.headshotSrc}
          onHeadshotSrc={noop}
          onHeadshotTransform={noop}
          onHeadshotClear={noop}
        />
      );
    }
  } else if (doc === 'applications') {
    mainContent = (
      <ApplicationsDocument
        apps={apps} activeAppId={activeAppId}
        onView={onOpenApplication}
        onCreate={onCreateApplication}
        onDownloadTemplate={onDownloadJobPackTemplate}
        onImportPack={onImportJobPack}
        snapshots={snapshots}
        onCaptureSnapshot={captureAppSnapshot}
        onOpenSnapshot={onOpenSnapshot}
        onDeleteSnapshot={onDeleteSnapshot}
        onPatch={onPatchApp}
        onPromote={onPromoteToBase}
        onDemote={onDemoteFromBase}
        onDuplicate={onDuplicateApp}
        onDelete={onDeleteApp}
        undoLog={undoLog} onUndo={onUndo} onClearUndo={onClearUndo}
        customStatuses={customStatuses}
        setCustomStatuses={setCustomStatuses}
        setStatusOrder={setStatusOrder}
        onStatusDeleted={(removedId) => {
          // Any app using the deleted status falls back to 'drafting'
          setApps(prev => prev.map(a => a.status === removedId ? { ...a, status: 'drafting', updatedAt: new Date().toISOString() } : a));
        }}
      />
    );
  } else if (doc === 'letter') {
    mainContent = <CoverLetterDocument cv={cv} update={update} />;
  } else {
    mainContent = (
      <CVDocument
        cv={cv} update={update}
        headshotSrc={headshotSrc}
        onHeadshotSrc={onHeadshotSrc}
        onHeadshotTransform={onHeadshotTransform}
        onHeadshotClear={onHeadshotClear}
      />
    );
  }

  return (
    <StatusesContext.Provider value={statusesContextValue}>
    <HeadshotPanelContext.Provider value={hsPanelCtx}>
      {/* Asking the toolbar for a different document is a way out of a frozen
          copy too. Without clearing it here those buttons look dead: they do
          change `doc`, but the snapshot holds the stage until its banner is
          closed, so nothing on screen moves. */}
      <Toolbar editOn={editOn} setEditOn={setEditOn}
        onPrint={onPrint} onExport={onExport} onImport={onImport}
        doc={doc} setDoc={(v) => { setViewingSnapshot(null); setDoc(v); }}
        zoom={zoom} setZoom={(v) => setZoom(clampZoom(v))}
        syncState={syncState} syncDirName={syncDirName}
        onSetUpSync={onSetUpSync} onReconnectSync={onReconnectSync} onUnbindSync={onUnbindSync} />
      {syncState === 'idle' && !syncBannerDismissed && (
        <div className="sync-banner">
          <span>Your data lives in this browser only. Bind it to a folder to sync across devices.</span>
          <button className="primary" onClick={onSetUpSync}>Set up sync</button>
          <button onClick={dismissSyncBanner} title="Hide this banner">Dismiss</button>
        </div>
      )}
      {syncState === 'needs-reconnect' && (
        <div className="sync-banner warning">
          <span>Sync paused — reconnect to <strong>{syncDirName || 'your folder'}</strong> to resume.</span>
          <button className="primary" onClick={onReconnectSync}>Reconnect</button>
          <button onClick={onUnbindSync} title="Stop syncing">Unbind</button>
        </div>
      )}
      {viewingSnapshot && <SnapshotBanner snap={viewingSnapshot} onClose={() => setViewingSnapshot(null)} />}
      {/* A frozen copy renders a document, so the stage has to be told it is
          showing one. Left as `doc` it would still be laid out as the
          applications list — stretched to the full width instead of centred —
          because you open a copy from that list and never leave it. */}
      {/* --cv-zoom lets the stage divide out its own padding: CSS `zoom` scales
          padding along with everything else, which otherwise walks the document
          further from the toolbar the more you zoom in. */}
      <div className="cv-stage" data-zoom={zoom !== 1 ? '1' : undefined}
        data-doc={viewingSnapshot ? (viewingSnapshot.doc === 'letter' ? 'letter' : 'cv') : doc}
        style={zoom !== 1 ? { zoom, '--cv-zoom': zoom } : undefined}>
        {mainContent}
      </div>
      {doc === 'cv' && !viewingSnapshot && (
        <TweaksPanel editOn={editOn} cv={cv} update={update} removePath={removePath} headshotSrc={headshotSrc}
          templateId={resolveTemplateId(cv.templateId)}
          onTemplateChange={(id) => update(['templateId'], id)}
          hsFocusTick={hsFocusTick} onHsSlotRef={setHsSlot} />
      )}
    </HeadshotPanelContext.Provider>
    </StatusesContext.Provider>
  );
}

// Initialize global edit flag before first render so Ed sees it
window.__EDIT_ON = (localStorage.getItem('cv-edit-on') !== '0');

function MigrationGate() {
  const [ready, setReady] = React.useState(false);
  const [error, setError] = React.useState(null);
  React.useEffect(() => {
    runMigrationIfNeeded()
      .then(() => setReady(true))
      .catch(err => { setError(err); setReady(true); });
  }, []);
  if (error) {
    return (
      <div style={{ padding: 40, fontFamily: 'Inter Tight, sans-serif', maxWidth: 640, margin: '40px auto', color: '#1a1a1a' }}>
        <h2 style={{ color: '#a44d2c' }}>Schema migration failed</h2>
        <p>Your data is intact (backups exist under <code>cv-profiles-backup-*</code> and <code>cv-applications-backup-*</code> in localStorage).</p>
        <pre style={{ background: '#f5f3ee', padding: 12, borderRadius: 6, overflow: 'auto', fontSize: 11 }}>{(error && error.stack) || String(error)}</pre>
      </div>
    );
  }
  if (!ready) {
    return (
      <div style={{ position: 'fixed', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'Inter Tight, sans-serif', color: '#6b6b66', fontSize: 12, letterSpacing: 1.4, textTransform: 'uppercase' }}>
        Loading…
      </div>
    );
  }
  return <App />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<MigrationGate />);
</script>
</body>
</html>
