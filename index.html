// ════════════════════════════════════════════════════════════════
//  Draggable floating panels
// ════════════════════════════════════════════════════════════════
// Bridges the headshot frame (deep in the CV sidebar) to the inspector panel
// (a sibling of the whole document), without lifting headshot state or
// drilling props through four layers.
//   slot           the inspector's Headshot group, as a portal target
//   focusHeadshot  called when the frame is clicked, so the group can open
const HeadshotPanelContext = React.createContext({ slot: null, focusHeadshot: () => {} });

// Drag-by-handle behaviour for the inspector panel, in viewport coordinates
// (the panel is position: fixed). dragPos stays null until the user actually
// drags, which is how the panel knows to keep its default gutter anchoring.
function usePanelDrag({ width, handleH = 40 }) {
  const [dragPos, setDragPos] = React.useState(null);
  const [dragging, setDragging] = React.useState(false);
  const start = React.useRef(null);
  React.useEffect(() => {
    if (!dragging) return;
    const move = (e) => {
      const s = start.current;
      if (!s) return;
      // Clamp so the panel can never be dragged somewhere unreachable.
      const maxLeft = window.innerWidth - width - 8;
      const maxTop = window.innerHeight - handleH;
      setDragPos({
        left: Math.max(8, Math.min(maxLeft, s.left + e.clientX - s.sx)),
        top: Math.max(8, Math.min(maxTop, s.top + e.clientY - s.sy)),
      });
    };
    const up = () => { start.current = null; setDragging(false); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    // pointercancel: without it, releasing outside the window (or an OS
    // gesture stealing the pointer) left the panel glued to the cursor.
    window.addEventListener('pointercancel', up);
    return () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
    };
  }, [dragging, width, handleH]);
  // base is where the panel currently sits, in whichever coord space it uses.
  const onGrab = (e, base) => {
    if (e.target.closest('button')) return;
    if (!base) return;
    start.current = { sx: e.clientX, sy: e.clientY, left: base.left, top: base.top };
    setDragging(true);
    e.preventDefault();
  };
  return { dragPos, setDragPos, onGrab };
}

// ════════════════════════════════════════════════════════════════
//  Headshot editor — upload, shape crop, pan, zoom, resize
// ════════════════════════════════════════════════════════════════
function HeadshotEditor({ src, transform, onTransformChange, onSrcChange, onClear }) {
  const editable = !!window.__EDIT_ON;
  const t = transform || { shape: 'rounded', align: 'left', x: 0, y: 0, scale: 1, size: 144, roundedRadius: 14 };
  const align = t.align || 'left';
  const shape = SHAPES.find(s => s.id === t.shape) || SHAPES[1];
  const roundedRadius = Number.isFinite(t.roundedRadius) ? t.roundedRadius : 14;
  const effectiveClip = shape.id === 'rounded' ? `inset(0 round ${roundedRadius}%)` : shape.clip;
  const inputRef = React.useRef(null);
  const frameRef = React.useRef(null);
  const imgRef = React.useRef(null);
  const [imgDim, setImgDim] = React.useState(null); // {w, h}
  const [dragging, setDragging] = React.useState(false);

  // Min scale = cover-fit; max scale = 8x cover. Pan clamped so image always covers frame.
  const minScale = imgDim ? Math.max(t.size / imgDim.w, t.size / imgDim.h) : 0.1;
  const maxScale = imgDim ? minScale * 8 : 8;
  const clamp = React.useCallback((next) => {
    if (!imgDim) return next;
    const minS = Math.max(next.size / imgDim.w, next.size / imgDim.h);
    const maxS = minS * 8;
    const scale = Math.max(minS, Math.min(maxS, next.scale));
    const w = imgDim.w * scale, h = imgDim.h * scale;
    const x = Math.max(next.size - w, Math.min(0, next.x));
    const y = Math.max(next.size - h, Math.min(0, next.y));
    return { ...next, scale, x, y };
  }, [imgDim]);
  const apply = (next) => onTransformChange(clamp(next));

  // Whenever frame size or image dim changes, re-clamp current transform
  React.useEffect(() => {
    if (!imgDim) return;
    const c = clamp(t);
    if (c.scale !== t.scale || c.x !== t.x || c.y !== t.y) onTransformChange(c);
  }, [imgDim, t.size]);

  // Pick file → dataURL
  const handleFile = (file) => {
    if (!file || !onSrcChange) return;
    const reader = new FileReader();
    reader.onload = (e) => onSrcChange(e.target.result);
    reader.readAsDataURL(file);
  };
  const onPick = (e) => handleFile(e.target.files && e.target.files[0]);
  const onDrop = (e) => {
    e.preventDefault();
    handleFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  };

  // Once image loads, capture natural dim and cover-fit if transform looks fresh
  const onImgLoad = () => {
    const im = imgRef.current;
    if (!im) return;
    const w = im.naturalWidth, h = im.naturalHeight;
    setImgDim({ w, h });
    if (t.x === 0 && t.y === 0 && t.scale === 1) {
      const cover = Math.max(t.size / w, t.size / h);
      onTransformChange({ ...t, scale: cover, x: (t.size - w * cover) / 2, y: (t.size - h * cover) / 2 });
    }
  };

  // Pointer drag for pan
  const dragState = React.useRef(null);
  const onPointerDown = (e) => {
    if (!editable || !src) return;
    e.preventDefault();
    frameRef.current.setPointerCapture(e.pointerId);
    dragState.current = { startX: e.clientX, startY: e.clientY, ox: t.x, oy: t.y };
    setDragging(true);
  };
  const onPointerMove = (e) => {
    if (!dragState.current) return;
    const dx = e.clientX - dragState.current.startX;
    const dy = e.clientY - dragState.current.startY;
    apply({ ...t, x: dragState.current.ox + dx, y: dragState.current.oy + dy });
  };
  const onPointerUp = (e) => {
    dragState.current = null;
    setDragging(false);
    try { frameRef.current.releasePointerCapture(e.pointerId); } catch {}
  };

  // Wheel = zoom around cursor
  const onWheel = (e) => {
    if (!editable || !src || !imgDim) return;
    e.preventDefault();
    const rect = frameRef.current.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
    const newScale = t.scale * factor;
    const imgX = (px - t.x) / t.scale;
    const imgY = (py - t.y) / t.scale;
    apply({ ...t, scale: newScale, x: px - imgX * newScale, y: py - imgY * newScale });
  };

  // Zoom slider = scale around frame center
  const onZoomSlider = (val) => {
    if (!imgDim) { onTransformChange({ ...t, scale: val }); return; }
    const cx = t.size / 2, cy = t.size / 2;
    const imgX = (cx - t.x) / t.scale;
    const imgY = (cy - t.y) / t.scale;
    apply({ ...t, scale: val, x: cx - imgX * val, y: cy - imgY * val });
  };

  // Frame resize handle. The window listeners are handed a cleanup closure so
  // the same render generation that attached them always detaches them — and
  // the unmount effect below drops them if the editor dies mid-drag (e.g. the
  // user switches document while resizing), which used to leak the listeners.
  const resizeState = React.useRef(null);
  const onResizeDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    const cleanup = () => {
      resizeState.current = null;
      window.removeEventListener('pointermove', onResizeMove);
      window.removeEventListener('pointerup', onResizeUp);
      window.removeEventListener('pointercancel', onResizeUp);
    };
    resizeState.current = { startX: e.clientX, startY: e.clientY, oSize: t.size, cleanup };
    window.addEventListener('pointermove', onResizeMove);
    window.addEventListener('pointerup', onResizeUp);
    window.addEventListener('pointercancel', onResizeUp);
  };
  const onResizeMove = (e) => {
    if (!resizeState.current) return;
    const d = Math.max(e.clientX - resizeState.current.startX, e.clientY - resizeState.current.startY);
    const next = Math.max(60, Math.min(220, resizeState.current.oSize + d));
    apply({ ...t, size: next });
  };
  const onResizeUp = () => {
    if (resizeState.current) resizeState.current.cleanup();
  };
  React.useEffect(() => () => {
    if (resizeState.current) resizeState.current.cleanup();
  }, []);

  // Recenter button
  const onRecenter = () => {
    if (!imgDim) { onTransformChange({ ...t, x: 0, y: 0, scale: 1 }); return; }
    const cover = Math.max(t.size / imgDim.w, t.size / imgDim.h);
    onTransformChange({ ...t, scale: cover, x: (t.size - imgDim.w * cover) / 2, y: (t.size - imgDim.h * cover) / 2 });
  };

  const justify = align === 'right' ? 'flex-end' : align === 'center' ? 'center' : 'flex-start';

  // The controls are not their own window; they render into the inspector's
  // Headshot group via a slot the inspector publishes through context. All the
  // headshot state stays here — only the chrome moved.
  const { slot: hsSlot, focusHeadshot } = React.useContext(HeadshotPanelContext);
  const controls = editable ? (
    <div className="hs-fields">
        {/* Shape, radius, and alignment only apply once an image exists;
            before that the group is just the upload action. */}
        {src && <>
        <div className="hs-group">
          <div className="hs-group-label">Shape</div>
          <div className="shapes">
            {SHAPES.map(s => (
              <button key={s.id} type="button"
                className={`shape-btn ${s.id === t.shape ? 'active' : ''}`}
                onClick={() => onTransformChange({ ...t, shape: s.id })}
                title={s.label}>
                <svg viewBox="0 0 16 16">{s.icon}</svg>
              </button>
            ))}
          </div>
        </div>
        {t.shape === 'rounded' && (() => {
          const maxR = 50;
          const r = Math.min(roundedRadius, maxR);
          const setR = (v) => {
            if (!Number.isFinite(v)) return;
            onTransformChange({ ...t, roundedRadius: Math.max(0, Math.min(maxR, v)) });
          };
          return (
            <div className="hs-slider">
              <div className="hs-slider-head">
                <span className="hs-slider-label">Radius</span>
                <div className="hs-slider-value">
                  <input type="number" min={0} max={maxR} step={1} value={r}
                    onChange={(e) => setR(parseInt(e.target.value, 10))}
                    aria-label="Corner radius percent" />
                  <span className="hs-slider-unit">%</span>
                </div>
              </div>
              <input type="range" min={0} max={maxR} step={1} value={r}
                onChange={(e) => setR(parseInt(e.target.value, 10))}
                aria-label="Corner radius slider" />
            </div>
          );
        })()}
        <div className="hs-group">
          <div className="hs-group-label">Alignment</div>
          <div style={{ display: 'flex', gap: 4 }}>
            {[
              { id: 'left',   label: 'L', icon: <><rect x="1" y="3" width="6" height="10" /><rect x="9" y="5" width="6" height="2" opacity=".4" /><rect x="9" y="9" width="6" height="2" opacity=".4" /></> },
              { id: 'center', label: 'C', icon: <><rect x="5" y="3" width="6" height="10" /><rect x="1" y="5" width="3" height="2" opacity=".4" /><rect x="12" y="5" width="3" height="2" opacity=".4" /><rect x="1" y="9" width="3" height="2" opacity=".4" /><rect x="12" y="9" width="3" height="2" opacity=".4" /></> },
              { id: 'right',  label: 'R', icon: <><rect x="9" y="3" width="6" height="10" /><rect x="1" y="5" width="6" height="2" opacity=".4" /><rect x="1" y="9" width="6" height="2" opacity=".4" /></> },
            ].map(a => (
              <button key={a.id} type="button"
                className={`shape-btn ${align === a.id ? 'active' : ''}`}
                onClick={() => onTransformChange({ ...t, align: a.id })}
                title={`Align ${a.id}`}>
                <svg viewBox="0 0 16 16">{a.icon}</svg>
              </button>
            ))}
          </div>
        </div>
        </>}
        {src && (
          <>
            <div className="hs-slider">
              <div className="hs-slider-head">
                <span className="hs-slider-label">Zoom</span>
                <span className="hs-slider-unit">{Math.round((t.scale / (minScale || 1)) * 100)}%</span>
              </div>
              <input type="range" min={minScale} max={maxScale} step={(maxScale - minScale) / 200 || 0.01} value={t.scale}
                onChange={(e) => onZoomSlider(parseFloat(e.target.value))}
                aria-label="Zoom slider" />
            </div>
            <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
              <button type="button" className="ghost" onClick={() => inputRef.current && inputRef.current.click()}>Replace</button>
              <button type="button" className="ghost" onClick={onRecenter}>Re-center</button>
              <button type="button" className="ghost" onClick={onClear}>Remove</button>
            </div>
          </>
        )}
        {!src && (
          <button type="button" className="ghost" onClick={() => inputRef.current && inputRef.current.click()}>Upload image</button>
        )}
    </div>
  ) : null;

  return (
    <div style={{ marginBottom: 20, display: 'flex', flexDirection: 'column', alignItems: justify }}>
      <div style={{ position: 'relative', width: t.size, height: t.size }}>
        <div
          ref={frameRef}
          className={`hs-frame ${!src ? 'empty' : ''} ${editable ? 'editing' : ''} ${dragging ? 'dragging' : ''}`}
          style={{ width: t.size, height: t.size, clipPath: effectiveClip, WebkitClipPath: effectiveClip }}
          onPointerDown={(e) => { if (editable) focusHeadshot(); onPointerDown(e); }}
          onPointerMove={onPointerMove}
          onPointerUp={onPointerUp}
          onPointerCancel={onPointerUp}
          onWheel={onWheel}
          onClick={(e) => {
            if (!editable || src) return;
            inputRef.current && inputRef.current.click();
          }}
          onDragOver={(e) => editable && e.preventDefault()}
          onDrop={editable ? onDrop : undefined}
        >
          {src ? (
            <img
              ref={imgRef}
              src={src}
              alt=""
              draggable={false}
              onLoad={onImgLoad}
              style={{
                width: imgDim ? imgDim.w : 'auto',
                height: imgDim ? imgDim.h : 'auto',
                transform: `translate(${t.x}px, ${t.y}px) scale(${t.scale})`,
              }}
            />
          ) : (
            <span>[ HEADSHOT<br/>click to upload ]</span>
          )}
          <input ref={inputRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={onPick} />
        </div>
        {editable && src && <div className="hs-resize screen-only" onPointerDown={onResizeDown} title="Resize frame" />}
      </div>
      {controls && hsSlot && ReactDOM.createPortal(controls, hsSlot)}
    </div>
  );
}

function V1LanguageRow({ lang, onName, onLevel, ink }) {

function BulletBtn({ label, onClick, disabled, title }) {

function V1Role({ role, onRole, onDelete, last, ink, flowRoleId, companyLocation }) {
  const editable = !!window.__EDIT_ON;
  const setBullet = (i, v) => {
    const next = role.bullets.slice();
    if (v.trim()) next[i] = v; else next.splice(i, 1);
    onRole({ ...role, bullets: next });
  };
  const moveBullet = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= role.bullets.length) return;
    const next = role.bullets.slice();
    [next[i], next[j]] = [next[j], next[i]];
    onRole({ ...role, bullets: next });
  };
  const removeBullet = (i) => {
    const next = role.bullets.slice();
    next.splice(i, 1);
    onRole({ ...role, bullets: next });
  };
  return (
    <div style={{ marginBottom: last ? 0 : 13, position: 'relative' }} className="role-block">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: (role.location || companyLocation) ? 1 : 5, gap: 8 }}>
        <Ed value={role.title} onChange={(v) => onRole({ ...role, title: v })}
          style={{ fontSize: 11.5, fontWeight: 600, color: ink, letterSpacing: -0.1, flex: 1 }} />
        <Ed value={role.dates} onChange={(v) => onRole({ ...role, dates: v })}
          style={{ fontSize: 9, color: V1_MUTED, fontFamily: V1_MONO, flexShrink: 0 }} />
        {editable && onDelete && (
          <button type="button" className="screen-only role-del" onClick={(e) => { e.stopPropagation(); if (confirm('Delete this role and all its bullets?')) onDelete(); }}
            title="Delete role"
            style={DEL_BTN_STYLE}>×</button>
        )}
      </div>
      {(role.location || companyLocation || editable) && (
        <Ed tag="div" value={role.location || companyLocation || ''} onChange={(v) => onRole({ ...role, location: v })}
          style={{ fontSize: 9.5, color: V1_MUTED, marginBottom: 5, fontStyle: 'italic', minHeight: editable ? '1em' : 0 }} />
      )}
      <ul style={{ margin: 0, padding: 0, listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 5 }}>
        {role.bullets.map((b, i) => (
          <li key={i}
            {...(flowRoleId != null ? { 'data-flow-role': flowRoleId } : {})}
            style={{ fontSize: 10.25, lineHeight: 1.5, paddingLeft: 14, position: 'relative', color: V1_INK_SOFT, textWrap: 'pretty' }}>
            <span style={{ position: 'absolute', left: 0, top: 7, width: 6, height: 1, background: ink }} />
            <Ed value={b} onChange={(v) => setBullet(i, v)} multiline />
            {editable && (
              <span className="screen-only bullet-reorder" style={{
                position: 'absolute', right: -2, top: 0, display: 'inline-flex',
                gap: 2, alignItems: 'center', opacity: 0, transition: 'opacity 120ms',
              }}>
                <BulletBtn label="↑" disabled={i === 0} onClick={() => moveBullet(i, -1)} title="Move up" />
                <BulletBtn label="↓" disabled={i === role.bullets.length - 1} onClick={() => moveBullet(i, 1)} title="Move down" />
                <BulletBtn label="×" onClick={() => removeBullet(i)} title="Remove" />
              </span>
            )}
          </li>
        ))}
        {editable && (
          <li className="screen-only" style={{ fontSize: 9, color: '#999', paddingLeft: 14, cursor: 'pointer' }}
              onClick={() => onRole({ ...role, bullets: [...role.bullets, 'New bullet'] })}>+ add bullet</li>
        )}
      </ul>
    </div>
  );
}

// One contact line — email, phone, LinkedIn — shared by the Editorial sidebar
// and the Linear header, which had grown two copies of the same anchor.
// The <a> is deliberately rendered in edit mode as well: printing is a bare
// window.print() that never forces Edit off, so the old version, which swapped
// the anchor out for a naked Ed while editing, handed anyone who hit "Save as
// PDF" with Edit on a PDF whose contact details were dead text.
// Wrapping a contenteditable in a link is the price of that, and it costs two
// guards while editing: a plain click would otherwise follow the href mid-word,
// so we swallow the navigation and leave the mousedown to place the caret, and
// a live link is draggable by default, which would turn drag-to-select-a-typo
// into dragging the link somewhere. Neither guard touches the href, which is
// all the PDF writer reads.
function ContactRow({ href, value, onChange, external = false }) {
  return (
    <a href={href}
      target={external ? '_blank' : undefined}
      rel={external ? 'noopener noreferrer' : undefined}
      draggable={window.__EDIT_ON ? false : undefined}
      onClick={(e) => { if (window.__EDIT_ON) e.preventDefault(); }}
      style={{ display: 'block', color: 'inherit', textDecoration: 'none' }}>
      <Ed tag="div" value={value} onChange={onChange} />
    </a>
  );
}
function AddRow({ onClick, label }) {

function RowDelete({ items, i, setData }) {

function useSidebarSplit(visibleIds, availableP1, refs) {
  const [splitIdx, setSplitIdx] = React.useState(visibleIds.length);
  React.useLayoutEffect(() => {
    let used = 0, idx = visibleIds.length;
    const SECTION_MARGIN = 16;
    for (let i = 0; i < visibleIds.length; i++) {
      const el = refs.current[visibleIds[i]];
      const h = (el ? el.offsetHeight : 0) + SECTION_MARGIN;
      if (used + h > availableP1) { idx = i; break; }
      used += h;
    }
    setSplitIdx(idx);
  });
  return splitIdx;
}

function deleteRoleFn(cv, update, ci, ri) {
  const company = cv.experience[ci];
  const next = company.roles.slice();
  next.splice(ri, 1);
  if (next.length === 0) {
    const exps = cv.experience.slice();
    exps.splice(ci, 1);
    update(['experience'], exps);
  } else {
    update(['experience', ci, 'roles'], next);
  }
}

function V1MainP1({ cv, update, ink, ppmSplitIdx, omSplitIdx }) {
  const ppm = cv.experience[0] && cv.experience[0].roles[0];
  const om = cv.experience[0] && cv.experience[0].roles[1];
  const ppmAt = ppm ? ((ppmSplitIdx != null) ? ppmSplitIdx : ppm.bullets.length) : 0;
  const omAt = om ? ((omSplitIdx != null) ? omSplitIdx : om.bullets.length) : 0;
  const ppmFullyOnP1 = ppm ? ppmAt >= ppm.bullets.length : true;
  const titles = cv.sectionTitles || {};
  // Walk section order to render sections before Experience inline; after Experience goes to P2.
  const mainOrder = ensureSectionOrder(cv).filter(s => s.visible && isMainSectionId(s.id));
  const expIdxInOrder = mainOrder.findIndex(s => s.id === 'experience');
  const sectionsBeforeExp = expIdxInOrder >= 0 ? mainOrder.slice(0, expIdxInOrder) : mainOrder;
  const expVisible = expIdxInOrder >= 0;
  // If Experience is hidden, P1 renders ALL visible sections (P2 will be skipped).
  const sectionsToRender = expVisible ? sectionsBeforeExp : mainOrder;
  return (
    <div style={{ flex: 1, padding: '42px 44px 32px', fontFamily: V1_FONT, boxSizing: 'border-box' }}>
      <header style={{ marginBottom: 20 }}>
        <Ed tag="h1" value={cv.name} onChange={(v) => update(['name'], v)}
          style={{ fontFamily: V1_FONT, fontSize: 40, fontWeight: 600, letterSpacing: -1.3, margin: 0, lineHeight: 1, color: ink, textWrap: 'balance', display: 'block' }} />
        <Ed tag="div" value={cv.title} onChange={(v) => update(['title'], v)}
          style={{ fontSize: 12.5, color: V1_MUTED, marginTop: 8, letterSpacing: 0.1 }} />
      </header>
      {sectionsToRender.map(s => renderEditorialMainSection(s.id, cv, update, ink))}
      {expVisible && (
        <V1Section title={titles.experience || 'Work Experience'}
          onTitleChange={(v) => update(['sectionTitles', 'experience'], v)} ink={ink}>
          {cv.experience[0] && (
            <div className="company-block" style={{ position: 'relative' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 2, gap: 8 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: ink, letterSpacing: -0.2, flex: 1 }}>
                  <Ed value={cv.experience[0].company} onChange={(v) => update(['experience', 0, 'company'], v)} />
                  <span style={{ fontWeight: 400, color: V1_MUTED, fontSize: 10 }}> &nbsp;·&nbsp; <Ed value={cv.experience[0].companyNote} onChange={(v) => update(['experience', 0, 'companyNote'], v)} /></span>
                </div>
                <Ed value={cv.experience[0].dates} onChange={(v) => update(['experience', 0, 'dates'], v)} style={{ fontSize: 9, color: V1_MUTED, fontFamily: V1_MONO }} />
              </div>
              {ppm && ppmAt > 0 && (() => {
                const ppmHead = { ...ppm, bullets: ppm.bullets.slice(0, ppmAt) };
                return (
                  <V1Role role={ppmHead}
                    onRole={(nr) => update(['experience', 0, 'roles', 0], { ...ppm, title: nr.title, dates: nr.dates, location: nr.location, bullets: [...nr.bullets, ...ppm.bullets.slice(ppmAt)] })}
                    onDelete={() => deleteRoleFn(cv, update, 0, 0)}
                    last={!ppmFullyOnP1} ink={ink} flowRoleId="ppm" companyLocation={cv.experience[0].location} />
                );
              })()}
              {ppmFullyOnP1 && om && omAt > 0 && (() => {
                const omHead = { ...om, bullets: om.bullets.slice(0, omAt) };
                return (
                  <V1Role role={omHead}
                    onRole={(nr) => update(['experience', 0, 'roles', 1], { ...om, title: nr.title, dates: nr.dates, location: nr.location, bullets: [...nr.bullets, ...om.bullets.slice(omAt)] })}
                    onDelete={() => deleteRoleFn(cv, update, 0, 1)}
                    last ink={ink} flowRoleId="om" bulletAttr="data-om-bullet" companyLocation={cv.experience[0].location} />
                );
              })()}
            </div>
          )}
        </V1Section>
      )}
    </div>
  );
}

function V1MainP2({ cv, update, ink, ppmSplitIdx, omSplitIdx }) {
  const editable = !!window.__EDIT_ON;
  const titles = cv.sectionTitles || {};
  const exp = cv.experience || [];
  const co0 = exp[0];
  const ppm = co0 && co0.roles[0];
  const om = co0 && co0.roles[1];
  const ppmAt = ppm ? ((ppmSplitIdx != null) ? ppmSplitIdx : ppm.bullets.length) : 0;
  const omAt = om ? ((omSplitIdx != null) ? omSplitIdx : om.bullets.length) : 0;
  const ppmTail = ppm ? ppm.bullets.slice(ppmAt) : [];
  const omTail = om ? om.bullets.slice(omAt) : [];
  const showOmFull = ppmTail.length > 0;

  const addRole = (ci) => {
    const company = cv.experience[ci];
    update(['experience', ci, 'roles'], [...company.roles, { title: 'New role', dates: '', bullets: ['New bullet'] }]);
  };
  const deleteCompany = (ci) => {
    const exps = cv.experience.slice();
    exps.splice(ci, 1);
    update(['experience'], exps);
  };
  const addCompany = () => {
    update(['experience'], [...(cv.experience || []), { company: 'New company', companyNote: '', location: '', dates: '', roles: [{ title: 'New role', dates: '', bullets: ['New bullet'] }] }]);
  };
  const co0HasMoreOnP2 = co0 && (ppmTail.length > 0 || (om && (showOmFull || omTail.length > 0)) || co0.roles.length > 2);

  const mainOrder = ensureSectionOrder(cv).filter(s => s.visible && isMainSectionId(s.id));
  const expIdxInOrder = mainOrder.findIndex(s => s.id === 'experience');
  const expVisible = expIdxInOrder >= 0;
  const sectionsAfterExp = expIdxInOrder >= 0 ? mainOrder.slice(expIdxInOrder + 1) : [];

  return (
    <div style={{ flex: 1, padding: '42px 44px 48px', fontFamily: V1_FONT, boxSizing: 'border-box' }}>
      {expVisible && (
      <V1Section title={`${titles.experience || 'Work Experience'} (continued)`} ink={ink}>
        {co0 && co0HasMoreOnP2 && (
          <div className="company-block" style={{ marginBottom: 12, position: 'relative' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 2, gap: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: ink, letterSpacing: -0.2, flex: 1 }}>
                <Ed value={co0.company} onChange={(v) => update(['experience', 0, 'company'], v)} />
                <span style={{ fontWeight: 400, color: V1_MUTED, fontSize: 10 }}> &nbsp;·&nbsp; <Ed value={co0.companyNote} onChange={(v) => update(['experience', 0, 'companyNote'], v)} /> &nbsp;·&nbsp; continued</span>
              </div>
              <Ed value={co0.dates} onChange={(v) => update(['experience', 0, 'dates'], v)} style={{ fontSize: 9, color: V1_MUTED, fontFamily: V1_MONO }} />
            </div>
          </div>
        )}
        {ppmTail.length > 0 && (
          <div style={{ marginBottom: 14 }}>
            <V1Role role={ppmAt === 0 ? ppm : { ...ppm, title: ppm.title + ' (cont.)', bullets: ppmTail }}
              onRole={(nr) => update(['experience', 0, 'roles', 0], ppmAt === 0 ? nr : { ...ppm, title: nr.title.replace(/ \(cont\.\)$/, ''), dates: nr.dates, location: nr.location, bullets: [...ppm.bullets.slice(0, ppmAt), ...nr.bullets] })}
              onDelete={() => deleteRoleFn(cv, update, 0, 0)}
              ink={ink} companyLocation={co0.location} />
          </div>
        )}
        {showOmFull && om ? (
          <div style={{ marginBottom: 14 }}>
            <V1Role role={om} onRole={(nr) => update(['experience', 0, 'roles', 1], nr)}
              onDelete={() => deleteRoleFn(cv, update, 0, 1)}
              ink={ink} companyLocation={co0.location} />
          </div>
        ) : (om && omTail.length > 0 && (
          <div style={{ marginBottom: 14 }}>
            <V1Role role={{ ...om, title: om.title + ' (cont.)', bullets: omTail }}
              onRole={(nr) => update(['experience', 0, 'roles', 1], { ...om, title: nr.title.replace(/ \(cont\.\)$/, ''), dates: nr.dates, location: nr.location, bullets: [...om.bullets.slice(0, omAt), ...nr.bullets] })}
              onDelete={() => deleteRoleFn(cv, update, 0, 1)}
              ink={ink} companyLocation={co0.location} />
          </div>
        ))}
        {co0 && co0.roles.slice(2).map((role, idx) => (
          <div key={`co0-r${idx + 2}`} style={{ marginBottom: 14 }}>
            <V1Role role={role}
              onRole={(nr) => update(['experience', 0, 'roles', idx + 2], nr)}
              onDelete={() => deleteRoleFn(cv, update, 0, idx + 2)}
              last={idx === co0.roles.length - 3} ink={ink} companyLocation={co0.location} />
          </div>
        ))}
        {editable && co0 && (
          <button type="button" className="add-link screen-only" onClick={() => addRole(0)}>+ add role to {co0.company}</button>
        )}

        {exp.slice(1).map((co, ci) => {
          const realCi = ci + 1;
          return (
            <div key={`co${realCi}`} className="company-block" style={{ marginTop: 18, position: 'relative' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 2, gap: 8 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: ink, letterSpacing: -0.2, flex: 1 }}>
                  <Ed value={co.company} onChange={(v) => update(['experience', realCi, 'company'], v)} />
                  {(co.companyNote || editable) && (
                    <span style={{ fontWeight: 400, color: V1_MUTED, fontSize: 10 }}> &nbsp;·&nbsp; <Ed value={co.companyNote || ''} onChange={(v) => update(['experience', realCi, 'companyNote'], v)} /></span>
                  )}
                </div>
                <Ed value={co.dates} onChange={(v) => update(['experience', realCi, 'dates'], v)} style={{ fontSize: 9, color: V1_MUTED, fontFamily: V1_MONO }} />
                {editable && (
                  <button type="button" className="screen-only company-del"
                    onClick={() => { if (confirm(`Delete company "${co.company}" and all its roles?`)) deleteCompany(realCi); }}
                    title="Delete company"
                    style={DEL_BTN_STYLE}>×</button>
                )}
              </div>
              <div style={{ marginTop: 8 }}>
                {co.roles.map((role, ri) => (
                  <div key={ri} style={{ marginBottom: 14 }}>
                    <V1Role role={role}
                      onRole={(nr) => update(['experience', realCi, 'roles', ri], nr)}
                      onDelete={() => deleteRoleFn(cv, update, realCi, ri)}
                      last={ri === co.roles.length - 1} ink={ink} companyLocation={co.location} />
                  </div>
                ))}
              </div>
              {editable && (
                <button type="button" className="add-link screen-only" onClick={() => addRole(realCi)}>+ add role</button>
              )}
            </div>
          );
        })}

        {editable && (
          <div style={{ marginTop: 14 }}>
            <button type="button" className="add-link screen-only" onClick={addCompany}>+ add company</button>
          </div>
        )}
      </V1Section>
      )}
      {sectionsAfterExp.map(s => renderEditorialMainSection(s.id, cv, update, ink))}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
//  Cover Letter
// ════════════════════════════════════════════════════════════════
// One-shot seed — used when sender.lines is empty. After first edit the
// returned shape gets persisted and this seed never runs again for that profile.
function seedSenderLines(cv) {
  const c = cv.contact || {};
  return [
    { id: 'name',     value: cv.name     || '' },
    { id: 'address',  value: c.location  || '' },
    { id: 'phone',    value: c.phone     || '' },
    { id: 'email',    value: c.email     || '' },
    { id: 'linkedin', value: c.linkedin  || '' },
  ];
}
function getSenderLines(cv) {
  const s = (cv.coverLetter && cv.coverLetter.sender) || {};
  if (Array.isArray(s.lines) && s.lines.length) return s.lines;
  return seedSenderLines(cv);
}
function todayFormatted() {
  return new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

const lineCtrlBtn = {
  width: 14, height: 14, padding: 0, fontSize: 10, lineHeight: 1,
  background: '#fff', color: '#666',
  border: '1px solid #d8d4cb', borderRadius: 2, cursor: 'pointer',
  fontFamily: V1_MONO, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
};

// ── Letter geometry ─────────────────────────────────────────────
// The letter used to be one <CVPage>, and a <CVPage> is overflow:hidden — so
// anything past the fold was thrown away on screen and in the printed PDF with
// nothing to show for it. These are the numbers the layout always used, pulled
// out because the pagination budget below has to agree with them exactly.
const LETTER_BAND_W = 32;
const LETTER_PAD_TOP = 60, LETTER_PAD_X = 64, LETTER_PAD_BOTTOM = 56;
const LETTER_COL_W = A4_W - LETTER_BAND_W - LETTER_PAD_X * 2;
const LETTER_PAGE_H = A4_H - LETTER_PAD_TOP - LETTER_PAD_BOTTOM;
// The 14px the body and the signoff have always carried as marginTop.
const LETTER_BLOCK_GAP = 14;
const LETTER_BODY_STYLE = {
  fontSize: 11, lineHeight: 1.65,
  color: V1_INK_SOFT, letterSpacing: -0.01,
  whiteSpace: 'pre-wrap', textWrap: 'pretty',
};

// Head and signoff are components rather than inline JSX because the hidden
// measurement copy renders the very same markup the visible page does. Had
// they been duplicated, a style tweak landing in only one of the two copies
// would mis-paginate the letter in a way nothing on screen would explain.
function LetterHead({ cv, update, ink }) {
  const editable = !!window.__EDIT_ON;
  const cl = cv.coverLetter || {};
  const recipient = cl.recipient || {};
  const setCl = (key, val) => update(['coverLetter', key], val);
  const setRecipient = (key, val) => update(['coverLetter', 'recipient', key], val);

  const lines = getSenderLines(cv);
  const setLines = (next) => update(['coverLetter', 'sender', 'lines'], next);
  const editLine = (i, value) => setLines(lines.map((l, idx) => idx === i ? { ...l, value } : l));
  const removeLine = (i) => setLines(lines.filter((_, idx) => idx !== i));
  const moveLine = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= lines.length) return;
    const next = lines.slice();
    [next[i], next[j]] = [next[j], next[i]];
    setLines(next);
  };
  const addLine = () => setLines([...lines, { id: `custom_${Date.now()}`, value: '' }]);

  const lineStyle = (id) => id === 'name'
    ? { fontFamily: V1_FONT, fontSize: 22, fontWeight: 600, letterSpacing: -0.4, color: ink, marginBottom: 6, lineHeight: 1.1 }
    : { color: V1_MUTED };

  // Flex column here as well as on the page, so the measured height is the
  // rendered height: in plain block flow these children's top margins would
  // collapse differently and the budget would be off by tens of pixels.
  return (
    <div style={{ display: 'flex', flexDirection: 'column', flexShrink: 0 }}>
      {/* Sender block — top right */}
      <div style={{ display: 'flex', justifyContent: 'flex-end' }} title="Sender lines — add/remove/reorder freely.">
        <div style={{ textAlign: 'right', fontSize: 10.5, lineHeight: 1.55, color: V1_INK_SOFT, minWidth: 200 }}>
          {lines.map((l, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 4 }}>
              {editable && (
                <span className="screen-only" style={{ display: 'inline-flex', gap: 2, opacity: 0.6 }}>
                  <button onClick={() => moveLine(i, -1)} disabled={i === 0} title="Up"
                    style={lineCtrlBtn}>↑</button>
                  <button onClick={() => moveLine(i, 1)} disabled={i === lines.length - 1} title="Down"
                    style={lineCtrlBtn}>↓</button>
                  <button onClick={() => removeLine(i)} title="Remove line"
                    style={{ ...lineCtrlBtn, color: '#c96442' }}>×</button>
                </span>
              )}
              {/* A sender line is deliberately a contact value, so any TLD
                  links — no strict prose rules here. */}
              <Ed tag="div"
                value={l.value}
                onChange={(v) => editLine(i, v)}
                linkify={l.id !== 'name'} strictLinks={false}
                style={lineStyle(l.id)} />
            </div>
          ))}
          {editable && (
            <button type="button" className="add-link screen-only"
              onClick={addLine}
              style={{ marginTop: 4, background: 'transparent', border: 'none', fontSize: 9, color: '#999', cursor: 'pointer', padding: '2px 0' }}>
              + add line
            </button>
          )}
        </div>
      </div>

      {/* Date — right-aligned, below sender */}
      <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 18 }}>
        <Ed tag="div"
          value={cl.date || todayFormatted()}
          onChange={(v) => setCl('date', v)}
          style={{ fontSize: 10.5, color: V1_MUTED, fontFamily: V1_MONO, letterSpacing: 0.2 }} />
      </div>

      {/* Recipient block */}
      <div style={{ marginTop: 36, fontSize: 10.5, lineHeight: 1.55 }}>
        <Ed tag="div" value={recipient.name || ''} onChange={(v) => setRecipient('name', v)}
          placeholder="Recipient name"
          style={{ fontWeight: 600, color: ink, fontSize: 11.5 }} />
        <Ed tag="div" value={recipient.title || ''} onChange={(v) => setRecipient('title', v)}
          placeholder="Recipient title"
          style={{ color: V1_INK_SOFT }} />
        <Ed tag="div" value={recipient.company || ''} onChange={(v) => setRecipient('company', v)}
          placeholder="Company name"
          style={{ color: V1_INK_SOFT }} />
        <Ed tag="div" value={recipient.address || ''} onChange={(v) => setRecipient('address', v)}
          placeholder="Company address"
          style={{ color: V1_MUTED }} />
      </div>

      {/* Subject */}
      <Ed tag="div"
        value={cl.subject || ''}
        onChange={(v) => setCl('subject', v)}
        placeholder="Subject — e.g. Application for [role] at [company]"
        style={{
          marginTop: 28, fontSize: 12, fontWeight: 600, color: ink,
          letterSpacing: -0.05, textTransform: 'none',
        }} />

      {/* Salutation */}
      <Ed tag="div"
        value={cl.salutation || ''}
        onChange={(v) => setCl('salutation', v)}
        style={{ marginTop: 22, fontSize: 11, color: V1_INK_SOFT }} />
    </div>
  );
}

function LetterSignoff({ cv, update, ink }) {
  const cl = cv.coverLetter || {};
  const nameLine = getSenderLines(cv).find(l => l.id === 'name');
  return (
    <div>
      <Ed tag="div"
        value={cl.signoff || ''}
        onChange={(v) => update(['coverLetter', 'signoff'], v)}
        style={{ fontSize: 11, color: V1_INK_SOFT }} />
      <Ed tag="div"
        value={cl.signName || (nameLine && nameLine.value) || ''}
        onChange={(v) => update(['coverLetter', 'signName'], v)}
        style={{ marginTop: 18, fontSize: 11, fontWeight: 600, color: ink }} />
    </div>
  );
}

function CoverLetterDocument({ cv, update }) {
  const ink = (cv.theme && cv.theme.ink) || '#1a2a3a';
  const side = (cv.theme && cv.theme.side) || '#f4efe6';
  const cl = cv.coverLetter || {};
  const setCl = (key, val) => update(['coverLetter', key], val);

  // One atom per `\n`-separated paragraph. The newline between two paragraphs
  // is a separator, not a line of its own, so the paragraphs' measured heights
  // add up to exactly the height of the joined text — no fudge factor needed
  // to rejoin them, which is what makes the budget below trustworthy.
  const paras = (cl.body || '').split('\n');

  // ── Measure & paginate ──────────────────────────────────────
  // Same shape as LinearTemplate: every atom is measured in a hidden copy at
  // the real column width, then packed into pages against the budget. `lead`
  // is height that only exists when something is already on the page above —
  // here, the 14px the body and the signoff sit below whatever precedes them.
  const atoms = [
    { key: 'head', lead: 0 },
    ...paras.map((p, i) => ({ key: `b-${i}`, lead: i === 0 ? LETTER_BLOCK_GAP : 0, blank: p.trim() === '' })),
    { key: 'sign', lead: LETTER_BLOCK_GAP },
  ];
  const measureRefs = React.useRef({});
  const [pages, setPages] = React.useState(() => [atoms.map(a => a.key)]);

  React.useLayoutEffect(() => {
    const groups = [[]];
    let usedH = 0;
    for (const a of atoms) {
      const el = measureRefs.current[a.key];
      const h = el ? el.offsetHeight : 0;
      const last = groups[groups.length - 1];
      const overflows = last.length > 0 && usedH + a.lead + h > LETTER_PAGE_H;
      // An atom taller than a whole page gets a page of its own rather than an
      // endless run of them; only its own tail is lost, and only if someone
      // writes a single unbroken paragraph longer than A4.
      if (overflows && !a.blank) {
        groups.push([a.key]);
        usedH = h;
      } else {
        last.push(a.key);
        // A blank line that would otherwise open the next page falls off the
        // bottom of this one instead — it has nothing in it to lose, and the
        // paragraph after it then starts page two flush with the top margin
        // rather than under a gap the writer never put there.
        usedH = overflows ? LETTER_PAGE_H : usedH + (last.length > 1 ? a.lead : 0) + h;
      }
    }
    const flat = (g) => g.map(p => p.join('|')).join('||');
    if (flat(groups) !== flat(pages)) setPages(groups);
  });

  // Every page renders one contiguous slice of the same string, and an edit
  // splices its slice back into the whole. cl.body stays a single field on
  // disk with its shape untouched, and a paragraph added on page 2 pushes the
  // rest along exactly as it would have in one field.
  const replaceSlice = (from, to, text) =>
    setCl('body', [...paras.slice(0, from), ...text.split('\n'), ...paras.slice(to)].join('\n'));

  // Inset past the 32px band so the credit sits centred under the text column.
  const credit = creditFor(cv, LETTER_BAND_W, 0);

  return (
    <>
      {/* Hidden measurement copy — same width and font as the visible column.
          `update` is stubbed out: nothing here can be reached (visibility:
          hidden takes it out of the tab order too), and a stub says so. */}
      <div className="screen-only" aria-hidden style={{
        position: 'absolute', left: -9999, top: 0,
        width: LETTER_COL_W,
        visibility: 'hidden', pointerEvents: 'none',
        fontFamily: V1_FONT, color: V1_INK_SOFT,
      }}>
        <div ref={el => { measureRefs.current['head'] = el; }}>
          <LetterHead cv={cv} update={() => {}} ink={ink} />
        </div>
        {paras.map((p, i) => (
          // A blank line still takes up a line inside the body's pre-wrap
          // text, but an empty element measures as zero — hence the no-break
          // space standing in for it here.
          //
          // Linkified rather than raw, because `[my portfolio](bragi.dev)` is
          // half again as wide as the "my portfolio" the page actually shows.
          // Measured raw it would budget for lines the letter never draws and
          // break the page early. This copy is React's alone — no
          // contenteditable to fight over the children, so innerHTML here is
          // safe where it isn't in Ed — and linkHtml escapes what goes in.
          <div key={i} ref={el => { measureRefs.current[`b-${i}`] = el; }} style={LETTER_BODY_STYLE}
            dangerouslySetInnerHTML={{ __html: linkHtml(p, true) || '&nbsp;' }} />
        ))}
        <div ref={el => { measureRefs.current['sign'] = el; }}>
          <LetterSignoff cv={cv} update={() => {}} ink={ink} />
        </div>
      </div>

      {pages.map((pageKeys, pi) => {
        const hasHead = pageKeys.includes('head');
        const hasSign = pageKeys.includes('sign');
        // Stale keys survive for the one paint between the body shrinking and
        // the layout effect repaginating, so drop anything out of range.
        const onPage = pageKeys
          .filter(k => k.startsWith('b-'))
          .map(k => Number(k.slice(2)))
          .filter(i => i < paras.length);
        const from = onPage.length ? onPage[0] : 0;
        const to = onPage.length ? onPage[onPage.length - 1] + 1 : 0;
        return (
          <React.Fragment key={pi}>
            {pi > 0 && <PageBreakMarker index={pi - 1} />}
            <CVPage credit={credit}>
              <div style={{ display: 'flex', height: '100%' }}>
                <div style={{ width: LETTER_BAND_W, background: side, flexShrink: 0 }} aria-hidden />
                {/* Every child is flexShrink: 0. offsetHeight rounds to whole
                    pixels, so a packed page can land a few pixels over budget;
                    left to shrink, the column would quietly squeeze the body
                    and slide the signoff up over it. Held at their natural
                    heights they spill into the bottom padding instead, where
                    there is room and nothing to collide with. */}
                <div style={{
                  flex: 1, padding: `${LETTER_PAD_TOP}px ${LETTER_PAD_X}px ${LETTER_PAD_BOTTOM}px`,
                  fontFamily: V1_FONT, color: V1_INK_SOFT,
                  display: 'flex', flexDirection: 'column', boxSizing: 'border-box',
                }}>
                  {hasHead && <LetterHead cv={cv} update={update} ink={ink} />}
                  {onPage.length > 0 && (
                    // Ed commits on blur, so the letter never repaginates
                    // mid-keystroke — the page only reflows once the caret has
                    // left, which is what keeps the caret where the user put it.
                    <Ed tag="div"
                      value={paras.slice(from, to).join('\n')}
                      onChange={(v) => replaceSlice(from, to, v)}
                      multiline linkify
                      style={{ ...LETTER_BODY_STYLE, flexShrink: 0, marginTop: hasHead ? LETTER_BLOCK_GAP : 0 }} />
                  )}
                  {hasSign && (
                    <div style={{ flexShrink: 0, marginTop: (hasHead || onPage.length) ? LETTER_BLOCK_GAP : 0 }}>
                      <LetterSignoff cv={cv} update={update} ink={ink} />
                    </div>
                  )}
                </div>
              </div>
            </CVPage>
          </React.Fragment>
        );
      })}
    </>
  );
}

//  CV template registry
//
//  Each template is a pure renderer: same `cv` blob in, different
//  layout out. Switching templates never mutates content.
//
//  Template component signature:
//    ({ cv, update, headshotSrc, onHeadshotSrc, onHeadshotTransform,
//       onHeadshotClear }) => JSX
//
//  Shared primitives every template can use:
//    - <CVPage>         A4 page shell with screen + print rules
//    - <PageBreakMarker> screen-only "page break" indicator
//    - <HeadshotEditor>  headshot upload/crop with editor panel
//    - <V1Section>       section header + content (Editorial-flavored)
//    - <Ed>              inline-editable primitive
//    - A4_W / A4_H       canonical A4 dimensions in CSS px
//
//  Theme tokens come from cv.theme.ink and cv.theme.side. Templates
//  can interpret these however they want; e.g. Linear uses `side` as
//  an accent color for dividers since it has no sidebar.
// ════════════════════════════════════════════════════════════════
const TEMPLATES = {
  'editorial':        { label: 'Editorial' },
  'editorial-mirror': { label: 'Editorial Mirror' },
  'linear':           { label: 'Linear' },
};
const DEFAULT_TEMPLATE_ID = 'editorial';
function resolveTemplateId(id) {
  return TEMPLATES[id] ? id : DEFAULT_TEMPLATE_ID;
}

function EditorialTemplate({ cv, update, headshotSrc, onHeadshotSrc, onHeadshotTransform, onHeadshotClear, mirror = false }) {
  const ink = (cv.theme && cv.theme.ink) || '#1a2a3a';
  const side = (cv.theme && cv.theme.side) || '#f4efe6';

  const AVAIL_P1 = 700;
  const measureRefs = React.useRef({});
  const visibleIds = visibleSidebarSections(cv).map(m => m.id);
  const splitIdx = useSidebarSplit(visibleIds, AVAIL_P1, measureRefs);

  const ppm = cv.experience[0] && cv.experience[0].roles[0];
  const om = cv.experience[0] && cv.experience[0].roles[1];
  const measureMainRef = React.useRef(null);
  const [ppmSplitIdx, setPpmSplitIdx] = React.useState(ppm ? ppm.bullets.length : 0);
  const [omSplitIdx, setOmSplitIdx] = React.useState(om ? om.bullets.length : 0);

  React.useLayoutEffect(() => {
    const root = measureMainRef.current;
    if (!root || !ppm) return;
    const PAGE_H = A4_H, BOTTOM_PAD = 32;
    const limit = PAGE_H - BOTTOM_PAD;
    const rootTop = root.getBoundingClientRect().top;
    // The measure copy lives inside .cv-stage, which is scaled with CSS
    // `zoom`, and getBoundingClientRect returns zoom-scaled coordinates while
    // `limit` is in unscaled A4 pixels. Unzoomed the factor is 1; at 150% the
    // raw compare pushed fitting bullets onto page 2, at 50% page 1 clipped.
    const stage = root.closest('.cv-stage');
    const zoomFactor = (stage && parseFloat(stage.style.zoom)) || 1;
    const bottomOf = (el) => (el.getBoundingClientRect().bottom - rootTop) / zoomFactor;
    const ppmLis = root.querySelectorAll('li[data-flow-role="ppm"]');
    const omLis = root.querySelectorAll('li[data-flow-role="om"]');
    let ppmFit = ppm.bullets.length, omFit = om ? om.bullets.length : 0, overflowed = false;
    for (let i = 0; i < ppmLis.length; i++) {
      if (bottomOf(ppmLis[i]) > limit) { ppmFit = i; overflowed = true; break; }
    }
    if (overflowed) { omFit = 0; }
    else if (om) {
      for (let i = 0; i < omLis.length; i++) {
        if (bottomOf(omLis[i]) > limit) { omFit = i; break; }
      }
    }
    if (ppmFit !== ppmSplitIdx) setPpmSplitIdx(ppmFit);
    if (omFit !== omSplitIdx) setOmSplitIdx(omFit);
  });

  const flexDir = mirror ? 'row-reverse' : 'row';
  // CSS variables exposed so future template-specific CSS can use var(--cv-ink) etc.
  const pageStyle = { '--cv-ink': ink, '--cv-side': side };
  // Inset past the 240px sidebar band so the credit sits under the main column.
  const credit = mirror ? creditFor(cv, 0, 240) : creditFor(cv, 240, 0);

  return (
    <>
      <div className="screen-only">
        <MeasurementSidebar cv={cv} update={update} measureRefs={measureRefs} ink={ink} side={side} />
        <div aria-hidden style={{ position: 'absolute', left: -9999, top: 0, width: A4_W - 240, visibility: 'hidden', pointerEvents: 'none' }} ref={measureMainRef}>
          <V1MainP1 cv={cv} update={() => {}} ink={ink} ppmSplitIdx={ppm ? ppm.bullets.length : 0} omSplitIdx={om ? om.bullets.length : 0} />
        </div>
      </div>
      <CVPage style={pageStyle} credit={credit}>
        <div style={{ display: 'flex', flexDirection: flexDir, height: '100%' }}>
          <V1Sidebar cv={cv} update={update} page={1} splitIdx={splitIdx} ink={ink} side={side}
            headshotSrc={headshotSrc} onHeadshotSrc={onHeadshotSrc}
            onHeadshotTransform={onHeadshotTransform} onHeadshotClear={onHeadshotClear} />
          <V1MainP1 cv={cv} update={update} ink={ink} ppmSplitIdx={ppmSplitIdx} omSplitIdx={omSplitIdx} />
        </div>
      </CVPage>
      <PageBreakMarker index={0} />
      <CVPage style={pageStyle} credit={credit}>
        <div style={{ display: 'flex', flexDirection: flexDir, height: '100%' }}>
          <V1Sidebar cv={cv} update={update} page={2} splitIdx={splitIdx} ink={ink} side={side} />
          <V1MainP2 cv={cv} update={update} ink={ink} ppmSplitIdx={ppmSplitIdx} omSplitIdx={omSplitIdx} />
        </div>
      </CVPage>
    </>
  );
}

function EditorialMirrorTemplate(props) {
  return <EditorialTemplate {...props} mirror />;
}

const LINEAR_PADDING_TOP = 48;
const LINEAR_PADDING_BOTTOM = 36;
const LINEAR_PADDING_X = 56;
const LINEAR_BODY_H = A4_H - LINEAR_PADDING_TOP - LINEAR_PADDING_BOTTOM;
const LINEAR_SECTION_HEADING_H = 30;
const LINEAR_SUBSECTION_HEADER_H = 26;
const LINEAR_ATOM_GAP = 16;

function LinearSectionHeader({ title, ink, onTitleChange, continuation = false }) {
  return (
    <h3 style={{
      fontFamily: V1_FONT, fontSize: 8.5, fontWeight: 600,
      letterSpacing: 1.8, textTransform: 'uppercase',
      color: ink, margin: 0, paddingBottom: 5,
      borderBottom: `1px solid ${V1_RULE}`, marginBottom: 9,
    }}>
      {onTitleChange && !continuation
        ? <Ed value={title} onChange={onTitleChange} />
        : (continuation ? `${title} (continued)` : title)}
    </h3>
  );
}

function LinearTemplate({ cv, update, headshotSrc, onHeadshotSrc, onHeadshotTransform, onHeadshotClear }) {
  const ink = (cv.theme && cv.theme.ink) || '#1a2a3a';
  const side = (cv.theme && cv.theme.side) || '#f4efe6';
  const titles = cv.sectionTitles || {};
  const editable = !!window.__EDIT_ON;
  const pageStyle = { '--cv-ink': ink, '--cv-side': side };
  const credit = creditFor(cv, LINEAR_PADDING_X, LINEAR_PADDING_X);

  const addRole = (ci) => {
    const co = cv.experience[ci];
    update(['experience', ci, 'roles'], [...co.roles, { title: 'New role', dates: '', bullets: ['New bullet'] }]);
  };
  const deleteCompany = (ci) => {
    const exps = cv.experience.slice();
    exps.splice(ci, 1);
    update(['experience'], exps);
  };
  const addCompany = () => {
    update(['experience'], [...(cv.experience || []), { company: 'New company', companyNote: '', location: '', dates: '', roles: [{ title: 'New role', dates: '', bullets: ['New bullet'] }] }]);
  };

  // ── Atom factories ───────────────────────────────────────────
  const renderHeader = () => (
    <>
      <header style={{ display: 'flex', alignItems: 'flex-start', gap: 28, marginBottom: 20 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <Ed tag="h1" value={cv.name} onChange={(v) => update(['name'], v)}
            style={{ fontFamily: V1_FONT, fontSize: 42, fontWeight: 700, letterSpacing: -1.4, margin: 0, lineHeight: 1.02, color: ink, textWrap: 'balance', display: 'block' }} />
          <Ed tag="div" value={cv.title} onChange={(v) => update(['title'], v)}
            style={{ fontSize: 13, color: V1_MUTED, marginTop: 8, letterSpacing: 0.1, display: 'block', fontWeight: 400 }} />
          <div style={{ marginTop: 14, fontSize: 10.5, lineHeight: 1.5, color: V1_INK_SOFT, display: 'flex', flexWrap: 'wrap', gap: '2px 16px' }}>
            {cv.contact.email && (
              <ContactRow href={`mailto:${cv.contact.email}`} value={cv.contact.email} onChange={(v) => update(['contact', 'email'], v)} />
            )}
            {cv.contact.phone && (
              <ContactRow href={`tel:${(cv.contact.phone || '').replace(/\s+/g, '')}`} value={cv.contact.phone} onChange={(v) => update(['contact', 'phone'], v)} />
            )}
            {cv.contact.linkedin && (
              <ContactRow href={`https://${(cv.contact.linkedin || '').replace(/^https?:\/\//, '')}`} value={cv.contact.linkedin} onChange={(v) => update(['contact', 'linkedin'], v)} external />
            )}
            {cv.contact.location && <Ed value={cv.contact.location} onChange={(v) => update(['contact', 'location'], v)} style={{ color: V1_MUTED }} />}
            {cv.contact.relocation && <Ed value={cv.contact.relocation} onChange={(v) => update(['contact', 'relocation'], v)} style={{ color: V1_MUTED, fontStyle: 'italic' }} />}
          </div>
        </div>
        <div style={{ flexShrink: 0 }}>
          <HeadshotEditor
            src={headshotSrc}
            transform={cv.headshot}
            onSrcChange={onHeadshotSrc}
            onTransformChange={onHeadshotTransform}
            onClear={onHeadshotClear}
          />
        </div>
      </header>
      <div style={{ height: 1, background: side, marginBottom: 18 }} />
    </>
  );

  const renderProfileBody = () => (
    <Ed tag="p" value={cv.summary} onChange={(v) => update(['summary'], v)} multiline
      style={{ margin: 0, fontSize: 10.75, lineHeight: 1.6, color: V1_INK_SOFT, textWrap: 'pretty', letterSpacing: -0.02, display: 'block', whiteSpace: 'pre-wrap' }} />
  );

  const renderCompanyHeader = (co, ci, continuation = false) => (
    <div className="company-block" style={{ position: 'relative', marginBottom: 6 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 2, gap: 8 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: ink, letterSpacing: -0.2, flex: 1 }}>
          <Ed value={co.company} onChange={(v) => update(['experience', ci, 'company'], v)} />
          {(co.companyNote || editable) && (
            <span style={{ fontWeight: 400, color: V1_MUTED, fontSize: 10 }}> &nbsp;·&nbsp; <Ed value={co.companyNote || ''} onChange={(v) => update(['experience', ci, 'companyNote'], v)} /></span>
          )}
          {continuation && <span style={{ fontWeight: 400, color: V1_MUTED, fontSize: 10, fontStyle: 'italic' }}> &nbsp;(continued)</span>}
        </div>
        <Ed value={co.dates} onChange={(v) => update(['experience', ci, 'dates'], v)} style={{ fontSize: 9, color: V1_MUTED, fontFamily: V1_MONO }} />
        {editable && ci > 0 && !continuation && (
          <button type="button" className="screen-only company-del"
            onClick={() => { if (confirm(`Delete company "${co.company}" and all its roles?`)) deleteCompany(ci); }}
            title="Delete company"
            style={DEL_BTN_STYLE}>×</button>
        )}
      </div>
    </div>
  );

  const renderEducationEntry = (e, i) => (
    <EducationEntry e={e} i={i} cv={cv} update={update} ink={ink} editable={editable} />
  );
  const renderHonourEntry = (h, i) => (
    <HonourEntry h={h} i={i} cv={cv} update={update} ink={ink} editable={editable} />
  );

  // Build atoms list, driven by cv.sectionOrder. Each visible section dispatches
  // to a builder for its kind. Header always first; metrics follow profile.
  const atoms = [];
  atoms.push({ key: 'header', section: null, render: renderHeader });
  const order = ensureSectionOrder(cv);
  const sidebarMetaById = Object.fromEntries((cv.sidebar || []).map(m => [m.id, m]));
  for (const sec of order) {
    if (!sec.visible) continue;
    const id = sec.id;
    if (id === 'profile') {
      atoms.push({ key: 'profile', section: 'profile', sectionTitle: titles.profile || 'Profile', onTitleChange: (v) => update(['sectionTitles', 'profile'], v), render: renderProfileBody });
      if (cv.metrics && cv.metrics.length) {
        atoms.push({ key: 'metrics', section: null, render: () => <V1MetricRail metrics={cv.metrics} update={update} ink={ink} /> });
      }
    } else if (id === 'experience') {
      (cv.experience || []).forEach((co, ci) => {
        const subKey = `exp-co-${ci}`;
        const subRender = (cont) => renderCompanyHeader(co, ci, cont);
        (co.roles || []).forEach((role, ri) => {
          atoms.push({
            key: `${subKey}-role-${ri}`,
            section: 'experience',
            sectionTitle: titles.experience || 'Work Experience',
            onTitleChange: (v) => update(['sectionTitles', 'experience'], v),
            subsection: subKey,
            subsectionRender: subRender,
            render: () => (
              <div style={{ marginBottom: 8 }}>
                <V1Role role={role}
                  onRole={(nr) => update(['experience', ci, 'roles', ri], nr)}
                  onDelete={() => deleteRoleFn(cv, update, ci, ri)}
                  last={ri === co.roles.length - 1} ink={ink} companyLocation={co.location} />
              </div>
            ),
          });
        });
        if (editable) {
          atoms.push({
            key: `${subKey}-add-role`,
            section: 'experience',
            sectionTitle: titles.experience || 'Work Experience',
            subsection: subKey,
            subsectionRender: subRender,
            render: () => <button type="button" className="add-link screen-only" onClick={() => addRole(ci)}>+ add role</button>,
          });
        }
      });
      if (editable) {
        atoms.push({
          key: 'exp-add', section: 'experience',
          sectionTitle: titles.experience || 'Work Experience',
          render: () => <button type="button" className="add-link screen-only" onClick={addCompany}>+ add company</button>,
        });
      }
    } else if (id === 'education') {
      (cv.education || []).forEach((e, i) => {
        atoms.push({
          key: `edu-${i}`, section: 'education',
          sectionTitle: titles.education || 'Education',
          onTitleChange: (v) => update(['sectionTitles', 'education'], v),
          render: () => renderEducationEntry(e, i),
        });
      });
      if (editable) {
        atoms.push({
          key: 'edu-add', section: 'education',
          sectionTitle: titles.education || 'Education',
          render: () => <button type="button" className="add-link screen-only" onClick={() => update(['education'], [...cv.education, { degree: 'New degree', spec: '', school: '', location: '', dates: '', note: '' }])}>+ add education</button>,
        });
      }
    } else if (id === 'honours') {
      (cv.honours || []).forEach((h, i) => {
        atoms.push({
          key: `hon-${i}`, section: 'honours',
          sectionTitle: titles.honours || 'Honours and Achievements',
          onTitleChange: (v) => update(['sectionTitles', 'honours'], v),
          render: () => renderHonourEntry(h, i),
        });
      });
      if (editable) {
        atoms.push({
          key: 'hon-add', section: 'honours',
          sectionTitle: titles.honours || 'Honours and Achievements',
          render: () => <button type="button" className="add-link screen-only" onClick={() => update(['honours'], [...(cv.honours || []), { title: 'New honour', years: '', text: '' }])}>+ add honour</button>,
        });
      }
    } else {
      // Sidebar item — render via existing sidebar renderer (self-contained section block).
      const meta = sidebarMetaById[id];
      if (meta) {
        atoms.push({
          key: `side-${id}`, section: null,
          render: () => renderSidebarSection(meta, cv, update, ink),
        });
      }
    }
  }

  // ── Measure & paginate ──────────────────────────────────────
  const measureRefs = React.useRef({});
  const [pages, setPages] = React.useState(() => [atoms.map(a => a.key)]);

  React.useLayoutEffect(() => {
    const heights = {};
    for (const a of atoms) {
      const el = measureRefs.current[a.key];
      heights[a.key] = el ? el.offsetHeight : 0;
    }
    const groups = [[]];
    let usedH = 0;
    let curSections = new Set();
    let curSubsections = new Set();
    for (const a of atoms) {
      const h = heights[a.key] || 0;
      const needsHeading = a.section && !curSections.has(a.section);
      const needsSub = a.subsection && !curSubsections.has(a.subsection);
      const extraH = (needsHeading ? LINEAR_SECTION_HEADING_H : 0)
                   + (needsSub ? LINEAR_SUBSECTION_HEADER_H : 0);
      const total = h + extraH + LINEAR_ATOM_GAP;
      const last = groups[groups.length - 1];
      if (last.length > 0 && usedH + total > LINEAR_BODY_H) {
        groups.push([]);
        usedH = 0;
        curSections = new Set();
        curSubsections = new Set();
      }
      const target = groups[groups.length - 1];
      target.push(a.key);
      const headExtra = (a.section && !curSections.has(a.section)) ? LINEAR_SECTION_HEADING_H : 0;
      const subExtra = (a.subsection && !curSubsections.has(a.subsection)) ? LINEAR_SUBSECTION_HEADER_H : 0;
      usedH += h + headExtra + subExtra + LINEAR_ATOM_GAP;
      if (a.section) curSections.add(a.section);
      if (a.subsection) curSubsections.add(a.subsection);
    }
    const flat = (g) => g.map(p => p.join('|')).join('||');
    if (flat(groups) !== flat(pages)) setPages(groups);
  });

  // Which page each section / subsection first appears on (for "(continued)" markers)
  const firstPageOf = {};
  const firstPageOfSub = {};
  pages.forEach((pageKeys, pi) => {
    for (const k of pageKeys) {
      const a = atoms.find(x => x.key === k);
      if (a && a.section && !(a.section in firstPageOf)) firstPageOf[a.section] = pi;
      if (a && a.subsection && !(a.subsection in firstPageOfSub)) firstPageOfSub[a.subsection] = pi;
    }
  });

  return (
    <>
      {/* Hidden measurement copy — same width and font as visible page body */}
      <div className="screen-only" aria-hidden style={{
        position: 'absolute', left: -9999, top: 0,
        width: A4_W - LINEAR_PADDING_X * 2,
        visibility: 'hidden', pointerEvents: 'none',
        fontFamily: V1_FONT, color: V1_INK_SOFT,
      }}>
        {atoms.map(a => (
          <div key={a.key} ref={el => { measureRefs.current[a.key] = el; }} style={{ marginBottom: LINEAR_ATOM_GAP }}>
            {a.render()}
          </div>
        ))}
      </div>

      {pages.map((pageKeys, pi) => {
        const shownSections = new Set();
        const shownSubsections = new Set();
        return (
          <React.Fragment key={pi}>
            {pi > 0 && <PageBreakMarker index={pi - 1} />}
            <CVPage style={pageStyle} credit={credit}>
              <div style={{
                padding: `${LINEAR_PADDING_TOP}px ${LINEAR_PADDING_X}px ${LINEAR_PADDING_BOTTOM}px`,
                height: '100%', boxSizing: 'border-box',
                fontFamily: V1_FONT, color: V1_INK_SOFT, overflow: 'hidden',
              }}>
                {pageKeys.map(key => {
                  const a = atoms.find(x => x.key === key);
                  if (!a) return null;
                  let sectionHeading = null;
                  let subHeading = null;
                  if (a.section && !shownSections.has(a.section)) {
                    shownSections.add(a.section);
                    const cont = pi > (firstPageOf[a.section] ?? pi);
                    sectionHeading = (
                      <LinearSectionHeader
                        title={a.sectionTitle}
                        ink={ink}
                        onTitleChange={cont ? null : a.onTitleChange}
                        continuation={cont}
                      />
                    );
                  }
                  if (a.subsection && !shownSubsections.has(a.subsection) && a.subsectionRender) {
                    shownSubsections.add(a.subsection);
                    const subCont = pi > (firstPageOfSub[a.subsection] ?? pi);
                    subHeading = a.subsectionRender(subCont);
                  }
                  return (
                    <div key={key} style={{ marginBottom: LINEAR_ATOM_GAP }}>
                      {sectionHeading}
                      {subHeading}
                      {a.render()}
                    </div>
                  );
                })}
              </div>
            </CVPage>
          </React.Fragment>
        );
      })}
    </>
  );
}

TEMPLATES['editorial'].component = EditorialTemplate;
TEMPLATES['editorial-mirror'].component = EditorialMirrorTemplate;
TEMPLATES['linear'].component = LinearTemplate;

function CVDocument(props) {
  const templateId = resolveTemplateId(props.cv && props.cv.templateId);
  const Tmpl = TEMPLATES[templateId].component;
  return <Tmpl {...props} />;
}

// ── Wireframe icons for the template picker ─────────────────────
function TemplateWireframe({ templateId, size = 'sm' }) {
  const W = size === 'lg' ? 40 : 16;
  const H = size === 'lg' ? 56 : 22;
  const stroke = 'currentColor';
  if (templateId === 'editorial-mirror') {
    return (
      <svg width={W} height={H} viewBox="0 0 24 34" fill="none" aria-hidden style={{ flexShrink: 0 }}>
        <rect x="0.6" y="0.6" width="22.8" height="32.8" stroke={stroke} strokeOpacity="0.55" />
        <rect x="14" y="3" width="7" height="28" fill={stroke} fillOpacity="0.7" />
        <line x1="3" y1="6"  x2="11" y2="6"  stroke={stroke} strokeOpacity="0.7" strokeWidth="0.9" />
        <line x1="3" y1="10" x2="12" y2="10" stroke={stroke} strokeOpacity="0.55" />
        <line x1="3" y1="14" x2="12" y2="14" stroke={stroke} strokeOpacity="0.55" />
        <line x1="3" y1="18" x2="10" y2="18" stroke={stroke} strokeOpacity="0.55" />
        <line x1="3" y1="22" x2="12" y2="22" stroke={stroke} strokeOpacity="0.55" />
        <line x1="3" y1="26" x2="9"  y2="26" stroke={stroke} strokeOpacity="0.55" />
      </svg>
    );
  }
  if (templateId === 'linear') {
    return (
      <svg width={W} height={H} viewBox="0 0 24 34" fill="none" aria-hidden style={{ flexShrink: 0 }}>
        <rect x="0.6" y="0.6" width="22.8" height="32.8" stroke={stroke} strokeOpacity="0.55" />
        <rect x="3" y="4" width="14" height="2.4" fill={stroke} fillOpacity="0.85" />
        <line x1="3" y1="9"  x2="13" y2="9"  stroke={stroke} strokeOpacity="0.55" />
        <line x1="3" y1="13" x2="21" y2="13" stroke={stroke} strokeOpacity="0.55" />
        <line x1="3" y1="17" x2="20" y2="17" stroke={stroke} strokeOpacity="0.55" />
        <line x1="3" y1="21" x2="21" y2="21" stroke={stroke} strokeOpacity="0.55" />
        <line x1="3" y1="25" x2="18" y2="25" stroke={stroke} strokeOpacity="0.55" />
        <line x1="3" y1="29" x2="21" y2="29" stroke={stroke} strokeOpacity="0.55" />
      </svg>
    );
  }
  // editorial (default)
  return (
    <svg width={W} height={H} viewBox="0 0 24 34" fill="none" aria-hidden style={{ flexShrink: 0 }}>
      <rect x="0.6" y="0.6" width="22.8" height="32.8" stroke={stroke} strokeOpacity="0.55" />
      <rect x="3" y="3" width="7" height="28" fill={stroke} fillOpacity="0.7" />
      <line x1="12" y1="6"  x2="21" y2="6"  stroke={stroke} strokeOpacity="0.7" strokeWidth="0.9" />
      <line x1="12" y1="10" x2="20" y2="10" stroke={stroke} strokeOpacity="0.55" />
      <line x1="12" y1="14" x2="21" y2="14" stroke={stroke} strokeOpacity="0.55" />
      <line x1="12" y1="18" x2="19" y2="18" stroke={stroke} strokeOpacity="0.55" />
      <line x1="12" y1="22" x2="21" y2="22" stroke={stroke} strokeOpacity="0.55" />
      <line x1="12" y1="26" x2="18" y2="26" stroke={stroke} strokeOpacity="0.55" />
    </svg>
  );
}
