// ════════════════════════════════════════════════════════════════
//  App root
// ════════════════════════════════════════════════════════════════
function App() {
  const [editOn, setEditOnState] = React.useState(() => {
    const saved = localStorage.getItem('cv-edit-on');
    return saved == null ? true : saved === '1';
  });
  React.useEffect(() => {
    window.__EDIT_ON = editOn;
    localStorage.setItem('cv-edit-on', editOn ? '1' : '0');
  }, [editOn]);
  const setEditOn = (v) => { window.__EDIT_ON = v; setEditOnState(v); };

  const [zoom, setZoom] = React.useState(() => {
    const v = parseFloat(localStorage.getItem('cv-zoom'));
    return Number.isFinite(v) && v >= 0.25 && v <= 2 ? v : 1;
  });
  React.useEffect(() => { localStorage.setItem('cv-zoom', String(zoom)); }, [zoom]);
  const clampZoom = (v) => Math.max(0.25, Math.min(2, Math.round(v * 100) / 100));

  // ── Custom statuses ──────────────────────────────────────────
  const [customStatuses, setCustomStatusesState] = React.useState(() => loadCustomStatuses());
  const setCustomStatuses = (next) => {
    const list = typeof next === 'function' ? next(customStatuses) : next;
    setCustomStatusesState(list);
    saveCustomStatuses(list);
  };
  const [statusOrder, setStatusOrderState] = React.useState(() => loadStatusOrder());
  const setStatusOrder = (next) => {
    const list = typeof next === 'function' ? next(statusOrder) : next;
    setStatusOrderState(list);
    saveStatusOrder(list);
  };
  const allStatuses = React.useMemo(
    () => combineStatuses(customStatuses, statusOrder),
    [customStatuses, statusOrder]
  );
  const allStatusesById = React.useMemo(
    () => Object.fromEntries(allStatuses.map(s => [s.id, s])),
    [allStatuses]
  );
  const statusesContextValue = React.useMemo(
    () => ({ statuses: allStatuses, byId: allStatusesById }),
    [allStatuses, allStatusesById]
  );

  // ── Folder-package sync ──────────────────────────────────────
  // syncState: 'unsupported' | 'idle' | 'connecting' | 'bound' | 'needs-reconnect' | 'error'
  const [syncState, setSyncState] = React.useState(() => FSA_SUPPORTED ? 'idle' : 'unsupported');
  const [syncDirHandle, setSyncDirHandle] = React.useState(null);
  const [syncDirName, setSyncDirName] = React.useState('');
  const [syncBannerDismissed, setSyncBannerDismissed] = React.useState(() => {
    try { return localStorage.getItem(SYNC_DISMISSED_KEY) === '1'; } catch { return false; }
  });
  const dismissSyncBanner = () => {
    setSyncBannerDismissed(true);
    try { localStorage.setItem(SYNC_DISMISSED_KEY, '1'); } catch {}
  };
  const syncDirHandleRef = React.useRef(null);
  React.useEffect(() => { syncDirHandleRef.current = syncDirHandle; }, [syncDirHandle]);

  // ── Application state (post-migration model) ─────────────────
  const [apps, setApps] = React.useState(() => {
    const list = loadAppsMeta();
    if (list.length > 0) return list;
    // Bootstrap: no apps at all → create a fresh Base
    const id = genId();
    saveAppCv(id, SEED_CV);
    const meta = makeAppMeta({
      id, isBase: true,
      company: 'Base CV', position: 'Master CV',
      headshotKey: appHeadshotKeyV2(id),
    });
    saveAppsMeta([meta]);
    persistActiveAppId(id);
    return [meta];
  });
  React.useEffect(() => { saveAppsMeta(apps); }, [apps]);

  const [activeAppId, setActiveAppIdState] = React.useState(() => {
    const id = loadActiveAppId();
    const list = loadAppsMeta();
    if (id && list.some(a => a.id === id)) return id;
    return (list.find(a => a.isBase) || list[0] || {}).id || null;
  });
  const setActiveAppId = (id) => {
    setActiveAppIdState(id);
    if (id) persistActiveAppId(id);
  };

  const [doc, setDocState] = React.useState(() => {
    const v = localStorage.getItem('cv-active-doc');
    return (v === 'letter' || v === 'applications') ? v : 'cv';
  });
  const setDoc = (v) => { setDocState(v); try { localStorage.setItem('cv-active-doc', v); } catch {} };

  // Both floating panels default to flanking the document. Their final left
  // offsets are computed here and published as CSS variables, so the panels
  // stay pure CSS until dragged and there is one place that knows the maths.
  //
  // Everything is expressed as `left`, in getBoundingClientRect coordinates.
  // Using `right` instead would mean mixing in the viewport width, and
  // `scrollbar-gutter: stable` on <html> makes that ambiguous: clientWidth
  // reports the full width while a fixed element's box excludes the reserved
  // gutter, which put the right-hand panel a gutter's width out of place.
  React.useLayoutEffect(() => {
    const root = document.documentElement;
    const setEdges = () => {
      const page = document.querySelector('.cv-page');
      if (!page) return;
      const r = page.getBoundingClientRect();
      const GAP = 16, EDGE = 8, TW_W = 280;
      // Properties panel sits in the gutter LEFT of the document; clamp to the
      // screen edge when the window is too narrow for a full gutter.
      root.style.setProperty('--tw-left',
        `${Math.round(Math.max(EDGE, r.left - TW_W - GAP))}px`);
    };
    setEdges();
    window.addEventListener('resize', setEdges);
    return () => window.removeEventListener('resize', setEdges);
  }, [zoom, doc]);

  const [viewingSnapshot, setViewingSnapshot] = React.useState(null);
  const editPriorRef = React.useRef(null);
  React.useEffect(() => {
    if (viewingSnapshot) {
      editPriorRef.current = window.__EDIT_ON;
      window.__EDIT_ON = false;
      setEditOnState(false);
    } else if (editPriorRef.current != null) {
      window.__EDIT_ON = editPriorRef.current;
      setEditOnState(editPriorRef.current);
      editPriorRef.current = null;
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [viewingSnapshot]);

  // Active app's CV blob — lazy loaded from cv-app:<id>
  const [cv, setCv] = React.useState(() => {
    const id = loadActiveAppId();
    const blob = id ? loadAppCv(id) : null;
    return deepMerge(SEED_CV, blob || {});
  });
  // Track which app the current cv state belongs to (so saves go to the right key)
  const cvAppIdRef = React.useRef(activeAppId);
  // Skip save effect on initial mount / app switches (we just loaded that data; saving back is a no-op)
  const skipNextSaveRef = React.useRef(true);

  // Load CV blob when activeAppId changes
  React.useEffect(() => {
    if (!activeAppId) return;
    if (cvAppIdRef.current === activeAppId) return; // already loaded
    const blob = loadAppCv(activeAppId);
    skipNextSaveRef.current = true;
    setCv(deepMerge(SEED_CV, blob || {}));
    cvAppIdRef.current = activeAppId;
  }, [activeAppId]);

  // Debounced persist of cv to its app + bump updatedAt
  React.useEffect(() => {
    if (!activeAppId || !cv) return;
    if (skipNextSaveRef.current) { skipNextSaveRef.current = false; return; }
    const t = setTimeout(() => {
      saveAppCv(activeAppId, cv);
      setApps(prev => prev.map(a => a.id === activeAppId
        ? { ...a, updatedAt: new Date().toISOString() }
        : a));
    }, 250);
    return () => clearTimeout(t);
  }, [cv, activeAppId]);

  const update = React.useCallback((path, value) => {
    setCv(prev => setPath(prev, path, value));
  }, []);

  // Headshot (IDB per active app)
  const [headshotSrc, setHeadshotSrc] = React.useState(null);
  React.useEffect(() => {
    let cancelled = false;
    setHeadshotSrc(null);
    if (!activeAppId) return;
    idbGet(appHeadshotKeyV2(activeAppId)).then(v => { if (!cancelled) setHeadshotSrc(v || null); });
    return () => { cancelled = true; };
  }, [activeAppId]);
  const onHeadshotSrc = (dataUrl) => {
    setHeadshotSrc(dataUrl);
    if (activeAppId) idbPut(appHeadshotKeyV2(activeAppId), dataUrl);
    update(['headshot'], { ...cv.headshot, x: 0, y: 0, scale: 1 });
    // Mirror to bound folder
    const handle = syncDirHandleRef.current;
    if (handle && activeAppId) {
      writeImageFile(handle, activeAppId, dataUrl)
        .then(() => writeJsonSync(handle))
        .catch(e => console.warn('sync image write failed', e));
    }
  };
  const onHeadshotTransform = (t) => update(['headshot'], t);
  const onHeadshotClear = () => {
    setHeadshotSrc(null);
    if (activeAppId) idbDel(appHeadshotKeyV2(activeAppId));
    update(['headshot'], { ...cv.headshot, x: 0, y: 0, scale: 1 });
    const handle = syncDirHandleRef.current;
    if (handle && activeAppId) {
      deleteImageFile(handle, activeAppId)
        .then(() => writeJsonSync(handle))
        .catch(e => console.warn('sync image delete failed', e));
    }
  };

  const activeApp = apps.find(a => a.id === activeAppId) || null;

  // ── Sync lifecycle ─────────────────────────────────────────
  // On mount: if a handle is stored, try to reconnect and hydrate.
  React.useEffect(() => {
    if (!FSA_SUPPORTED) return;
    let cancelled = false;
    (async () => {
      const handle = await loadDirHandleStored();
      if (!handle || cancelled) return;
      setSyncDirName(handle.name);
      const perm = await queryDirPermission(handle);
      if (cancelled) return;
      if (perm === 'granted') {
        try {
          const data = await readDataFile(handle);
          if (data && Array.isArray(data.apps)) {
            await hydrateFromPayload(handle, data);
            if (cancelled) return;
            // Re-load state from updated storage
            const fresh = loadAppsMeta();
            setApps(fresh);
            const aid = loadActiveAppId();
            if (aid) {
              cvAppIdRef.current = null;
              skipNextSaveRef.current = true;
              setCv(deepMerge(SEED_CV, loadAppCv(aid) || {}));
              cvAppIdRef.current = aid;
              setActiveAppIdState(aid);
              const bytes = await idbGet(appHeadshotKeyV2(aid));
              if (!cancelled) setHeadshotSrc(bytes || null);
            }
          }
          if (!cancelled) {
            setSyncDirHandle(handle);
            setSyncState('bound');
          }
        } catch (e) {
          console.error('Hydrate from file failed', e);
          if (!cancelled) setSyncState('needs-reconnect');
        }
      } else {
        setSyncDirHandle(handle);
        setSyncState('needs-reconnect');
      }
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Debounced JSON write when state changes while bound.
  React.useEffect(() => {
    if (syncState !== 'bound' || !syncDirHandle) return;
    const t = setTimeout(async () => {
      try { await writeJsonSync(syncDirHandle); }
      catch (e) {
        console.warn('sync json write failed', e);
        if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
          setSyncState('needs-reconnect');
        }
      }
    }, 600);
    return () => clearTimeout(t);
  }, [apps, cv, syncState, syncDirHandle]);

  const onSetUpSync = async () => {
    if (!FSA_SUPPORTED) return;
    setSyncState('connecting');
    try {
      const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
      const existing = await readDataFile(handle);
      const hasExisting = !!(existing && Array.isArray(existing.apps) && existing.apps.length > 0);
      let useFile = false;
      if (hasExisting) {
        useFile = confirm(
          `"${handle.name}" already contains ${existing.apps.length} application(s).\n\n` +
          `OK → Load file data into the browser (replaces current browser data)\n` +
          `Cancel → Overwrite the file with current browser data`
        );
      }
      if (useFile) {
        await hydrateFromPayload(handle, existing);
        // Refresh React state from storage
        const fresh = loadAppsMeta();
        setApps(fresh);
        const aid = loadActiveAppId();
        if (aid) {
          cvAppIdRef.current = null;
          skipNextSaveRef.current = true;
          setCv(deepMerge(SEED_CV, loadAppCv(aid) || {}));
          cvAppIdRef.current = aid;
          setActiveAppIdState(aid);
          const bytes = await idbGet(appHeadshotKeyV2(aid));
          setHeadshotSrc(bytes || null);
        }
      } else {
        await writeFullSync(handle);
      }
      await persistDirHandle(handle);
      setSyncDirHandle(handle);
      setSyncDirName(handle.name);
      setSyncState('bound');
      dismissSyncBanner();
    } catch (e) {
      if (e && e.name === 'AbortError') {
        setSyncState(syncDirHandle ? 'needs-reconnect' : 'idle');
        return;
      }
      console.error('Set up sync failed', e);
      alert('Sync setup failed: ' + (e && e.message || String(e)));
      setSyncState('error');
    }
  };

  const onReconnectSync = async () => {
    if (!syncDirHandle) return;
    const perm = await requestDirPermission(syncDirHandle);
    if (perm === 'granted') {
      try {
        const data = await readDataFile(syncDirHandle);
        if (data) {
          await hydrateFromPayload(syncDirHandle, data);
          const fresh = loadAppsMeta();
          setApps(fresh);
          const aid = loadActiveAppId();
          if (aid) {
            cvAppIdRef.current = null;
            skipNextSaveRef.current = true;
            setCv(deepMerge(SEED_CV, loadAppCv(aid) || {}));
            cvAppIdRef.current = aid;
            setActiveAppIdState(aid);
            const bytes = await idbGet(appHeadshotKeyV2(aid));
            setHeadshotSrc(bytes || null);
          }
        }
        setSyncState('bound');
      } catch (e) {
        console.error('Reconnect hydrate failed', e);
        setSyncState('error');
      }
    }
  };

  const onUnbindSync = async () => {
    if (!confirm('Stop syncing this folder?\n\nYour data stays in the browser. The folder files remain untouched.')) return;
    await clearDirHandle();
    setSyncDirHandle(null);
    setSyncDirName('');
    setSyncState('idle');
  };

  const slug = (s) => (s || '').trim().replace(/\s+/g, '-').replace(/[^A-Za-z0-9\-]/g, '');
  const outputBase = () => {
    if (viewingSnapshot) {
      const namePart = slug((viewingSnapshot.cv && viewingSnapshot.cv.name) || cv.name) || 'Untitled';
      const docPart = viewingSnapshot.doc === 'letter' ? 'Cover-Letter' : 'CV';
      const labelPart = slug(viewingSnapshot.appLabel) || 'Application';
      return `${namePart}_${docPart}_${labelPart}`;
    }
    const namePart = slug(cv.name) || 'Untitled';
    const docPart = doc === 'letter' ? 'Cover-Letter' : 'CV';
    const labelPart = slug(appDisplayLabel(activeApp)) || 'Application';
    return `${namePart}_${docPart}_${labelPart}`;
  };

  React.useEffect(() => {
    document.title = outputBase();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [cv.name, doc, activeAppId, viewingSnapshot]);

  const onPrint = () => { window.print(); };

  // Program-level backup: dump all apps + their CV blobs + headshot bytes
  const onExport = async () => {
    const payload = {
      schemaVersion: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      apps: [],
    };
    for (const meta of apps) {
      const cvBlob = loadAppCv(meta.id);
      let headshot = null;
      try { headshot = await idbGet(appHeadshotKeyV2(meta.id)); } catch {}
      payload.apps.push({ meta, cv: cvBlob, headshot });
    }
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const namePart = slug(cv.name) || 'CV';
    a.href = url; a.download = `${namePart}_All-Applications_${new Date().toISOString().slice(0, 10)}.json`;
    // The anchor must be in the document and the object URL must outlive the
    // click, or Firefox silently drops the download.
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  };

  const onImport = async (text) => {
    try {
      const parsed = JSON.parse(text);
      // Two formats supported:
      //   New (v2): { schemaVersion: 2, apps: [{meta, cv, headshot}, ...] }
      //   Legacy: { cv: {...}, headshot: ..., applications: [...] } — single-profile dump
      if (parsed && parsed.schemaVersion === SCHEMA_VERSION && Array.isArray(parsed.apps)) {
        if (!confirm(`Restore ${parsed.apps.length} application(s)? Existing data will be replaced.`)) return;
        // Wipe current state
        for (const a of apps) {
          deleteAppCv(a.id);
          try { await idbDel(appHeadshotKeyV2(a.id)); } catch {}
        }
        // Apply new
        const newMetas = [];
        for (const entry of parsed.apps) {
          if (!entry || !entry.meta) continue;
          const meta = { ...entry.meta };
          if (entry.cv) saveAppCv(meta.id, entry.cv);
          if (entry.headshot) {
            try { await idbPut(appHeadshotKeyV2(meta.id), entry.headshot); } catch {}
          }
          newMetas.push(meta);
        }
        // Min-1-Base safety
        if (!newMetas.some(m => m.isBase) && newMetas.length) newMetas[0].isBase = true;
        setApps(newMetas);
        const nextActive = (newMetas.find(m => m.isBase) || newMetas[0])?.id || null;
        if (nextActive) {
          cvAppIdRef.current = null; // force reload
          setActiveAppId(nextActive);
        }
        return;
      }
      // Legacy single-CV import: overwrite the active app's CV
      const importedCv = (parsed && parsed.cv) || parsed;
      const merged = deepMerge(SEED_CV, importedCv);
      setCv(merged);
      if (parsed && parsed.headshot && activeAppId) {
        setHeadshotSrc(parsed.headshot);
        idbPut(appHeadshotKeyV2(activeAppId), parsed.headshot);
      }
    } catch (e) { alert('Import failed: ' + e.message); }
  };

  // Application lifecycle
  const onCreateApplication = async ({ company, position, forkFromId, templateId }) => {
    const src = apps.find(a => a.id === forkFromId);
    const srcCv = (src && loadAppCv(src.id)) || SEED_CV;
    let srcHeadshot = null;
    if (src) {
      try { srcHeadshot = await idbGet(appHeadshotKeyV2(src.id)); } catch {}
    }
    const id = genId();
    const meta = makeAppMeta({
      id, isBase: false,
      company: company || '',
      position: position || '',
      headshotKey: appHeadshotKeyV2(id),
    });
    const newCv = JSON.parse(JSON.stringify(srcCv));
    newCv.templateId = resolveTemplateId(templateId || (srcCv && srcCv.templateId));
    saveAppCv(id, newCv);
    if (srcHeadshot) {
      try { await idbPut(appHeadshotKeyV2(id), srcHeadshot); } catch {}
    }
    setApps(prev => [meta, ...prev]);
    cvAppIdRef.current = null;
    setActiveAppId(id);
    return id;
  };

  const onOpenApplication = (app, docKind) => {
    if (app && app.id && app.id !== activeAppId) setActiveAppId(app.id);
    setDoc(docKind === 'letter' ? 'letter' : 'cv');
  };

  const onPatchApp = (patched) => {
    setApps(prev => prev.map(a => a.id === patched.id ? { ...patched, updatedAt: new Date().toISOString() } : a));
  };

  const onPromoteToBase = (id) => {
    setApps(prev => prev.map(a => a.id === id ? { ...a, isBase: true, updatedAt: new Date().toISOString() } : a));
  };

  const onDemoteFromBase = (id) => {
    const bases = apps.filter(a => a.isBase);
    if (bases.length <= 1 && bases[0]?.id === id) {
      alert('At least one application must remain a Base.');
      return;
    }
    setApps(prev => prev.map(a => a.id === id ? { ...a, isBase: false, updatedAt: new Date().toISOString() } : a));
  };

  const onDuplicateApp = async (id) => {
    const src = apps.find(a => a.id === id);
    if (!src) return null;
    const srcCv = loadAppCv(src.id) || SEED_CV;
    let srcHeadshot = null;
    try { srcHeadshot = await idbGet(appHeadshotKeyV2(src.id)); } catch {}
    const newId = genId();
    const baseLabel = appDisplayLabel(src);
    const newCompany = src.company ? `${src.company} (copy)` : `${baseLabel} (copy)`;
    const meta = makeAppMeta({
      id: newId, isBase: false,
      company: newCompany,
      position: src.position || '',
      status: 'drafting',
      postingUrl: src.postingUrl || '',
      notes: src.notes || '',
      headshotKey: appHeadshotKeyV2(newId),
    });
    saveAppCv(newId, JSON.parse(JSON.stringify(srcCv)));
    if (srcHeadshot) {
      try { await idbPut(appHeadshotKeyV2(newId), srcHeadshot); } catch {}
    }
    setApps(prev => [meta, ...prev]);
    cvAppIdRef.current = null;
    setActiveAppId(newId);
    return newId;
  };

  const onDeleteApp = async (id) => {
    const target = apps.find(a => a.id === id);
    if (!target) return;
    if (target.isBase) {
      const baseCount = apps.filter(a => a.isBase).length;
      if (baseCount <= 1) {
        alert('Cannot delete the last Base application. Promote another application to Base first.');
        return;
      }
    }
    if (!confirm(`Delete "${appDisplayLabel(target)}"? This cannot be undone.`)) return;
    deleteAppCv(id);
    try { await idbDel(appHeadshotKeyV2(id)); } catch {}
    setApps(prev => prev.filter(a => a.id !== id));
    if (activeAppId === id) {
      const next = apps.find(a => a.id !== id && a.isBase) || apps.find(a => a.id !== id);
      if (next) {
        cvAppIdRef.current = null;
        setActiveAppId(next.id);
      }
    }
  };

  const noop = () => {};
  // Bridge between the headshot frame (inside the CV) and the inspector's
  // Headshot group. The slot is the group's body element, held as state so the
  // portal re-renders when the group mounts or unmounts; the tick counts frame
  // clicks so the inspector can open that group.
  const [hsSlot, setHsSlot] = React.useState(null);
  const [hsFocusTick, setHsFocusTick] = React.useState(0);
  const hsPanelCtx = React.useMemo(() => ({
    slot: hsSlot,
    focusHeadshot: () => setHsFocusTick(t => t + 1),
  }), [hsSlot]);

  let mainContent;
  if (viewingSnapshot) {
    const snapCv = viewingSnapshot.cv;
    if (viewingSnapshot.doc === 'letter') {
      mainContent = <CoverLetterDocument cv={snapCv} update={noop} />;
    } else {
      mainContent = (
        <CVDocument
          cv={snapCv} update={noop}
          headshotSrc={viewingSnapshot.headshotSrc}
          onHeadshotSrc={noop}
          onHeadshotTransform={noop}
          onHeadshotClear={noop}
        />
      );
    }
  } else if (doc === 'applications') {
    mainContent = (
      <ApplicationsDocument
        apps={apps} activeAppId={activeAppId}
        onView={onOpenApplication}
        onCreate={onCreateApplication}
        onPatch={onPatchApp}
        onPromote={onPromoteToBase}
        onDemote={onDemoteFromBase}
        onDuplicate={onDuplicateApp}
        onDelete={onDeleteApp}
        customStatuses={customStatuses}
        setCustomStatuses={setCustomStatuses}
        setStatusOrder={setStatusOrder}
        onStatusDeleted={(removedId) => {
          // Any app using the deleted status falls back to 'drafting'
          setApps(prev => prev.map(a => a.status === removedId ? { ...a, status: 'drafting', updatedAt: new Date().toISOString() } : a));
        }}
      />
    );
  } else if (doc === 'letter') {
    mainContent = <CoverLetterDocument cv={cv} update={update} />;
  } else {
    mainContent = (
      <CVDocument
        cv={cv} update={update}
        headshotSrc={headshotSrc}
        onHeadshotSrc={onHeadshotSrc}
        onHeadshotTransform={onHeadshotTransform}
        onHeadshotClear={onHeadshotClear}
      />
    );
  }

  return (
    <StatusesContext.Provider value={statusesContextValue}>
    <HeadshotPanelContext.Provider value={hsPanelCtx}>
      <Toolbar editOn={editOn} setEditOn={setEditOn}
        onPrint={onPrint} onExport={onExport} onImport={onImport}
        doc={doc} setDoc={setDoc}
        zoom={zoom} setZoom={(v) => setZoom(clampZoom(v))}
        syncState={syncState} syncDirName={syncDirName}
        onSetUpSync={onSetUpSync} onReconnectSync={onReconnectSync} onUnbindSync={onUnbindSync} />
      {syncState === 'idle' && !syncBannerDismissed && (
        <div className="sync-banner">
          <span>Your data lives in this browser only. Bind it to a folder to sync across devices.</span>
          <button className="primary" onClick={onSetUpSync}>Set up sync</button>
          <button onClick={dismissSyncBanner} title="Hide this banner">Dismiss</button>
        </div>
      )}
      {syncState === 'needs-reconnect' && (
        <div className="sync-banner warning">
          <span>Sync paused — reconnect to <strong>{syncDirName || 'your folder'}</strong> to resume.</span>
          <button className="primary" onClick={onReconnectSync}>Reconnect</button>
          <button onClick={onUnbindSync} title="Stop syncing">Unbind</button>
        </div>
      )}
      {viewingSnapshot && <SnapshotBanner snap={viewingSnapshot} onClose={() => setViewingSnapshot(null)} />}
      {/* --cv-zoom lets the stage divide out its own padding: CSS `zoom` scales
          padding along with everything else, which otherwise walks the document
          further from the toolbar the more you zoom in. */}
      <div className="cv-stage" data-zoom={zoom !== 1 ? '1' : undefined} data-doc={doc}
        style={zoom !== 1 ? { zoom, '--cv-zoom': zoom } : undefined}>
        {mainContent}
      </div>
      {doc === 'cv' && !viewingSnapshot && (
        <TweaksPanel editOn={editOn} cv={cv} update={update} headshotSrc={headshotSrc}
          templateId={resolveTemplateId(cv.templateId)}
          onTemplateChange={(id) => update(['templateId'], id)}
          hsFocusTick={hsFocusTick} onHsSlotRef={setHsSlot} />
      )}
    </HeadshotPanelContext.Provider>
    </StatusesContext.Provider>
  );
}

// Initialize global edit flag before first render so Ed sees it
window.__EDIT_ON = (localStorage.getItem('cv-edit-on') !== '0');

function MigrationGate() {
  const [ready, setReady] = React.useState(false);
  const [error, setError] = React.useState(null);
  React.useEffect(() => {
    runMigrationIfNeeded()
      .then(() => setReady(true))
      .catch(err => { setError(err); setReady(true); });
  }, []);
  if (error) {
    return (
      <div style={{ padding: 40, fontFamily: 'Inter Tight, sans-serif', maxWidth: 640, margin: '40px auto', color: '#1a1a1a' }}>
        <h2 style={{ color: '#a44d2c' }}>Schema migration failed</h2>
        <p>Your data is intact (backups exist under <code>cv-profiles-backup-*</code> and <code>cv-applications-backup-*</code> in localStorage).</p>
        <pre style={{ background: '#f5f3ee', padding: 12, borderRadius: 6, overflow: 'auto', fontSize: 11 }}>{(error && error.stack) || String(error)}</pre>
      </div>
    );
  }
  if (!ready) {
    return (
      <div style={{ position: 'fixed', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'Inter Tight, sans-serif', color: '#6b6b66', fontSize: 12, letterSpacing: 1.4, textTransform: 'uppercase' }}>
        Loading…
      </div>
    );
  }
  return <App />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<MigrationGate />);
</script>
</body>
</html>
