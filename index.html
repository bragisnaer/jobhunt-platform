function Toolbar({ editOn, setEditOn, onPrint, onExport, onImport,
                   doc, setDoc, zoom = 1, setZoom,
                   syncState = 'unsupported', syncDirName = '',
                   onSetUpSync, onReconnectSync, onUnbindSync,
                   }) {
  const fileRef = React.useRef(null);
  const docBtn = (id, label) => (
    <button onClick={() => setDoc(id)}
      className={doc === id ? 'primary' : ''}
      title={`View ${label}`}>{label}</button>
  );
  const stepZoom = (delta) => setZoom && setZoom(zoom + delta);
  const resetZoom = () => setZoom && setZoom(1);

  const syncPill = (() => {
    const cfg = {
      // Brave is Chromium but ships the File System Access API switched off, so
      // naming it as supported sent people hunting for a bug that was a flag.
      unsupported: { label: 'Local only', title: 'Folder sync needs the File System Access API — Chrome or Edge on desktop. Firefox and Safari have never shipped it; Brave has it behind brave://flags/#file-system-access-api. Back up / Restore works everywhere.', onClick: null, disabled: true },
      idle:        { label: 'Not synced', title: 'Click to bind this app to a folder for cross-device sync.', onClick: onSetUpSync, disabled: false },
      connecting:  { label: 'Connecting…', title: 'Setting up folder sync…', onClick: null, disabled: true },
      bound:       { label: syncDirName ? `Synced · ${syncDirName}` : 'Synced', title: 'Click to stop syncing (data stays in browser).', onClick: onUnbindSync, disabled: false },
      'needs-reconnect': { label: 'Sync paused', title: 'Permission expired. Click to reconnect.', onClick: onReconnectSync, disabled: false },
      error:       { label: 'Sync error', title: 'Something went wrong. Click to retry.', onClick: onSetUpSync, disabled: false },
    };
    const c = cfg[syncState] || cfg.unsupported;
    return (
      <button type="button"
        className={`sync-pill state-${syncState}`}
        title={c.title}
        disabled={c.disabled}
        onClick={c.onClick || undefined}>
        <span className="dot" />
        {c.label}
      </button>
    );
  })();
  return (
    <div className="toolbar">
      <div className="row row-1">
        <button type="button"
          className={`toggle ${editOn ? 'on' : ''}`}
          onClick={() => setEditOn(!editOn)}
          aria-pressed={editOn}
          title={editOn ? 'Editing on — click to lock' : 'Editing off — click to enable'}>
          <span className="dot" />
          Edit
        </button>
        <span className="sep" />
        {docBtn('applications', 'Applications')}
        {docBtn('cv', 'CV')}
        {docBtn('letter', 'Cover Letter')}
        <span className="sep" />
        <button className="primary" onClick={onPrint} title="Open the print dialog — choose “Save as PDF” to download">Save as PDF</button>
        <span className="sep" />
        <button onClick={onExport} title="Back up ALL applications and their CVs to a JSON file (use when moving between computers)">Back up</button>
        <label className="btn" title="Restore applications from a JSON backup file">
          Restore
          <input ref={fileRef} type="file" accept="application/json" style={{ display: 'none' }}
            onChange={(e) => {
              const f = e.target.files && e.target.files[0];
              if (!f) return;
              const r = new FileReader();
              r.onload = (ev) => onImport(ev.target.result);
              r.readAsText(f);
              e.target.value = '';
            }} />
        </label>
        <span className="sep" />
        {syncPill}
        <span className="sep" />
        <div className="zoom" title="Zoom the document preview (does not affect print)">
          <button type="button" onClick={() => stepZoom(-0.1)} disabled={zoom <= 0.25} aria-label="Zoom out">−</button>
          <button type="button" className="level" onClick={resetZoom} title="Reset to 100%">{Math.round(zoom * 100)}%</button>
          <button type="button" onClick={() => stepZoom(0.1)} disabled={zoom >= 2} aria-label="Zoom in">+</button>
        </div>
      </div>
    </div>
  );
}

function InspectorGroup({ id, title, note, open, onToggle, children }) {
  return (
    <div className={`acc ${open ? 'open' : ''}`} data-group={id}>
      <button type="button" className="acc-head" aria-expanded={open}
        onClick={() => onToggle(id)}>
        <span>{title}{note != null && <span className="acc-note">{note}</span>}</span>
        <span className="marker">▸</span>
      </button>
      {open && <div className="acc-body">{children}</div>}
    </div>
  );
}

function TweaksPanel({ editOn, cv, update, removePath, headshotSrc,
                      templateId, onTemplateChange, hsFocusTick = 0, onHsSlotRef }) {
  // Every hook precedes the visibility returns. The old version returned null
  // above its useState calls, so toggling Edit changed the hook count between
  // renders — a rules-of-hooks violation that happened not to bite yet.
  const [collapsed, setCollapsed] = React.useState(() => {
    try { return localStorage.getItem('cv-tweaks-collapsed') === '1'; } catch { return false; }
  });
  const toggleCollapsed = () => {
    setCollapsed(c => {
      const next = !c;
      try { localStorage.setItem('cv-tweaks-collapsed', next ? '1' : '0'); } catch {}
      return next;
    });
  };
  // The panel is position:fixed, so the drag works in viewport coords.
  const panelRef = React.useRef(null);
  const bodyRef = React.useRef(null);
  const { dragPos, setDragPos, onGrab } = usePanelDrag({ width: 280 });
  const onHeadDown = (e) => {
    // First grab: the panel is still gutter-anchored, so read where it actually is.
    const r = panelRef.current && panelRef.current.getBoundingClientRect();
    onGrab(e, dragPos || (r ? { left: r.left, top: r.top } : null));
  };
  // Which accordion groups are open. Colour scheme and Sections start open;
  // the rest reveal on demand.
  const [openGroups, setOpenGroups] = React.useState(() => {
    try {
      const v = JSON.parse(localStorage.getItem('cv-inspector-open'));
      if (v && typeof v === 'object') return v;
    } catch {}
    return { colours: true, sections: true };
  });
  const toggleGroup = (id) => setOpenGroups(o => {
    const next = { ...o, [id]: !o[id] };
    try { localStorage.setItem('cv-inspector-open', JSON.stringify(next)); } catch {}
    return next;
  });
  // Clicking the headshot frame on the page bumps hsFocusTick: unroll the
  // panel if minimised, open the Headshot group, and bring it into view.
  const lastTick = React.useRef(hsFocusTick);
  React.useEffect(() => {
    if (hsFocusTick === lastTick.current) return;
    lastTick.current = hsFocusTick;
    setCollapsed(false);
    setOpenGroups(o => (o.headshot ? o : { ...o, headshot: true }));
    // Wait a frame so the group (and the portal into it) has mounted.
    requestAnimationFrame(() => {
      const el = bodyRef.current && bodyRef.current.querySelector('[data-group=headshot]');
      if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
  }, [hsFocusTick]);

  if (!editOn) return null;
  if (collapsed) {
    return (
      <button type="button" className="panel-reopen tweaks-reopen"
        onClick={toggleCollapsed} title="Show properties">
        <span>Properties</span>
        <span className="chev">▸</span>
      </button>
    );
  }
  const sidebar = cv.sidebar || [];
  const theme = cv.theme || {};
  const order = ensureSectionOrder(cv);
  const sidebarMetaById = Object.fromEntries(sidebar.map(m => [m.id, m]));
  const setOrder = (next) => update(['sectionOrder'], next);
  const setVisible = (i, visible) =>
    setOrder(order.map((s, idx) => idx === i ? { ...s, visible } : s));
  const moveSection = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= order.length) return;
    const next = order.slice();
    [next[i], next[j]] = [next[j], next[i]];
    setOrder(next);
  };
  const setTitle = (i, title) => {
    const sec = order[i];
    if (isMainSectionId(sec.id)) {
      update(['sectionTitles', sec.id], title);
    } else {
      update(['sidebar'], sidebar.map(s => s.id === sec.id ? { ...s, title } : s));
    }
  };
  const duplicateSection = (i) => {
    const sec = order[i];
    if (isMainSectionId(sec.id)) return; // can't duplicate main sections
    const src = sidebarMetaById[sec.id];
    if (!src) return;
    const srcKind = src.kind || src.id;
    const srcDataKey = src.dataKey || srcKind;
    let n = 2;
    while (sidebar.some(s => s.id === `${src.id}_${n}`)) n++;
    const newId = `${src.id}_${n}`;
    let m = 2;
    while (cv[`${srcDataKey}_${m}`] !== undefined) m++;
    const newDataKey = `${srcDataKey}_${m}`;
    const srcData = cv[srcDataKey];
    const cloned = srcData == null
      ? (srcKind === 'additional' ? '' : [])
      : (typeof srcData === 'string' ? srcData : JSON.parse(JSON.stringify(srcData)));
    update([newDataKey], cloned);
    // Append to sidebar metadata (visibility lives in sectionOrder, but keep .visible:true for legacy)
    update(['sidebar'], [...sidebar, {
      id: newId, kind: srcKind, dataKey: newDataKey,
      title: `${src.title} (copy)`, visible: true,
    }]);
    // Insert into sectionOrder right after the source
    const nextOrder = order.slice();
    nextOrder.splice(i + 1, 0, { id: newId, visible: true });
    setOrder(nextOrder);
  };
  const deleteSection = (i) => {
    const sec = order[i];
    if (isMainSectionId(sec.id)) return;
    const meta = sidebarMetaById[sec.id];
    if (!meta || !meta.dataKey) return; // only allow deleting duplicates (those with explicit dataKey)
    // The prompt says "and everything in it" because that is now literally true:
    // the section's content is destroyed with it, not just hidden.
    if (!confirm(`Delete section "${sectionDisplayTitle(sec.id, cv)}" and everything in it?`)) return;
    const nextSidebar = sidebar.filter(s => s.id !== sec.id);
    setOrder(order.filter((_, idx) => idx !== i));
    update(['sidebar'], nextSidebar);
    // Reclaim the blob the section owned. This used to be written off as a
    // harmless orphan because no UI reads it, which is true on screen and false
    // over time: an orphan is copied verbatim into every JSON backup, every
    // folder-sync write and every application fork, so a user who duplicates and
    // deletes sections a few times carries dead copies of their old content
    // around forever with nothing to ever reclaim them. canReclaimDataKey is
    // what makes this safe to do — see it for the cases it refuses. The two seed
    // sections that carry a dataKey (techTools, residence) are a partial
    // exception: deleting them drops the key, but the deepMerge against SEED_CV
    // on the next load puts it back. That is bounded and invisible, and the
    // unbounded case this fixes is duplicates, whose `<key>_<n>` names SEED_CV
    // has no opinion about.
    if (canReclaimDataKey(meta.dataKey, nextSidebar)) removePath([meta.dataKey]);
  };
  const visibleSections = order.filter(s =>
    s.visible && (isMainSectionId(s.id) || sidebarMetaById[s.id])).length;
  const totalSections = order.filter(s =>
    isMainSectionId(s.id) || sidebarMetaById[s.id]).length;
  const currentTemplate = resolveTemplateId(templateId);
  const currentScheme = matchColorScheme(theme);

  return (
    <div className="tweaks-panel" ref={panelRef}
      style={dragPos ? { left: dragPos.left, top: dragPos.top, right: 'auto', bottom: 'auto' } : undefined}>
      <div className="tweaks-head" onPointerDown={onHeadDown} title="Drag to move this panel">
        <span>Properties</span>
        <span className="tweaks-head-actions">
          {dragPos && (
            <button type="button" onClick={() => setDragPos(null)}
              title="Snap back beside the document">⟲</button>
          )}
          <button type="button" onClick={toggleCollapsed} title="Hide properties">×</button>
        </span>
      </div>
      <div className="tweaks-body" ref={bodyRef}>

      <InspectorGroup id="template" title="Template"
        note={TEMPLATES[currentTemplate].label}
        open={!!openGroups.template} onToggle={toggleGroup}>
        {Object.entries(TEMPLATES).map(([id, t]) => (
          <button key={id} type="button"
            className={`tmpl-opt ${id === currentTemplate ? 'active' : ''}`}
            onClick={() => onTemplateChange && onTemplateChange(id)}>
            <TemplateWireframe templateId={id} size="sm" />
            <span className="name">{t.label}</span>
            {id === currentTemplate && <span className="check">✓</span>}
          </button>
        ))}
        <div style={{ fontSize: 10, opacity: 0.6, paddingTop: 2 }}>
          Switching templates doesn't change your data.
        </div>
      </InspectorGroup>

      <InspectorGroup id="colours" title="Colour scheme"
        note={currentScheme ? currentScheme.name : 'Custom'}
        open={!!openGroups.colours} onToggle={toggleGroup}>
        <div className="swatches">
          {COLOR_SCHEMES.map(s => (
            <div key={s.id} className={`swatch ${currentScheme && currentScheme.id === s.id ? 'active' : ''}`}
              title={s.name} onClick={() => update(['theme'], { ink: s.ink, side: s.side })}>
              <div className="ink" style={{ background: s.ink }} />
              <div className="side" style={{ background: s.side }} />
            </div>
          ))}
        </div>
        <div className="row" style={{ marginTop: 8 }}>
          <span style={{ width: 28, opacity: 0.7 }}>ink</span>
          <input type="text" value={theme.ink || ''} onChange={(e) => update(['theme'], { ...theme, ink: e.target.value })} />
        </div>
        <div className="row">
          <span style={{ width: 28, opacity: 0.7 }}>side</span>
          <input type="text" value={theme.side || ''} onChange={(e) => update(['theme'], { ...theme, side: e.target.value })} />
        </div>
      </InspectorGroup>

      <InspectorGroup id="headshot" title="Headshot"
        note={headshotSrc ? null : 'empty'}
        open={!!openGroups.headshot} onToggle={toggleGroup}>
        {/* HeadshotEditor portals its controls in here; state stays with the frame. */}
        <div ref={onHsSlotRef || undefined} />
      </InspectorGroup>

      <InspectorGroup id="sections" title="Sections"
        note={`${visibleSections}/${totalSections}`}
        open={!!openGroups.sections} onToggle={toggleGroup}>
        {order.map((s, i) => {
          const isMain = isMainSectionId(s.id);
          const meta = sidebarMetaById[s.id];
          const title = sectionDisplayTitle(s.id, cv);
          const exists = isMain || !!meta;
          if (!exists) return null;
          const canDelete = !isMain && meta && meta.dataKey;
          return (
            <div key={s.id} className="row" title={isMain ? 'Built-in section' : 'Custom / sidebar section'}>
              <input type="checkbox" checked={!!s.visible} onChange={(e) => setVisible(i, e.target.checked)} />
              <input type="text" value={title}
                onChange={(e) => setTitle(i, e.target.value)}
                disabled={!s.visible}
                style={isMain ? { fontWeight: 500 } : undefined} />
              <span className="reorder">
                <button onClick={() => moveSection(i, -1)} disabled={i === 0} title="Up">↑</button>
                <button onClick={() => moveSection(i, 1)} disabled={i === order.length - 1} title="Down">↓</button>
                {!isMain && <button onClick={() => duplicateSection(i)} title="Duplicate section (independent copy)">⧉</button>}
                {canDelete && (
                  <button onClick={() => deleteSection(i)} title="Delete this duplicate"
                    style={{ color: '#ff8a6b' }}>×</button>
                )}
              </span>
            </div>
          );
        })}
      </InspectorGroup>

      <InspectorGroup id="credit" title="Footer credit"
        note={cv.showCredit ? 'on' : 'off'}
        open={!!openGroups.credit} onToggle={toggleGroup}>
        <div className="row" title="A small grey line at the bottom of every CV page. Off by default.">
          <input type="checkbox" checked={!!cv.showCredit}
            onChange={(e) => update(['showCredit'], e.target.checked)} />
          <span style={{ fontSize: 11, lineHeight: 1.45, opacity: 0.85 }}>Show footer credit</span>
        </div>
        {!!cv.showCredit && (
          <>
            <div className="row">
              <input type="text" value={cv.creditText || ''}
                placeholder={CREDIT_TEXT_DEFAULT}
                onChange={(e) => update(['creditText'], e.target.value)} />
            </div>
            <div style={{ fontSize: 10, lineHeight: 1.45, opacity: 0.6, paddingTop: 2 }}>
              Write whatever you like, or leave blank for the suggested line.
              Anything that looks like a web address becomes a clickable link in the PDF.
            </div>
          </>
        )}
      </InspectorGroup>

      <InspectorGroup id="tips" title="Tips"
        open={!!openGroups.tips} onToggle={toggleGroup}>
        <div style={{ fontSize: 11, lineHeight: 1.5, opacity: 0.8 }}>
          Click any text to edit. Click the headshot to open its controls here.
          Drag the image to pan; scroll to zoom; the corner handle resizes the frame.
          This panel can be dragged by its title bar.
        </div>
      </InspectorGroup>

      </div>
    </div>
  );
}
