          <button type="button" className="add-link screen-only" onClick={() => update(['education'], [...cv.education, { degree: 'New degree', spec: '', school: '', location: '', dates: '', note: '' }])}>+ add education</button>
        )}
      </V1Section>
    );
  }
  if (id === 'honours') {
    return (
      <V1Section key="honours-main" title={titles.honours || 'Honours and Achievements'}
        onTitleChange={(v) => update(['sectionTitles', 'honours'], v)} ink={ink}>
        {(cv.honours || []).map((h, i) => (
          <HonourEntry key={i} h={h} i={i} cv={cv} update={update} ink={ink} editable={editable}
            style={{ marginBottom: i === (cv.honours || []).length - 1 ? 0 : 10 }} />
        ))}
        {editable && (
          <button type="button" className="add-link screen-only" onClick={() => update(['honours'], [...(cv.honours || []), { title: 'New honour', years: '', text: '' }])}>+ add honour</button>
        )}
      </V1Section>
    );
  }
  return null;
}

function V1MainP1({ cv, update, ink, ppmSplitIdx, omSplitIdx }) {
  const ppm = cv.experience[0] && cv.experience[0].roles[0];
  const om = cv.experience[0] && cv.experience[0].roles[1];
  const ppmAt = ppm ? ((ppmSplitIdx != null) ? ppmSplitIdx : ppm.bullets.length) : 0;
  const omAt = om ? ((omSplitIdx != null) ? omSplitIdx : om.bullets.length) : 0;
  const ppmFullyOnP1 = ppm ? ppmAt >= ppm.bullets.length : true;
  const titles = cv.sectionTitles || {};
  // Walk section order to render sections before Experience inline; after Experience goes to P2.
  const mainOrder = ensureSectionOrder(cv).filter(s => s.visible && isMainSectionId(s.id));
  const expIdxInOrder = mainOrder.findIndex(s => s.id === 'experience');
  const sectionsBeforeExp = expIdxInOrder >= 0 ? mainOrder.slice(0, expIdxInOrder) : mainOrder;
  const expVisible = expIdxInOrder >= 0;
  // If Experience is hidden, P1 renders ALL visible sections (P2 will be skipped).
  const sectionsToRender = expVisible ? sectionsBeforeExp : mainOrder;
  return (
    <div style={{ flex: 1, padding: '42px 44px 32px', fontFamily: V1_FONT, boxSizing: 'border-box' }}>
      <header style={{ marginBottom: 20 }}>
        <Ed tag="h1" value={cv.name} onChange={(v) => update(['name'], v)}
          style={{ fontFamily: V1_FONT, fontSize: 40, fontWeight: 600, letterSpacing: -1.3, margin: 0, lineHeight: 1, color: ink, textWrap: 'balance', display: 'block' }} />
        <Ed tag="div" value={cv.title} onChange={(v) => update(['title'], v)}
          style={{ fontSize: 12.5, color: V1_MUTED, marginTop: 8, letterSpacing: 0.1 }} />
      </header>
      {sectionsToRender.map(s => renderEditorialMainSection(s.id, cv, update, ink))}
      {expVisible && (
        <V1Section title={titles.experience || 'Work Experience'}
          onTitleChange={(v) => update(['sectionTitles', 'experience'], v)} ink={ink}>
          {cv.experience[0] && (
            <div className="company-block" style={{ position: 'relative' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 2, gap: 8 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: ink, letterSpacing: -0.2, flex: 1 }}>
                  <Ed value={cv.experience[0].company} onChange={(v) => update(['experience', 0, 'company'], v)} />
                  <span style={{ fontWeight: 400, color: V1_MUTED, fontSize: 10 }}> &nbsp;·&nbsp; <Ed value={cv.experience[0].companyNote} onChange={(v) => update(['experience', 0, 'companyNote'], v)} /></span>
                </div>
                <Ed value={cv.experience[0].dates} onChange={(v) => update(['experience', 0, 'dates'], v)} style={{ fontSize: 9, color: V1_MUTED, fontFamily: V1_MONO }} />
              </div>
              {ppm && ppmAt > 0 && (() => {
                const ppmHead = { ...ppm, bullets: ppm.bullets.slice(0, ppmAt) };
                return (
                  <V1Role role={ppmHead}
                    onRole={(nr) => update(['experience', 0, 'roles', 0], { ...ppm, title: nr.title, dates: nr.dates, location: nr.location, bullets: [...nr.bullets, ...ppm.bullets.slice(ppmAt)] })}
                    onDelete={() => deleteRoleFn(cv, update, 0, 0)}
                    last={!ppmFullyOnP1} ink={ink} flowRoleId="ppm" companyLocation={cv.experience[0].location} />
                );
              })()}
              {ppmFullyOnP1 && om && omAt > 0 && (() => {
                const omHead = { ...om, bullets: om.bullets.slice(0, omAt) };
                return (
                  <V1Role role={omHead}
                    onRole={(nr) => update(['experience', 0, 'roles', 1], { ...om, title: nr.title, dates: nr.dates, location: nr.location, bullets: [...nr.bullets, ...om.bullets.slice(omAt)] })}
                    onDelete={() => deleteRoleFn(cv, update, 0, 1)}
                    last ink={ink} flowRoleId="om" bulletAttr="data-om-bullet" companyLocation={cv.experience[0].location} />
                );
              })()}
            </div>
          )}
        </V1Section>
      )}
    </div>
  );
}

function V1MainP2({ cv, update, ink, ppmSplitIdx, omSplitIdx }) {
  const editable = !!window.__EDIT_ON;
  const titles = cv.sectionTitles || {};
  const exp = cv.experience || [];
  const co0 = exp[0];
  const ppm = co0 && co0.roles[0];
  const om = co0 && co0.roles[1];
  const ppmAt = ppm ? ((ppmSplitIdx != null) ? ppmSplitIdx : ppm.bullets.length) : 0;
  const omAt = om ? ((omSplitIdx != null) ? omSplitIdx : om.bullets.length) : 0;
  const ppmTail = ppm ? ppm.bullets.slice(ppmAt) : [];
  const omTail = om ? om.bullets.slice(omAt) : [];
  const showOmFull = ppmTail.length > 0;

  const addRole = (ci) => {
    const company = cv.experience[ci];
    update(['experience', ci, 'roles'], [...company.roles, { title: 'New role', dates: '', bullets: ['New bullet'] }]);
  };
  const deleteCompany = (ci) => {
    const exps = cv.experience.slice();
    exps.splice(ci, 1);
    update(['experience'], exps);
  };
  const addCompany = () => {
    update(['experience'], [...(cv.experience || []), { company: 'New company', companyNote: '', location: '', dates: '', roles: [{ title: 'New role', dates: '', bullets: ['New bullet'] }] }]);
  };
  const co0HasMoreOnP2 = co0 && (ppmTail.length > 0 || (om && (showOmFull || omTail.length > 0)) || co0.roles.length > 2);

  const mainOrder = ensureSectionOrder(cv).filter(s => s.visible && isMainSectionId(s.id));
  const expIdxInOrder = mainOrder.findIndex(s => s.id === 'experience');
  const expVisible = expIdxInOrder >= 0;
  const sectionsAfterExp = expIdxInOrder >= 0 ? mainOrder.slice(expIdxInOrder + 1) : [];

  return (
    <div style={{ flex: 1, padding: '42px 44px 48px', fontFamily: V1_FONT, boxSizing: 'border-box' }}>
      {expVisible && (
      <V1Section title={`${titles.experience || 'Work Experience'} (continued)`} ink={ink}>
        {co0 && co0HasMoreOnP2 && (
          <div className="company-block" style={{ marginBottom: 12, position: 'relative' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 2, gap: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: ink, letterSpacing: -0.2, flex: 1 }}>
                <Ed value={co0.company} onChange={(v) => update(['experience', 0, 'company'], v)} />
                <span style={{ fontWeight: 400, color: V1_MUTED, fontSize: 10 }}> &nbsp;·&nbsp; <Ed value={co0.companyNote} onChange={(v) => update(['experience', 0, 'companyNote'], v)} /> &nbsp;·&nbsp; continued</span>
              </div>
              <Ed value={co0.dates} onChange={(v) => update(['experience', 0, 'dates'], v)} style={{ fontSize: 9, color: V1_MUTED, fontFamily: V1_MONO }} />
            </div>
          </div>
        )}
        {ppmTail.length > 0 && (
          <div style={{ marginBottom: 14 }}>
            <V1Role role={ppmAt === 0 ? ppm : { ...ppm, title: ppm.title + ' (cont.)', bullets: ppmTail }}
              onRole={(nr) => update(['experience', 0, 'roles', 0], ppmAt === 0 ? nr : { ...ppm, title: nr.title.replace(/ \(cont\.\)$/, ''), dates: nr.dates, location: nr.location, bullets: [...ppm.bullets.slice(0, ppmAt), ...nr.bullets] })}
              onDelete={() => deleteRoleFn(cv, update, 0, 0)}
              ink={ink} companyLocation={co0.location} />
          </div>
        )}
        {showOmFull && om ? (
          <div style={{ marginBottom: 14 }}>
            <V1Role role={om} onRole={(nr) => update(['experience', 0, 'roles', 1], nr)}
              onDelete={() => deleteRoleFn(cv, update, 0, 1)}
              ink={ink} companyLocation={co0.location} />
          </div>
        ) : (om && omTail.length > 0 && (
          <div style={{ marginBottom: 14 }}>
            <V1Role role={{ ...om, title: om.title + ' (cont.)', bullets: omTail }}
              onRole={(nr) => update(['experience', 0, 'roles', 1], { ...om, title: nr.title.replace(/ \(cont\.\)$/, ''), dates: nr.dates, location: nr.location, bullets: [...om.bullets.slice(0, omAt), ...nr.bullets] })}
              onDelete={() => deleteRoleFn(cv, update, 0, 1)}
              ink={ink} companyLocation={co0.location} />
          </div>
        ))}
        {co0 && co0.roles.slice(2).map((role, idx) => (
          <div key={`co0-r${idx + 2}`} style={{ marginBottom: 14 }}>
            <V1Role role={role}
              onRole={(nr) => update(['experience', 0, 'roles', idx + 2], nr)}
              onDelete={() => deleteRoleFn(cv, update, 0, idx + 2)}
              last={idx === co0.roles.length - 3} ink={ink} companyLocation={co0.location} />
          </div>
        ))}
        {editable && co0 && (
          <button type="button" className="add-link screen-only" onClick={() => addRole(0)}>+ add role to {co0.company}</button>
        )}

        {exp.slice(1).map((co, ci) => {
          const realCi = ci + 1;
          return (
            <div key={`co${realCi}`} className="company-block" style={{ marginTop: 18, position: 'relative' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 2, gap: 8 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: ink, letterSpacing: -0.2, flex: 1 }}>
                  <Ed value={co.company} onChange={(v) => update(['experience', realCi, 'company'], v)} />
                  {(co.companyNote || editable) && (
                    <span style={{ fontWeight: 400, color: V1_MUTED, fontSize: 10 }}> &nbsp;·&nbsp; <Ed value={co.companyNote || ''} onChange={(v) => update(['experience', realCi, 'companyNote'], v)} /></span>
                  )}
                </div>
                <Ed value={co.dates} onChange={(v) => update(['experience', realCi, 'dates'], v)} style={{ fontSize: 9, color: V1_MUTED, fontFamily: V1_MONO }} />
                {editable && (
                  <button type="button" className="screen-only company-del"
                    onClick={() => { if (confirm(`Delete company "${co.company}" and all its roles?`)) deleteCompany(realCi); }}
                    title="Delete company"
                    style={DEL_BTN_STYLE}>×</button>
                )}
              </div>
              <div style={{ marginTop: 8 }}>
                {co.roles.map((role, ri) => (
                  <div key={ri} style={{ marginBottom: 14 }}>
                    <V1Role role={role}
                      onRole={(nr) => update(['experience', realCi, 'roles', ri], nr)}
                      onDelete={() => deleteRoleFn(cv, update, realCi, ri)}
                      last={ri === co.roles.length - 1} ink={ink} companyLocation={co.location} />
                  </div>
                ))}
              </div>
              {editable && (
                <button type="button" className="add-link screen-only" onClick={() => addRole(realCi)}>+ add role</button>
              )}
            </div>
          );
        })}

        {editable && (
          <div style={{ marginTop: 14 }}>
            <button type="button" className="add-link screen-only" onClick={addCompany}>+ add company</button>
          </div>
        )}
      </V1Section>
      )}
      {sectionsAfterExp.map(s => renderEditorialMainSection(s.id, cv, update, ink))}
    </div>
  );
}

// One-shot seed — used when sender.lines is empty. After first edit the
// returned shape gets persisted and this seed never runs again for that profile.
function seedSenderLines(cv) {
  const c = cv.contact || {};
  return [
    { id: 'name',     value: cv.name     || '' },
    { id: 'address',  value: c.location  || '' },
    { id: 'phone',    value: c.phone     || '' },
    { id: 'email',    value: c.email     || '' },
    { id: 'linkedin', value: c.linkedin  || '' },
  ];
}
function getSenderLines(cv) {
  const s = (cv.coverLetter && cv.coverLetter.sender) || {};
  if (Array.isArray(s.lines) && s.lines.length) return s.lines;
  return seedSenderLines(cv);
}
function todayFormatted() {
  return new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

const lineCtrlBtn = {
  width: 14, height: 14, padding: 0, fontSize: 10, lineHeight: 1,
  background: '#fff', color: '#666',
  border: '1px solid #d8d4cb', borderRadius: 2, cursor: 'pointer',
  fontFamily: V1_MONO, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
};

function CoverLetterDocument({ cv, update }) {
  const editable = !!window.__EDIT_ON;
  const ink = (cv.theme && cv.theme.ink) || '#1a2a3a';
  const side = (cv.theme && cv.theme.side) || '#f4efe6';
  const cl = cv.coverLetter || {};
  const recipient = cl.recipient || {};
  const setRecipient = (key, val) => update(['coverLetter', 'recipient', key], val);
  const setCl = (key, val) => update(['coverLetter', key], val);
  const dateValue = cl.date || todayFormatted();

  const lines = getSenderLines(cv);
  const setLines = (next) => update(['coverLetter', 'sender', 'lines'], next);
  const editLine = (i, value) => setLines(lines.map((l, idx) => idx === i ? { ...l, value } : l));
  const removeLine = (i) => setLines(lines.filter((_, idx) => idx !== i));
  const moveLine = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= lines.length) return;
    const next = lines.slice();
    [next[i], next[j]] = [next[j], next[i]];
    setLines(next);
  };
  const addLine = () => setLines([...lines, { id: `custom_${Date.now()}`, value: '' }]);

  const nameLine = lines.find(l => l.id === 'name');
  const signNameValue = cl.signName || (nameLine && nameLine.value) || '';

  const lineStyle = (id) => id === 'name'
    ? { fontFamily: V1_FONT, fontSize: 22, fontWeight: 600, letterSpacing: -0.4, color: ink, marginBottom: 6, lineHeight: 1.1 }
    : { color: V1_MUTED };

  return (
    <CVPage>
      <div style={{ display: 'flex', height: '100%' }}>
        <div style={{ width: 32, background: side, flexShrink: 0 }} aria-hidden />
        <div style={{
          flex: 1, padding: '60px 64px 56px', fontFamily: V1_FONT, color: V1_INK_SOFT,
          display: 'flex', flexDirection: 'column', boxSizing: 'border-box',
        }}>
          {/* Sender block — top right */}
          <div style={{ display: 'flex', justifyContent: 'flex-end' }} title="Sender lines — add/remove/reorder freely.">
            <div style={{ textAlign: 'right', fontSize: 10.5, lineHeight: 1.55, color: V1_INK_SOFT, minWidth: 200 }}>
              {lines.map((l, i) => (
                <div key={i} style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 4 }}>
                  {editable && (
                    <span className="screen-only" style={{ display: 'inline-flex', gap: 2, opacity: 0.6 }}>
                      <button onClick={() => moveLine(i, -1)} disabled={i === 0} title="Up"
                        style={lineCtrlBtn}>↑</button>
                      <button onClick={() => moveLine(i, 1)} disabled={i === lines.length - 1} title="Down"
                        style={lineCtrlBtn}>↓</button>
                      <button onClick={() => removeLine(i)} title="Remove line"
                        style={{ ...lineCtrlBtn, color: '#c96442' }}>×</button>
                    </span>
                  )}
                  {/* A sender line is deliberately a contact value, so any TLD
                      links — no strict prose rules here. */}
                  <Ed tag="div"
                    value={l.value}
                    onChange={(v) => editLine(i, v)}
                    linkify={l.id !== 'name'} strictLinks={false}
                    style={lineStyle(l.id)} />
                </div>
              ))}
              {editable && (
                <button type="button" className="add-link screen-only"
                  onClick={addLine}
                  style={{ marginTop: 4, background: 'transparent', border: 'none', fontSize: 9, color: '#999', cursor: 'pointer', padding: '2px 0' }}>
                  + add line
                </button>
              )}
            </div>
          </div>

          {/* Date — right-aligned, below sender */}
          <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 18 }}>
            <Ed tag="div"
              value={dateValue}
              onChange={(v) => setCl('date', v)}
              style={{ fontSize: 10.5, color: V1_MUTED, fontFamily: V1_MONO, letterSpacing: 0.2 }} />
          </div>

          {/* Recipient block */}
          <div style={{ marginTop: 36, fontSize: 10.5, lineHeight: 1.55 }}>
            <Ed tag="div" value={recipient.name || ''} onChange={(v) => setRecipient('name', v)}
              placeholder="Recipient name"
              style={{ fontWeight: 600, color: ink, fontSize: 11.5 }} />
            <Ed tag="div" value={recipient.title || ''} onChange={(v) => setRecipient('title', v)}
              placeholder="Recipient title"
              style={{ color: V1_INK_SOFT }} />
            <Ed tag="div" value={recipient.company || ''} onChange={(v) => setRecipient('company', v)}
              placeholder="Company name"
              style={{ color: V1_INK_SOFT }} />
            <Ed tag="div" value={recipient.address || ''} onChange={(v) => setRecipient('address', v)}
              placeholder="Company address"
              style={{ color: V1_MUTED }} />
          </div>

          {/* Subject */}
          <Ed tag="div"
            value={cl.subject || ''}
            onChange={(v) => setCl('subject', v)}
            placeholder="Subject — e.g. Application for [role] at [company]"
            style={{
              marginTop: 28, fontSize: 12, fontWeight: 600, color: ink,
              letterSpacing: -0.05, textTransform: 'none',
            }} />

          {/* Salutation */}
          <Ed tag="div"
            value={cl.salutation || ''}
            onChange={(v) => setCl('salutation', v)}
            style={{ marginTop: 22, fontSize: 11, color: V1_INK_SOFT }} />

          {/* Body */}
          <Ed tag="div"
            value={cl.body || ''}
            onChange={(v) => setCl('body', v)}
            multiline linkify
            style={{
              marginTop: 14, fontSize: 11, lineHeight: 1.65,
              color: V1_INK_SOFT, letterSpacing: -0.01,
              whiteSpace: 'pre-wrap', textWrap: 'pretty',
            }} />

          {/* Signoff */}
          <div style={{ marginTop: 14 }}>
            <Ed tag="div"
              value={cl.signoff || ''}
              onChange={(v) => setCl('signoff', v)}
              style={{ fontSize: 11, color: V1_INK_SOFT }} />
            <Ed tag="div"
              value={signNameValue}
              onChange={(v) => setCl('signName', v)}
              style={{ marginTop: 18, fontSize: 11, fontWeight: 600, color: ink }} />
          </div>
        </div>
      </div>
    </CVPage>
  );
}

// ════════════════════════════════════════════════════════════════
//  Document
// ════════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════════
//  CV template registry
//
//  Each template is a pure renderer: same `cv` blob in, different
//  layout out. Switching templates never mutates content.
//
//  Template component signature:
//    ({ cv, update, headshotSrc, onHeadshotSrc, onHeadshotTransform,
//       onHeadshotClear }) => JSX
//
//  Shared primitives every template can use:
//    - <CVPage>         A4 page shell with screen + print rules
//    - <PageBreakMarker> screen-only "page break" indicator
//    - <HeadshotEditor>  headshot upload/crop with editor panel
//    - <V1Section>       section header + content (Editorial-flavored)
//    - <Ed>              inline-editable primitive
//    - A4_W / A4_H       canonical A4 dimensions in CSS px
//
//  Theme tokens come from cv.theme.ink and cv.theme.side. Templates
//  can interpret these however they want; e.g. Linear uses `side` as
//  an accent color for dividers since it has no sidebar.
// ════════════════════════════════════════════════════════════════
const TEMPLATES = {
  'editorial':        { label: 'Editorial' },
  'editorial-mirror': { label: 'Editorial Mirror' },
  'linear':           { label: 'Linear' },
};
const DEFAULT_TEMPLATE_ID = 'editorial';
function resolveTemplateId(id) {
  return TEMPLATES[id] ? id : DEFAULT_TEMPLATE_ID;
}

function EditorialTemplate({ cv, update, headshotSrc, onHeadshotSrc, onHeadshotTransform, onHeadshotClear, mirror = false }) {
  const ink = (cv.theme && cv.theme.ink) || '#1a2a3a';
  const side = (cv.theme && cv.theme.side) || '#f4efe6';

  const AVAIL_P1 = 700;
  const measureRefs = React.useRef({});
  const visibleIds = visibleSidebarSections(cv).map(m => m.id);
  const splitIdx = useSidebarSplit(visibleIds, AVAIL_P1, measureRefs);

  const ppm = cv.experience[0] && cv.experience[0].roles[0];
  const om = cv.experience[0] && cv.experience[0].roles[1];
  const measureMainRef = React.useRef(null);
  const [ppmSplitIdx, setPpmSplitIdx] = React.useState(ppm ? ppm.bullets.length : 0);
  const [omSplitIdx, setOmSplitIdx] = React.useState(om ? om.bullets.length : 0);

  React.useLayoutEffect(() => {
    const root = measureMainRef.current;
    if (!root || !ppm) return;
    const PAGE_H = A4_H, BOTTOM_PAD = 32;
    const limit = PAGE_H - BOTTOM_PAD;
    const rootTop = root.getBoundingClientRect().top;
    // The measure copy lives inside .cv-stage, which is scaled with CSS
    // `zoom`, and getBoundingClientRect returns zoom-scaled coordinates while
    // `limit` is in unscaled A4 pixels. Unzoomed the factor is 1; at 150% the
    // raw compare pushed fitting bullets onto page 2, at 50% page 1 clipped.
    const stage = root.closest('.cv-stage');
    const zoomFactor = (stage && parseFloat(stage.style.zoom)) || 1;
    const bottomOf = (el) => (el.getBoundingClientRect().bottom - rootTop) / zoomFactor;
    const ppmLis = root.querySelectorAll('li[data-flow-role="ppm"]');
    const omLis = root.querySelectorAll('li[data-flow-role="om"]');
    let ppmFit = ppm.bullets.length, omFit = om ? om.bullets.length : 0, overflowed = false;
    for (let i = 0; i < ppmLis.length; i++) {
      if (bottomOf(ppmLis[i]) > limit) { ppmFit = i; overflowed = true; break; }
    }
    if (overflowed) { omFit = 0; }
    else if (om) {
      for (let i = 0; i < omLis.length; i++) {
        if (bottomOf(omLis[i]) > limit) { omFit = i; break; }
      }
    }
    if (ppmFit !== ppmSplitIdx) setPpmSplitIdx(ppmFit);
    if (omFit !== omSplitIdx) setOmSplitIdx(omFit);
  });

  const flexDir = mirror ? 'row-reverse' : 'row';
  // CSS variables exposed so future template-specific CSS can use var(--cv-ink) etc.
  const pageStyle = { '--cv-ink': ink, '--cv-side': side };
  // Inset past the 240px sidebar band so the credit sits under the main column.
  const credit = mirror ? creditFor(cv, 0, 240) : creditFor(cv, 240, 0);

  return (
    <>
      <div className="screen-only">
        <MeasurementSidebar cv={cv} update={update} measureRefs={measureRefs} ink={ink} side={side} />
        <div aria-hidden style={{ position: 'absolute', left: -9999, top: 0, width: A4_W - 240, visibility: 'hidden', pointerEvents: 'none' }} ref={measureMainRef}>
          <V1MainP1 cv={cv} update={() => {}} ink={ink} ppmSplitIdx={ppm ? ppm.bullets.length : 0} omSplitIdx={om ? om.bullets.length : 0} />
        </div>
      </div>
      <CVPage style={pageStyle} credit={credit}>
        <div style={{ display: 'flex', flexDirection: flexDir, height: '100%' }}>
          <V1Sidebar cv={cv} update={update} page={1} splitIdx={splitIdx} ink={ink} side={side}
            headshotSrc={headshotSrc} onHeadshotSrc={onHeadshotSrc}
            onHeadshotTransform={onHeadshotTransform} onHeadshotClear={onHeadshotClear} />
          <V1MainP1 cv={cv} update={update} ink={ink} ppmSplitIdx={ppmSplitIdx} omSplitIdx={omSplitIdx} />
        </div>
      </CVPage>
      <PageBreakMarker index={0} />
      <CVPage style={pageStyle} credit={credit}>
        <div style={{ display: 'flex', flexDirection: flexDir, height: '100%' }}>
          <V1Sidebar cv={cv} update={update} page={2} splitIdx={splitIdx} ink={ink} side={side} />
          <V1MainP2 cv={cv} update={update} ink={ink} ppmSplitIdx={ppmSplitIdx} omSplitIdx={omSplitIdx} />
        </div>
      </CVPage>
    </>
  );
}

function EditorialMirrorTemplate(props) {
  return <EditorialTemplate {...props} mirror />;
}

const LINEAR_PADDING_TOP = 48;
const LINEAR_PADDING_BOTTOM = 36;
const LINEAR_PADDING_X = 56;
const LINEAR_BODY_H = A4_H - LINEAR_PADDING_TOP - LINEAR_PADDING_BOTTOM;
const LINEAR_SECTION_HEADING_H = 30;
const LINEAR_SUBSECTION_HEADER_H = 26;
const LINEAR_ATOM_GAP = 16;

function LinearSectionHeader({ title, ink, onTitleChange, continuation = false }) {
  return (
    <h3 style={{
      fontFamily: V1_FONT, fontSize: 8.5, fontWeight: 600,
      letterSpacing: 1.8, textTransform: 'uppercase',
      color: ink, margin: 0, paddingBottom: 5,
      borderBottom: `1px solid ${V1_RULE}`, marginBottom: 9,
    }}>
      {onTitleChange && !continuation
        ? <Ed value={title} onChange={onTitleChange} />
        : (continuation ? `${title} (continued)` : title)}
    </h3>
  );
}

function LinearTemplate({ cv, update, headshotSrc, onHeadshotSrc, onHeadshotTransform, onHeadshotClear }) {
  const ink = (cv.theme && cv.theme.ink) || '#1a2a3a';
  const side = (cv.theme && cv.theme.side) || '#f4efe6';
  const titles = cv.sectionTitles || {};
  const editable = !!window.__EDIT_ON;
  const pageStyle = { '--cv-ink': ink, '--cv-side': side };
  const credit = creditFor(cv, LINEAR_PADDING_X, LINEAR_PADDING_X);

  const addRole = (ci) => {
    const co = cv.experience[ci];
    update(['experience', ci, 'roles'], [...co.roles, { title: 'New role', dates: '', bullets: ['New bullet'] }]);
  };
  const deleteCompany = (ci) => {
    const exps = cv.experience.slice();
    exps.splice(ci, 1);
    update(['experience'], exps);
  };
  const addCompany = () => {
    update(['experience'], [...(cv.experience || []), { company: 'New company', companyNote: '', location: '', dates: '', roles: [{ title: 'New role', dates: '', bullets: ['New bullet'] }] }]);
  };

  // ── Atom factories ───────────────────────────────────────────
  const renderHeader = () => (
    <>
      <header style={{ display: 'flex', alignItems: 'flex-start', gap: 28, marginBottom: 20 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <Ed tag="h1" value={cv.name} onChange={(v) => update(['name'], v)}
            style={{ fontFamily: V1_FONT, fontSize: 42, fontWeight: 700, letterSpacing: -1.4, margin: 0, lineHeight: 1.02, color: ink, textWrap: 'balance', display: 'block' }} />
          <Ed tag="div" value={cv.title} onChange={(v) => update(['title'], v)}
            style={{ fontSize: 13, color: V1_MUTED, marginTop: 8, letterSpacing: 0.1, display: 'block', fontWeight: 400 }} />
          <div style={{ marginTop: 14, fontSize: 10.5, lineHeight: 1.5, color: V1_INK_SOFT, display: 'flex', flexWrap: 'wrap', gap: '2px 16px' }}>
            {cv.contact.email && (
              <ContactRow href={`mailto:${cv.contact.email}`} value={cv.contact.email} onChange={(v) => update(['contact', 'email'], v)} />
            )}
            {cv.contact.phone && (
              <ContactRow href={`tel:${(cv.contact.phone || '').replace(/\s+/g, '')}`} value={cv.contact.phone} onChange={(v) => update(['contact', 'phone'], v)} />
            )}
            {cv.contact.linkedin && (
              <ContactRow href={`https://${(cv.contact.linkedin || '').replace(/^https?:\/\//, '')}`} value={cv.contact.linkedin} onChange={(v) => update(['contact', 'linkedin'], v)} external />
            )}
            {cv.contact.location && <Ed value={cv.contact.location} onChange={(v) => update(['contact', 'location'], v)} style={{ color: V1_MUTED }} />}
            {cv.contact.relocation && <Ed value={cv.contact.relocation} onChange={(v) => update(['contact', 'relocation'], v)} style={{ color: V1_MUTED, fontStyle: 'italic' }} />}
          </div>
        </div>
        <div style={{ flexShrink: 0 }}>
          <HeadshotEditor
            src={headshotSrc}
            transform={cv.headshot}
            onSrcChange={onHeadshotSrc}
            onTransformChange={onHeadshotTransform}
            onClear={onHeadshotClear}
          />
        </div>
      </header>
      <div style={{ height: 1, background: side, marginBottom: 18 }} />
    </>
  );

  const renderProfileBody = () => (
    <Ed tag="p" value={cv.summary} onChange={(v) => update(['summary'], v)} multiline
      style={{ margin: 0, fontSize: 10.75, lineHeight: 1.6, color: V1_INK_SOFT, textWrap: 'pretty', letterSpacing: -0.02, display: 'block', whiteSpace: 'pre-wrap' }} />
  );

  const renderCompanyHeader = (co, ci, continuation = false) => (
    <div className="company-block" style={{ position: 'relative', marginBottom: 6 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 2, gap: 8 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: ink, letterSpacing: -0.2, flex: 1 }}>
          <Ed value={co.company} onChange={(v) => update(['experience', ci, 'company'], v)} />
          {(co.companyNote || editable) && (
            <span style={{ fontWeight: 400, color: V1_MUTED, fontSize: 10 }}> &nbsp;·&nbsp; <Ed value={co.companyNote || ''} onChange={(v) => update(['experience', ci, 'companyNote'], v)} /></span>
          )}
          {continuation && <span style={{ fontWeight: 400, color: V1_MUTED, fontSize: 10, fontStyle: 'italic' }}> &nbsp;(continued)</span>}
        </div>
        <Ed value={co.dates} onChange={(v) => update(['experience', ci, 'dates'], v)} style={{ fontSize: 9, color: V1_MUTED, fontFamily: V1_MONO }} />
        {editable && ci > 0 && !continuation && (
          <button type="button" className="screen-only company-del"
            onClick={() => { if (confirm(`Delete company "${co.company}" and all its roles?`)) deleteCompany(ci); }}
            title="Delete company"
            style={DEL_BTN_STYLE}>×</button>
        )}
      </div>
    </div>
  );

  const renderEducationEntry = (e, i) => (
    <EducationEntry e={e} i={i} cv={cv} update={update} ink={ink} editable={editable} />
  );
  const renderHonourEntry = (h, i) => (
    <HonourEntry h={h} i={i} cv={cv} update={update} ink={ink} editable={editable} />
  );

  // Build atoms list, driven by cv.sectionOrder. Each visible section dispatches
  // to a builder for its kind. Header always first; metrics follow profile.
  const atoms = [];
  atoms.push({ key: 'header', section: null, render: renderHeader });
  const order = ensureSectionOrder(cv);
  const sidebarMetaById = Object.fromEntries((cv.sidebar || []).map(m => [m.id, m]));
  for (const sec of order) {
    if (!sec.visible) continue;
    const id = sec.id;
    if (id === 'profile') {
      atoms.push({ key: 'profile', section: 'profile', sectionTitle: titles.profile || 'Profile', onTitleChange: (v) => update(['sectionTitles', 'profile'], v), render: renderProfileBody });
      if (cv.metrics && cv.metrics.length) {
        atoms.push({ key: 'metrics', section: null, render: () => <V1MetricRail metrics={cv.metrics} update={update} ink={ink} /> });
      }
    } else if (id === 'experience') {
      (cv.experience || []).forEach((co, ci) => {
        const subKey = `exp-co-${ci}`;
        const subRender = (cont) => renderCompanyHeader(co, ci, cont);
        (co.roles || []).forEach((role, ri) => {
          atoms.push({
            key: `${subKey}-role-${ri}`,
            section: 'experience',
            sectionTitle: titles.experience || 'Work Experience',
            onTitleChange: (v) => update(['sectionTitles', 'experience'], v),
            subsection: subKey,
            subsectionRender: subRender,
            render: () => (
              <div style={{ marginBottom: 8 }}>
                <V1Role role={role}
                  onRole={(nr) => update(['experience', ci, 'roles', ri], nr)}
                  onDelete={() => deleteRoleFn(cv, update, ci, ri)}
                  last={ri === co.roles.length - 1} ink={ink} companyLocation={co.location} />
              </div>
            ),
          });
        });
        if (editable) {
          atoms.push({
            key: `${subKey}-add-role`,
            section: 'experience',
            sectionTitle: titles.experience || 'Work Experience',
            subsection: subKey,
            subsectionRender: subRender,
            render: () => <button type="button" className="add-link screen-only" onClick={() => addRole(ci)}>+ add role</button>,
          });
        }
      });
      if (editable) {
        atoms.push({
          key: 'exp-add', section: 'experience',
          sectionTitle: titles.experience || 'Work Experience',
          render: () => <button type="button" className="add-link screen-only" onClick={addCompany}>+ add company</button>,
        });
      }
    } else if (id === 'education') {
      (cv.education || []).forEach((e, i) => {
        atoms.push({
          key: `edu-${i}`, section: 'education',
          sectionTitle: titles.education || 'Education',
          onTitleChange: (v) => update(['sectionTitles', 'education'], v),
          render: () => renderEducationEntry(e, i),
        });
      });
      if (editable) {
        atoms.push({
          key: 'edu-add', section: 'education',
          sectionTitle: titles.education || 'Education',
          render: () => <button type="button" className="add-link screen-only" onClick={() => update(['education'], [...cv.education, { degree: 'New degree', spec: '', school: '', location: '', dates: '', note: '' }])}>+ add education</button>,
        });
      }
    } else if (id === 'honours') {
      (cv.honours || []).forEach((h, i) => {
        atoms.push({
          key: `hon-${i}`, section: 'honours',
          sectionTitle: titles.honours || 'Honours and Achievements',
          onTitleChange: (v) => update(['sectionTitles', 'honours'], v),
          render: () => renderHonourEntry(h, i),
        });
      });
      if (editable) {
        atoms.push({
          key: 'hon-add', section: 'honours',
          sectionTitle: titles.honours || 'Honours and Achievements',
          render: () => <button type="button" className="add-link screen-only" onClick={() => update(['honours'], [...(cv.honours || []), { title: 'New honour', years: '', text: '' }])}>+ add honour</button>,
        });
      }
    } else {
      // Sidebar item — render via existing sidebar renderer (self-contained section block).
      const meta = sidebarMetaById[id];
      if (meta) {
        atoms.push({
          key: `side-${id}`, section: null,
          render: () => renderSidebarSection(meta, cv, update, ink),
        });
      }
    }
  }

  // ── Measure & paginate ──────────────────────────────────────
  const measureRefs = React.useRef({});
  const [pages, setPages] = React.useState(() => [atoms.map(a => a.key)]);

  React.useLayoutEffect(() => {
    const heights = {};
    for (const a of atoms) {
      const el = measureRefs.current[a.key];
      heights[a.key] = el ? el.offsetHeight : 0;
    }
    const groups = [[]];
    let usedH = 0;
    let curSections = new Set();
    let curSubsections = new Set();
    for (const a of atoms) {
      const h = heights[a.key] || 0;
      const needsHeading = a.section && !curSections.has(a.section);
      const needsSub = a.subsection && !curSubsections.has(a.subsection);
      const extraH = (needsHeading ? LINEAR_SECTION_HEADING_H : 0)
                   + (needsSub ? LINEAR_SUBSECTION_HEADER_H : 0);
      const total = h + extraH + LINEAR_ATOM_GAP;
      const last = groups[groups.length - 1];
      if (last.length > 0 && usedH + total > LINEAR_BODY_H) {
        groups.push([]);
        usedH = 0;
        curSections = new Set();
        curSubsections = new Set();
      }
      const target = groups[groups.length - 1];
      target.push(a.key);
      const headExtra = (a.section && !curSections.has(a.section)) ? LINEAR_SECTION_HEADING_H : 0;
      const subExtra = (a.subsection && !curSubsections.has(a.subsection)) ? LINEAR_SUBSECTION_HEADER_H : 0;
      usedH += h + headExtra + subExtra + LINEAR_ATOM_GAP;
      if (a.section) curSections.add(a.section);
      if (a.subsection) curSubsections.add(a.subsection);
    }
    const flat = (g) => g.map(p => p.join('|')).join('||');
    if (flat(groups) !== flat(pages)) setPages(groups);
  });

  // Which page each section / subsection first appears on (for "(continued)" markers)
  const firstPageOf = {};
  const firstPageOfSub = {};
  pages.forEach((pageKeys, pi) => {
    for (const k of pageKeys) {
      const a = atoms.find(x => x.key === k);
      if (a && a.section && !(a.section in firstPageOf)) firstPageOf[a.section] = pi;
      if (a && a.subsection && !(a.subsection in firstPageOfSub)) firstPageOfSub[a.subsection] = pi;
    }
  });

  return (
    <>
      {/* Hidden measurement copy — same width and font as visible page body */}
      <div className="screen-only" aria-hidden style={{
        position: 'absolute', left: -9999, top: 0,
        width: A4_W - LINEAR_PADDING_X * 2,
        visibility: 'hidden', pointerEvents: 'none',
        fontFamily: V1_FONT, color: V1_INK_SOFT,
      }}>
        {atoms.map(a => (
          <div key={a.key} ref={el => { measureRefs.current[a.key] = el; }} style={{ marginBottom: LINEAR_ATOM_GAP }}>
            {a.render()}
          </div>
        ))}
      </div>

      {pages.map((pageKeys, pi) => {
        const shownSections = new Set();
        const shownSubsections = new Set();
        return (
          <React.Fragment key={pi}>
            {pi > 0 && <PageBreakMarker index={pi - 1} />}
            <CVPage style={pageStyle} credit={credit}>
              <div style={{
                padding: `${LINEAR_PADDING_TOP}px ${LINEAR_PADDING_X}px ${LINEAR_PADDING_BOTTOM}px`,
                height: '100%', boxSizing: 'border-box',
                fontFamily: V1_FONT, color: V1_INK_SOFT, overflow: 'hidden',
              }}>
                {pageKeys.map(key => {
                  const a = atoms.find(x => x.key === key);
                  if (!a) return null;
                  let sectionHeading = null;
                  let subHeading = null;
                  if (a.section && !shownSections.has(a.section)) {
                    shownSections.add(a.section);
                    const cont = pi > (firstPageOf[a.section] ?? pi);
                    sectionHeading = (
                      <LinearSectionHeader
                        title={a.sectionTitle}
                        ink={ink}
                        onTitleChange={cont ? null : a.onTitleChange}
                        continuation={cont}
                      />
                    );
                  }
                  if (a.subsection && !shownSubsections.has(a.subsection) && a.subsectionRender) {
                    shownSubsections.add(a.subsection);
                    const subCont = pi > (firstPageOfSub[a.subsection] ?? pi);
                    subHeading = a.subsectionRender(subCont);
                  }
                  return (
                    <div key={key} style={{ marginBottom: LINEAR_ATOM_GAP }}>
                      {sectionHeading}
                      {subHeading}
                      {a.render()}
                    </div>
                  );
                })}
              </div>
            </CVPage>
          </React.Fragment>
        );
      })}
    </>
  );
}

function Toolbar({ editOn, setEditOn, onPrint, onExport, onImport,
                   doc, setDoc, zoom = 1, setZoom,
                   syncState = 'unsupported', syncDirName = '',
                   onSetUpSync, onReconnectSync, onUnbindSync,
                   }) {
  const fileRef = React.useRef(null);
  const docBtn = (id, label) => (
    <button onClick={() => setDoc(id)}
      className={doc === id ? 'primary' : ''}
      title={`View ${label}`}>{label}</button>
  );
  const stepZoom = (delta) => setZoom && setZoom(zoom + delta);
  const resetZoom = () => setZoom && setZoom(1);

  const syncPill = (() => {
    const cfg = {
      unsupported: { label: 'Local only', title: 'Folder sync needs a Chromium browser (Chrome, Edge, Brave, Opera).', onClick: null, disabled: true },
      idle:        { label: 'Not synced', title: 'Click to bind this app to a folder for cross-device sync.', onClick: onSetUpSync, disabled: false },
      connecting:  { label: 'Connecting…', title: 'Setting up folder sync…', onClick: null, disabled: true },
      bound:       { label: syncDirName ? `Synced · ${syncDirName}` : 'Synced', title: 'Click to stop syncing (data stays in browser).', onClick: onUnbindSync, disabled: false },
      'needs-reconnect': { label: 'Sync paused', title: 'Permission expired. Click to reconnect.', onClick: onReconnectSync, disabled: false },
      error:       { label: 'Sync error', title: 'Something went wrong. Click to retry.', onClick: onSetUpSync, disabled: false },
    };
    const c = cfg[syncState] || cfg.unsupported;
    return (
      <button type="button"
        className={`sync-pill state-${syncState}`}
        title={c.title}
        disabled={c.disabled}
        onClick={c.onClick || undefined}>
        <span className="dot" />
        {c.label}
      </button>
    );
  })();
  return (
    <div className="toolbar">
      <div className="row row-1">
        <button type="button"
          className={`toggle ${editOn ? 'on' : ''}`}
          onClick={() => setEditOn(!editOn)}
          aria-pressed={editOn}
          title={editOn ? 'Editing on — click to lock' : 'Editing off — click to enable'}>
          <span className="dot" />
          Edit
        </button>
        <span className="sep" />
        {docBtn('applications', 'Applications')}
        {docBtn('cv', 'CV')}
        {docBtn('letter', 'Cover Letter')}
        <span className="sep" />
        <button className="primary" onClick={onPrint} title="Open the print dialog — choose “Save as PDF” to download">Save as PDF</button>
        <span className="sep" />
        <button onClick={onExport} title="Back up ALL applications and their CVs to a JSON file (use when moving between computers)">Back up</button>
        <label className="btn" title="Restore applications from a JSON backup file">
          Restore
          <input ref={fileRef} type="file" accept="application/json" style={{ display: 'none' }}
            onChange={(e) => {
              const f = e.target.files && e.target.files[0];
              if (!f) return;
              const r = new FileReader();
              r.onload = (ev) => onImport(ev.target.result);
              r.readAsText(f);
              e.target.value = '';
            }} />
        </label>
        <span className="sep" />
        {syncPill}
        <span className="sep" />
        <div className="zoom" title="Zoom the document preview (does not affect print)">
          <button type="button" onClick={() => stepZoom(-0.1)} disabled={zoom <= 0.25} aria-label="Zoom out">−</button>
          <button type="button" className="level" onClick={resetZoom} title="Reset to 100%">{Math.round(zoom * 100)}%</button>
          <button type="button" onClick={() => stepZoom(0.1)} disabled={zoom >= 2} aria-label="Zoom in">+</button>
        </div>
      </div>
    </div>
  );
}

function TweaksPanel({ editOn, cv, update, headshotSrc,
                      templateId, onTemplateChange, hsFocusTick = 0, onHsSlotRef }) {
  // Every hook precedes the visibility returns. The old version returned null
  // above its useState calls, so toggling Edit changed the hook count between
  // renders — a rules-of-hooks violation that happened not to bite yet.
  const [collapsed, setCollapsed] = React.useState(() => {
    try { return localStorage.getItem('cv-tweaks-collapsed') === '1'; } catch { return false; }
  });
  const toggleCollapsed = () => {
    setCollapsed(c => {
      const next = !c;
      try { localStorage.setItem('cv-tweaks-collapsed', next ? '1' : '0'); } catch {}
      return next;
    });
  };
  // The panel is position:fixed, so the drag works in viewport coords.
  const panelRef = React.useRef(null);
  const bodyRef = React.useRef(null);
  const { dragPos, setDragPos, onGrab } = usePanelDrag({ width: 280 });
  const onHeadDown = (e) => {
    // First grab: the panel is still gutter-anchored, so read where it actually is.
    const r = panelRef.current && panelRef.current.getBoundingClientRect();
    onGrab(e, dragPos || (r ? { left: r.left, top: r.top } : null));
  };
  // Which accordion groups are open. Colour scheme and Sections start open;
  // the rest reveal on demand.
  const [openGroups, setOpenGroups] = React.useState(() => {
    try {
      const v = JSON.parse(localStorage.getItem('cv-inspector-open'));
      if (v && typeof v === 'object') return v;
    } catch {}
    return { colours: true, sections: true };
  });
  const toggleGroup = (id) => setOpenGroups(o => {
    const next = { ...o, [id]: !o[id] };
    try { localStorage.setItem('cv-inspector-open', JSON.stringify(next)); } catch {}
    return next;
  });
  // Clicking the headshot frame on the page bumps hsFocusTick: unroll the
  // panel if minimised, open the Headshot group, and bring it into view.
  const lastTick = React.useRef(hsFocusTick);
  React.useEffect(() => {
    if (hsFocusTick === lastTick.current) return;
    lastTick.current = hsFocusTick;
    setCollapsed(false);
    setOpenGroups(o => (o.headshot ? o : { ...o, headshot: true }));
    // Wait a frame so the group (and the portal into it) has mounted.
    requestAnimationFrame(() => {
      const el = bodyRef.current && bodyRef.current.querySelector('[data-group=headshot]');
      if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
  }, [hsFocusTick]);

  if (!editOn) return null;
  if (collapsed) {
    return (
      <button type="button" className="panel-reopen tweaks-reopen"
        onClick={toggleCollapsed} title="Show properties">
        <span>Properties</span>
        <span className="chev">▸</span>
      </button>
    );
  }
  const sidebar = cv.sidebar || [];
  const theme = cv.theme || {};
  const order = ensureSectionOrder(cv);
  const sidebarMetaById = Object.fromEntries(sidebar.map(m => [m.id, m]));
  const setOrder = (next) => update(['sectionOrder'], next);
  const setVisible = (i, visible) =>
    setOrder(order.map((s, idx) => idx === i ? { ...s, visible } : s));
  const moveSection = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= order.length) return;
    const next = order.slice();
    [next[i], next[j]] = [next[j], next[i]];
    setOrder(next);
  };
  const setTitle = (i, title) => {
    const sec = order[i];
    if (isMainSectionId(sec.id)) {
      update(['sectionTitles', sec.id], title);
    } else {
      update(['sidebar'], sidebar.map(s => s.id === sec.id ? { ...s, title } : s));
    }
  };
  const duplicateSection = (i) => {
    const sec = order[i];
    if (isMainSectionId(sec.id)) return; // can't duplicate main sections
    const src = sidebarMetaById[sec.id];
    if (!src) return;
    const srcKind = src.kind || src.id;
    const srcDataKey = src.dataKey || srcKind;
    let n = 2;
    while (sidebar.some(s => s.id === `${src.id}_${n}`)) n++;
    const newId = `${src.id}_${n}`;
    let m = 2;
    while (cv[`${srcDataKey}_${m}`] !== undefined) m++;
    const newDataKey = `${srcDataKey}_${m}`;
    const srcData = cv[srcDataKey];
    const cloned = srcData == null
      ? (srcKind === 'additional' ? '' : [])
      : (typeof srcData === 'string' ? srcData : JSON.parse(JSON.stringify(srcData)));
    update([newDataKey], cloned);
    // Append to sidebar metadata (visibility lives in sectionOrder, but keep .visible:true for legacy)
    update(['sidebar'], [...sidebar, {
      id: newId, kind: srcKind, dataKey: newDataKey,
      title: `${src.title} (copy)`, visible: true,
    }]);
    // Insert into sectionOrder right after the source
    const nextOrder = order.slice();
    nextOrder.splice(i + 1, 0, { id: newId, visible: true });
    setOrder(nextOrder);
  };
  const deleteSection = (i) => {
    const sec = order[i];
    if (isMainSectionId(sec.id)) return;
    const meta = sidebarMetaById[sec.id];
    if (!meta || !meta.dataKey) return; // only allow deleting duplicates (those with explicit dataKey)
    if (!confirm(`Delete section "${sectionDisplayTitle(sec.id, cv)}"?`)) return;
    setOrder(order.filter((_, idx) => idx !== i));
    update(['sidebar'], sidebar.filter(s => s.id !== sec.id));
    // Note: leaves cv[meta.dataKey] orphaned; harmless, no UI references it.
  };
  const visibleSections = order.filter(s =>
    s.visible && (isMainSectionId(s.id) || sidebarMetaById[s.id])).length;
  const totalSections = order.filter(s =>
    isMainSectionId(s.id) || sidebarMetaById[s.id]).length;
  const currentTemplate = resolveTemplateId(templateId);
  const currentScheme = matchColorScheme(theme);

  return (
    <div className="tweaks-panel" ref={panelRef}
      style={dragPos ? { left: dragPos.left, top: dragPos.top, right: 'auto', bottom: 'auto' } : undefined}>
      <div className="tweaks-head" onPointerDown={onHeadDown} title="Drag to move this panel">
        <span>Properties</span>
        <span className="tweaks-head-actions">
          {dragPos && (
            <button type="button" onClick={() => setDragPos(null)}
              title="Snap back beside the document">⟲</button>
          )}
          <button type="button" onClick={toggleCollapsed} title="Hide properties">×</button>
        </span>
      </div>
      <div className="tweaks-body" ref={bodyRef}>

      <InspectorGroup id="template" title="Template"
        note={TEMPLATES[currentTemplate].label}
        open={!!openGroups.template} onToggle={toggleGroup}>
        {Object.entries(TEMPLATES).map(([id, t]) => (
          <button key={id} type="button"
            className={`tmpl-opt ${id === currentTemplate ? 'active' : ''}`}
            onClick={() => onTemplateChange && onTemplateChange(id)}>
            <TemplateWireframe templateId={id} size="sm" />
            <span className="name">{t.label}</span>
            {id === currentTemplate && <span className="check">✓</span>}
          </button>
        ))}
        <div style={{ fontSize: 10, opacity: 0.6, paddingTop: 2 }}>
          Switching templates doesn't change your data.
        </div>
      </InspectorGroup>

      <InspectorGroup id="colours" title="Colour scheme"
        note={currentScheme ? currentScheme.name : 'Custom'}
        open={!!openGroups.colours} onToggle={toggleGroup}>
        <div className="swatches">
          {COLOR_SCHEMES.map(s => (
            <div key={s.id} className={`swatch ${currentScheme && currentScheme.id === s.id ? 'active' : ''}`}
              title={s.name} onClick={() => update(['theme'], { ink: s.ink, side: s.side })}>
              <div className="ink" style={{ background: s.ink }} />
              <div className="side" style={{ background: s.side }} />
            </div>
          ))}
        </div>
        <div className="row" style={{ marginTop: 8 }}>
          <span style={{ width: 28, opacity: 0.7 }}>ink</span>
          <input type="text" value={theme.ink || ''} onChange={(e) => update(['theme'], { ...theme, ink: e.target.value })} />
        </div>
        <div className="row">
          <span style={{ width: 28, opacity: 0.7 }}>side</span>
          <input type="text" value={theme.side || ''} onChange={(e) => update(['theme'], { ...theme, side: e.target.value })} />
        </div>
      </InspectorGroup>

      <InspectorGroup id="headshot" title="Headshot"
        note={headshotSrc ? null : 'empty'}
        open={!!openGroups.headshot} onToggle={toggleGroup}>
        {/* HeadshotEditor portals its controls in here; state stays with the frame. */}
        <div ref={onHsSlotRef || undefined} />
      </InspectorGroup>

      <InspectorGroup id="sections" title="Sections"
        note={`${visibleSections}/${totalSections}`}
        open={!!openGroups.sections} onToggle={toggleGroup}>
        {order.map((s, i) => {
          const isMain = isMainSectionId(s.id);
          const meta = sidebarMetaById[s.id];
          const title = sectionDisplayTitle(s.id, cv);
          const exists = isMain || !!meta;
          if (!exists) return null;
          const canDelete = !isMain && meta && meta.dataKey;
          return (
            <div key={s.id} className="row" title={isMain ? 'Built-in section' : 'Custom / sidebar section'}>
              <input type="checkbox" checked={!!s.visible} onChange={(e) => setVisible(i, e.target.checked)} />
              <input type="text" value={title}
                onChange={(e) => setTitle(i, e.target.value)}
                disabled={!s.visible}
                style={isMain ? { fontWeight: 500 } : undefined} />
              <span className="reorder">
                <button onClick={() => moveSection(i, -1)} disabled={i === 0} title="Up">↑</button>
                <button onClick={() => moveSection(i, 1)} disabled={i === order.length - 1} title="Down">↓</button>
                {!isMain && <button onClick={() => duplicateSection(i)} title="Duplicate section (independent copy)">⧉</button>}
                {canDelete && (
                  <button onClick={() => deleteSection(i)} title="Delete this duplicate"
                    style={{ color: '#ff8a6b' }}>×</button>
                )}
              </span>
            </div>
          );
        })}
      </InspectorGroup>

      <InspectorGroup id="credit" title="Footer credit"
        note={cv.showCredit ? 'on' : 'off'}
        open={!!openGroups.credit} onToggle={toggleGroup}>
        <div className="row" title="A small grey line at the bottom of every CV page. Off by default.">
          <input type="checkbox" checked={!!cv.showCredit}
            onChange={(e) => update(['showCredit'], e.target.checked)} />
          <span style={{ fontSize: 11, lineHeight: 1.45, opacity: 0.85 }}>Show footer credit</span>
        </div>
        {!!cv.showCredit && (
          <>
            <div className="row">
              <input type="text" value={cv.creditText || ''}
                placeholder={CREDIT_TEXT_DEFAULT}
                onChange={(e) => update(['creditText'], e.target.value)} />
            </div>
            <div style={{ fontSize: 10, lineHeight: 1.45, opacity: 0.6, paddingTop: 2 }}>
              Write whatever you like, or leave blank for the suggested line.
              Anything that looks like a web address becomes a clickable link in the PDF.
            </div>
          </>
        )}
      </InspectorGroup>

      <InspectorGroup id="tips" title="Tips"
        open={!!openGroups.tips} onToggle={toggleGroup}>
        <div style={{ fontSize: 11, lineHeight: 1.5, opacity: 0.8 }}>
          Click any text to edit. Click the headshot to open its controls here.
          Drag the image to pan; scroll to zoom; the corner handle resizes the frame.
          This panel can be dragged by its title bar.
        </div>
      </InspectorGroup>

      </div>
    </div>
  );
}

function StatusPill({ status }) {

// Close an open popover on outside click or Escape. Was pasted inline in
// three components (one copy had drifted and lost the Escape handler).
function useClickOutside(ref, open, close) {
  React.useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => {
      if (ref.current && !ref.current.contains(e.target)) close();
    };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('mousedown', onDocClick);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDocClick);
      document.removeEventListener('keydown', onKey);
    };
  }, [open]);
}

function OverflowChip({ statuses, selectedCount, totalCount, statusFilters, onToggle, onManage }) {
  const [open, setOpen] = React.useState(false);
  const rootRef = React.useRef(null);
  useClickOutside(rootRef, open, () => setOpen(false));
  const active = selectedCount > 0;
  return (
    <div className="chip-overflow" ref={rootRef}>
      <button type="button"
        className={`status-chip overflow-trigger ${active ? 'active' : ''}`}
        onClick={() => setOpen(o => !o)}
        aria-expanded={open}>
        {active
          ? <>{selectedCount} selected</>
          : <>+{totalCount} more</>}
        <span className="caret">▾</span>
      </button>
      {open && (
        <div className="chip-popover">
          {statuses.map(s => {
            const isOn = statusFilters.has(s.id);
            return (
              <button key={s.id} type="button"
                className={`popover-chip ${isOn ? 'active' : ''}`}
                onClick={() => onToggle(s.id)}
                aria-pressed={isOn}>
                <span className="dot" style={{ background: s.color }} />
                {s.label}
                {isOn && <span className="check">✓</span>}
              </button>
            );
          })}
          <div className="popover-divider" />
          <button type="button" className="popover-manage"
            onClick={() => { setOpen(false); onManage(); }}>
            Manage statuses…
          </button>
        </div>
      )}
    </div>
  );
}

function ManageStatusesModal({ allStatuses, customStatuses, setCustomStatuses, setStatusOrder, onClose, onStatusDeleted }) {
  // Draft holds the full ordered list of statuses (built-ins + customs).
  // Built-ins are detected via `isDefault` so their label/color stay locked.
  const DEFAULT_IDS = new Set(APP_STATUSES.map(s => s.id));
  const [draft, setDraft] = React.useState(() =>
    allStatuses.map(s => ({
      id: s.id,
      label: s.label,
      color: s.color,
      isDefault: DEFAULT_IDS.has(s.id),
    }))
  );
  const [newLabel, setNewLabel] = React.useState('');
  const [newColor, setNewColor] = React.useState(STATUS_COLOR_PALETTE[1]);

  const updateOne = (i, patch) => setDraft(d => d.map((s, idx) => idx === i ? { ...s, ...patch } : s));
  const removeOne = (i) => setDraft(d => d.filter((_, idx) => idx !== i));
  const moveOne = (i, delta) => setDraft(d => {
    const j = i + delta;
    if (j < 0 || j >= d.length) return d;
    const next = d.slice();
    [next[i], next[j]] = [next[j], next[i]];
    return next;
  });
  const addOne = () => {
    const label = newLabel.trim();
    if (!label) return;
    const id = `custom-${genId()}`;
    setDraft(d => [...d, { id, label, color: newColor, isDefault: false }]);
    setNewLabel('');
    setNewColor(STATUS_COLOR_PALETTE[(STATUS_COLOR_PALETTE.indexOf(newColor) + 1) % STATUS_COLOR_PALETTE.length]);
  };
  const save = () => {
    const draftCustoms = draft.filter(s => !s.isDefault).map(({ id, label, color }) => ({ id, label, color }));
    const deletedIds = customStatuses.map(s => s.id).filter(id => !draftCustoms.some(d => d.id === id));
    setCustomStatuses(draftCustoms);
    setStatusOrder(draft.map(s => s.id));
    if (deletedIds.length && onStatusDeleted) {
      deletedIds.forEach(id => onStatusDeleted(id));
    }
    onClose();
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal manage-statuses" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h3>Manage statuses</h3>
          <button className="close" onClick={onClose} aria-label="Close">×</button>
        </div>
        <div className="modal-body">
          <p className="hint">Drag the arrows to reorder. Custom statuses can be renamed, recolored, or removed. Built-in statuses keep their label and color.</p>
          <div className="status-rows">
            {draft.length === 0 && <div className="empty">No statuses defined.</div>}
            {draft.map((s, i) => (
              <div key={s.id} className={`status-row ${s.isDefault ? 'default' : ''}`}>
                {s.isDefault ? (
                  <span className="swatch" style={{ background: s.color }} />
                ) : (
                  <ColorSwatchPicker value={s.color} onChange={(c) => updateOne(i, { color: c })} />
                )}
                {s.isDefault ? (
                  <span className="label">{s.label}</span>
                ) : (
                  <input type="text" value={s.label} onChange={(e) => updateOne(i, { label: e.target.value })}
                    placeholder="Status label" />
                )}
                {s.isDefault && <span className="locked">built-in</span>}
                <button className="icon" onClick={() => moveOne(i, -1)} disabled={i === 0} title="Move up">↑</button>
                <button className="icon" onClick={() => moveOne(i, 1)} disabled={i === draft.length - 1} title="Move down">↓</button>
                {!s.isDefault && (
                  <button className="icon danger" onClick={() => removeOne(i)} title="Remove">×</button>
                )}
              </div>
            ))}
          </div>
          <div className="add-row">
            <ColorSwatchPicker value={newColor} onChange={setNewColor} />
            <input type="text" value={newLabel} onChange={(e) => setNewLabel(e.target.value)}
              placeholder="New status (e.g. Tech screen, Take-home)"
              onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addOne(); } }} />
            <button className="primary" onClick={addOne} disabled={!newLabel.trim()}>Add</button>
          </div>
        </div>
        <div className="modal-foot">
          <button onClick={onClose}>Cancel</button>
          <button className="primary" onClick={save}>Save changes</button>
        </div>
      </div>
    </div>
  );
}

function ColorSwatchPicker({ value, onChange }) {
  const [open, setOpen] = React.useState(false);
  const rootRef = React.useRef(null);
  useClickOutside(rootRef, open, () => setOpen(false));
  return (
    <div className="swatch-picker" ref={rootRef}>
      <button type="button" className="swatch-trigger" style={{ background: value }}
        onClick={() => setOpen(o => !o)} title="Pick a color" aria-haspopup="true" aria-expanded={open} />
      {open && (
        <div className="swatch-popover">
          {STATUS_COLOR_PALETTE.map(c => (
            <button key={c} type="button" className="swatch-option"
              style={{ background: c, outline: c === value ? '2px solid #2a2a26' : 'none', outlineOffset: 1 }}
              onClick={() => { onChange(c); setOpen(false); }} />
          ))}
        </div>
      )}
    </div>
  );
}

function NewApplicationForm({ apps, defaultForkId, onCancel, onSubmit }) {
  const [company, setCompany] = React.useState('');
  const [position, setPosition] = React.useState('');
  const [forkFromId, setForkFromId] = React.useState(defaultForkId || (apps[0] && apps[0].id) || '');
  // Default template = template of the fork source. Updates when fork source changes.
  // Memoised: loadAppCv parses the source's full CV out of localStorage, and this
  // component re-renders on every keystroke in the Company/Position fields.
  const forkSource = apps.find(a => a.id === forkFromId);
  const inheritedTemplateId = React.useMemo(() => {
    const srcCv = forkSource && loadAppCv(forkSource.id);
    return resolveTemplateId(srcCv && srcCv.templateId);
  }, [forkFromId]);
  const [templateId, setTemplateId] = React.useState(inheritedTemplateId);
  const [templateOpen, setTemplateOpen] = React.useState(false);
  const templateRef = React.useRef(null);
  React.useEffect(() => { setTemplateId(inheritedTemplateId); /* re-inherit when source changes */ // eslint-disable-next-line
  }, [forkFromId]);
  useClickOutside(templateRef, templateOpen, () => setTemplateOpen(false));
  const bases = apps.filter(a => a.isBase);
  const others = apps.filter(a => !a.isBase);
  const submit = (e) => {
    if (e) e.preventDefault();
    if (!company.trim() && !position.trim()) {
      alert('Add at least a company or position before creating an application.');
      return;
    }
    if (!forkFromId) {
      alert('Pick an application to fork from.');
      return;
    }
    onSubmit({
      company: company.trim(),
      position: position.trim(),
      forkFromId,
      templateId,
    });
  };
  return (
    <form className="new-app-form" onSubmit={submit}>
      <div className="field">
        <label>Company</label>
        <input type="text" autoFocus value={company} onChange={(e) => setCompany(e.target.value)} placeholder="Acme Inc." />
      </div>
      <div className="field">
        <label>Position</label>
        <input type="text" value={position} onChange={(e) => setPosition(e.target.value)} placeholder="Senior Project Manager" />
      </div>
      <div className="field full">
        <label>Fork from</label>
        <select value={forkFromId} onChange={(e) => setForkFromId(e.target.value)}>
          {bases.length > 0 && (
            <optgroup label="Base applications">
              {bases.map(a => <option key={a.id} value={a.id}>{appDisplayLabel(a)}</option>)}
            </optgroup>
          )}
          {others.length > 0 && (
            <optgroup label="Other applications">
              {others.map(a => <option key={a.id} value={a.id}>{appDisplayLabel(a)}</option>)}
            </optgroup>
          )}
        </select>
        <div className="preview">CV and cover letter will be copied from this application.</div>
      </div>
      <div className="field full">
        <label>Template</label>
        <div className="new-app-template-picker" ref={templateRef}>
          <button type="button" className="picker-trigger" onClick={() => setTemplateOpen(o => !o)}>
            <TemplateWireframe templateId={templateId} size="sm" />
            <span className="name">{TEMPLATES[templateId].label}</span>
            <span className="caret">▾</span>
          </button>
          {templateOpen && (
            <div className="picker-popover">
              {Object.entries(TEMPLATES).map(([id, t]) => (
                <button key={id} type="button"
                  className={`picker-option ${id === templateId ? 'active' : ''}`}
                  onClick={() => { setTemplateId(id); setTemplateOpen(false); }}>
                  <TemplateWireframe templateId={id} size="lg" />
                  <span className="name">{t.label}</span>
                  {id === templateId && <span className="check">✓</span>}
                </button>
              ))}
              <div className="picker-foot">You can change this any time later.</div>
            </div>
          )}
        </div>
      </div>
      <div className="field full actions">
        <button type="button" onClick={onCancel}>Cancel</button>
        <button type="submit" className="primary">Create application</button>
      </div>
    </form>
  );
}

function ApplicationsDocument({ apps, activeAppId, onView, onCreate,
                                onPatch, onPromote, onDemote, onDuplicate, onDelete,
                                customStatuses, setCustomStatuses, setStatusOrder, onStatusDeleted }) {
  const { statuses: allStatuses, byId: allStatusesById } = React.useContext(StatusesContext);
  const [expandedId, setExpandedId] = React.useState(null);
  const [showForm, setShowForm] = React.useState(false);
  const [statusFilters, setStatusFilters] = React.useState(() => new Set());
  const [query, setQuery] = React.useState('');
  const [showManageStatuses, setShowManageStatuses] = React.useState(false);

  const baseCount = apps.filter(a => a.isBase).length;
  const filtersActive = statusFilters.size > 0 || !!query.trim();
  const toggleStatusFilter = (id) => {
    setStatusFilters(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };
  const clearStatusFilters = () => setStatusFilters(new Set());

  const INLINE_CHIPS = 7;
  const inlineStatuses = allStatuses.slice(0, INLINE_CHIPS - 1);
  const overflowStatuses = allStatuses.slice(INLINE_CHIPS - 1);
  const overflowCount = overflowStatuses.length;
  const overflowSelectedCount = overflowStatuses.reduce((n, s) => n + (statusFilters.has(s.id) ? 1 : 0), 0);

  const displayed = React.useMemo(() => {
    let list = apps;
    if (filtersActive) list = list.filter(a => !a.isBase);
    if (statusFilters.size > 0) list = list.filter(a => statusFilters.has(a.status));
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter(a =>
        (a.company || '').toLowerCase().includes(q)
        || (a.position || '').toLowerCase().includes(q)
        || (a.notes || '').toLowerCase().includes(q)
        || (a.postingUrl || '').toLowerCase().includes(q)
      );
    }
    return sortAppsForList(list);
  }, [apps, statusFilters, query, filtersActive]);

  const onSubmitNew = async (params) => {
    const id = await onCreate(params);
    setShowForm(false);
    if (id) setExpandedId(id);
  };

  const renderChip = (s) => {
    const active = statusFilters.has(s.id);
    return (
      <button key={s.id} type="button"
        className={`status-chip ${active ? 'active' : ''}`}
        onClick={() => toggleStatusFilter(s.id)}
        aria-pressed={active}
        style={active ? { borderColor: s.color, background: s.color, color: '#fff' } : undefined}>
        <span className="dot" style={{ background: s.color }} />
        {s.label}
      </button>
    );
  };

  const selectedLabels = Array.from(statusFilters).map(id => (allStatusesById[id] || {}).label).filter(Boolean);

  return (
    <div className="apps-shell">
      <div className="apps-header">
        <h2>Applications</h2>
        {!showForm && (
          <button onClick={() => setShowForm(true)} title="Start a new application by forking an existing one">
            + New application
          </button>
        )}
      </div>
      {showForm && (
        <NewApplicationForm
          apps={apps}
          defaultForkId={(apps.find(a => a.isBase) || apps[0])?.id}
          onCancel={() => setShowForm(false)}
          onSubmit={onSubmitNew}
        />
      )}
      <div className="apps-filters">
        <div className="status-chips" role="group" aria-label="Filter by status">
          <button type="button"
            className={`status-chip ${statusFilters.size === 0 ? 'active' : ''}`}
            onClick={clearStatusFilters}
            title={statusFilters.size > 0 ? 'Clear all status filters' : undefined}>All</button>
          {inlineStatuses.map(renderChip)}
          {overflowCount > 0 && (
            <OverflowChip
              statuses={overflowStatuses}
              selectedCount={overflowSelectedCount}
              totalCount={overflowCount}
              statusFilters={statusFilters}
              onToggle={toggleStatusFilter}
              onManage={() => setShowManageStatuses(true)}
            />
          )}
          {overflowCount === 0 && (
            <button type="button" className="manage-statuses-link"
              onClick={() => setShowManageStatuses(true)}
              title="Add or edit custom statuses">+ Add status</button>
          )}
        </div>
        <div className="apps-search">
          <input type="search" value={query} onChange={(e) => setQuery(e.target.value)}
            placeholder="Search company, position, notes…" aria-label="Search applications" />
          {query && (
            <button type="button" className="clear" onClick={() => setQuery('')} aria-label="Clear search" title="Clear">×</button>
          )}
        </div>
      </div>
      <div className="app-list">
        {displayed.map(app => (
          <ApplicationCard
            key={app.id}
            app={app}
            isActive={app.id === activeAppId}
            expanded={expandedId === app.id}
            onToggle={() => setExpandedId(expandedId === app.id ? null : app.id)}
            onPatch={onPatch}
            onView={(docKind) => onView(app, docKind)}
            onPromote={onPromote}
            onDemote={onDemote}
            onDuplicate={onDuplicate}
            onDelete={() => onDelete(app.id)}
            canDemote={!(app.isBase && baseCount <= 1)}
            canDelete={!(app.isBase && baseCount <= 1)}
          />
        ))}
        {filtersActive && displayed.length === 0 && (
          <div className="apps-empty" style={{ marginTop: 8 }}>
            No applications match {selectedLabels.length > 0 ? <strong>{selectedLabels.join(' / ')}</strong> : 'this search'}
            {selectedLabels.length > 0 && query && ' and the current search'}.
            {' '}
            <button type="button" className="link"
              onClick={() => { clearStatusFilters(); setQuery(''); }}>Clear filters</button>
          </div>
        )}
      </div>
      {showManageStatuses && (
        <ManageStatusesModal
          allStatuses={allStatuses}
          customStatuses={customStatuses}
          setCustomStatuses={setCustomStatuses}
          setStatusOrder={setStatusOrder}
          onClose={() => setShowManageStatuses(false)}
          onStatusDeleted={onStatusDeleted}
        />
      )}
    </div>
  );
}
